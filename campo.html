/* ═══════════════════════ UTILIDADES ═══════════════════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const nrm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const up=s=>String(s??'').toUpperCase().replace(/\s+/g,' ').trim();
const f0=n=>Number(n).toLocaleString('es-PE',{maximumFractionDigits:0});
const hoyIso=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
const fd=v=>{if(!v)return'';const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:String(v);};
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));
function toast(t,ms){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms||2800);}
/* Código del colaborador: inicial del primer nombre + apellido paterno (GONZALO LLANA RARAZ → GLLANA) */
function codigoBase(nombres,apPat){const n=nrm(nombres).split(' ')[0]||'', a=nrm(apPat).replace(/[^A-Z]/g,'');return (n[0]||'')+a;}

/* ═══════════════════════ ALMACÉN LOCAL (IndexedDB) ═══════════════════════
   kv:   copia de equipos, colaboradores, datos maestros, desfases, perfil
   cola: registros por enviar (con sus fotos)                             */
const DB=(()=>{let db=null;
  const abrir=()=>db?Promise.resolve(db):new Promise((ok,ko)=>{const r=indexedDB.open('gllr_campo',1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('cola'))d.createObjectStore('cola',{keyPath:'id'});};
    r.onsuccess=()=>{db=r.result;ok(db);};r.onerror=()=>ko(r.error);});
  const tx=(st,m,fn)=>abrir().then(d=>new Promise((ok,ko)=>{const t=d.transaction(st,m),s=t.objectStore(st),req=fn(s);t.oncomplete=()=>ok(req&&req.result);t.onerror=()=>ko(t.error);}));
  return {get:k=>tx('kv','readonly',s=>s.get(k)),set:(k,v)=>tx('kv','readwrite',s=>s.put(v,k)),
    cola:()=>tx('cola','readonly',s=>s.getAll()),poner:o=>tx('cola','readwrite',s=>s.put(o)),quitar:id=>tx('cola','readwrite',s=>s.delete(id))};})();

/* ═══════════════════════ ESTADO ═══════════════════════ */
const S={user:null,perfil:null,col:null,obra:'',EQ:[],COL:[],MAE:[],REC:[],COLA:[],pant:'cargando',pila:[],F:{},online:navigator.onLine};
const M=(tipo,esp)=>S.MAE.filter(m=>m.tipo===tipo&&m.activo!==false&&(!esp||!m.especialidad||m.especialidad===esp)).sort((a,b)=>(a.orden||0)-(b.orden||0));
const MV=(tipo,esp)=>M(tipo,esp).map(m=>m.valor);
const eqDe=c=>S.EQ.find(e=>e.cod_sap===c)||null;
const colDe=c=>S.COL.find(x=>x.codigo===c)||null;

/* ═══════════════════════ RED ═══════════════════════ */
function pintarNet(){const n=$('net');n.className='net '+(S.online?'on':'off');n.textContent=S.online?'● En línea':'○ Sin señal';}
addEventListener('online',()=>{S.online=true;pintarNet();sincronizar();});
addEventListener('offline',()=>{S.online=false;pintarNet();});

/* ═══════════════════════ DATOS ═══════════════════════ */
async function cargarCache(){
  const [eq,co,ma,df,pe,rc]=await Promise.all(['eq','col','mae','dsf','perfil','rec'].map(k=>DB.get(k).catch(()=>null)));
  S.EQ=eq||[];S.COL=co||[];S.MAE=ma||[];S.REC=rc||[];if(df&&window.GLLR_DSF)GLLR_DSF.lista=df;if(pe)S.perfil=pe;
  S.COLA=await DB.cola().catch(()=>[]);
}
async function refrescarDatos(){
  if(!S.online)return;
  try{
    const [eq,co,ma]=await Promise.all([
      sb.from('maestro').select('id,cod_sap,equipo,marca,modelo,cod_proyec,familia,status,contador,hrkm_actual,fecha_lectura,hr_dia,hrkm_ult_mntto,frecuencia').order('cod_sap'),
      sb.from('pdm_colaboradores').select('*').eq('activo',true).order('ap_paterno'),
      sb.from('pdm_maestros').select('*').eq('activo',true)]);
    if(!eq.error){S.EQ=eq.data||[];DB.set('eq',S.EQ);}
    if(!co.error){S.COL=co.data||[];DB.set('col',S.COL);}
    if(!ma.error){S.MAE=ma.data||[];DB.set('mae',S.MAE);}
    if(window.GLLR_DSF){await GLLR_DSF.cargar(sb);DB.set('dsf',GLLR_DSF.lista);}
    if(co.error&&/relation|does not exist|schema cache/i.test(co.error.message))toast('Falta crear las tablas: ejecuta pdm_tablas.sql en Supabase',6000);
  }catch(e){console.warn(e);}
}
const obras=()=>[...new Set(S.EQ.map(e=>e.cod_proyec).filter(Boolean))].sort();
const obrasAlta=()=>{const L=new Set([...(S.OBRAS||[]),...obras()]);return [...L].filter(Boolean).sort();};
async function cargarObras(){try{const c=await DB.get('obras').catch(()=>null);if(c&&!S.OBRAS)S.OBRAS=c;if(!S.online)return;const {data,error}=await sb.rpc('pdm_obras_activas');if(!error&&data){S.OBRAS=data.map(x=>typeof x==='string'?x:(x.pdm_obras_activas||x.obra||Object.values(x)[0]));DB.set('obras',S.OBRAS);if(['alta','perfil'].includes(S.pant)){guardarCampos();pintar();}}}catch(_){}}
const eqObra=()=>S.EQ.filter(e=>!S.obra||e.cod_proyec===S.obra);

/* ═══════════════════════ SESIÓN ═══════════════════════ */
async function arrancar(){
  pintarNet(); await cargarCache();
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ir('login',true);return;}
  S.user=session.user;
  if(S.online){
    const {data:p,error}=await sb.from('profiles').select('id,nombre,rol,estado,paginas,email').eq('id',S.user.id).single();
    if(!error&&p){S.perfil=p;DB.set('perfil',p);}
  }
  if(!S.perfil){ir('login',true);return;}
  if(S.perfil.estado!=='aprobado'||(S.perfil.rol!=='admin'&&!(Array.isArray(S.perfil.paginas)&&S.perfil.paginas.includes('campo')))){ir('espera',true);return;}
  await refrescarDatos();
  S.col=S.COL.find(c=>c.user_id===S.user.id)||(await DB.get('yo'))||null;
  if(!S.col&&S.online){ // registro pendiente desde la pantalla de alta
    let pend=null;try{pend=JSON.parse(localStorage.getItem('campo_alta')||'null');}catch(_){}
    if(pend&&nrm(pend.email)===nrm(S.user.email)){await crearColaborador(pend,S.user.id);localStorage.removeItem('campo_alta');}
  }
  if(!S.col){ir('perfil',true);return;}
  DB.set('yo',S.col);
  S.obra=localStorage.getItem('campo_obra')||S.col.obra||obras()[0]||'';
  ir('home',true); sincronizar();
}
async function crearColaborador(d,userId){
  const base=codigoBase(d.nombres,d.ap_paterno); if(!base)return null;
  let codigo=base, otros=S.COL.map(c=>c.codigo);
  if(S.online){const {data}=await sb.from('pdm_colaboradores').select('codigo').ilike('codigo',base+'%');if(data)otros=otros.concat(data.map(x=>x.codigo));}
  if(otros.includes(codigo)){const m=nrm(d.ap_materno)[0]; if(m&&!otros.includes(base+m))codigo=base+m; else{let i=2;while(otros.includes(base+i))i++;codigo=base+i;}}
  const fila={nombres:up(d.nombres),ap_paterno:up(d.ap_paterno),ap_materno:up(d.ap_materno)||null,codigo,user_id:userId||null,obra:up(d.obra)||null,especialidad:d.especialidad||null};
  const {data,error}=await sb.from('pdm_colaboradores').insert(fila).select().single();
  if(error){toast('No se pudo registrar el colaborador: '+error.message,6000);return null;}
  S.COL.push(data);DB.set('col',S.COL);if(userId){S.col=data;DB.set('yo',data);}
  return data;
}

const MODS=[['MECANICO','Mecánico'],['LUBRICACION','Lubricación'],['LLANTAS','Llantas'],['GETS','GETs'],['MNTTO_PREV','PM'],['PENDIENTE','Pendiente']];
const gridReg=(fn)=>`<div class="acts">${MODS.map(([k,l])=>`<div class="act" onclick="${fn(k)}"><div class="ic"><img src="${ICO[k]}" alt=""></div>${l}</div>`).join('')}</div>`;
const svg=k=>`<svg viewBox="0 0 24 24">${IC[k]||''}</svg>`;
const AVC={MECANICO:'a1',LUBRICACION:'a2',LLANTAS:'a3',GETS:'a4',MNTTO_PREV:'a5',PENDIENTE:'a6'};
const TABS=[];
const FORMS=['MECANICO','LUBRICACION','LLANTAS','GETS','MNTTO_PREV','PENDIENTE'];
function li(av,ic,t,sub,der,on){return `<div class="li" ${on?`onclick="${on}"`:''}><div class="av ${av}">${svg(ic)}</div><div class="tx"><b>${t}</b><small>${sub}</small></div>${der||''}<span class="chev">${svg('chev')}</span></div>`;}

function ir(p,raiz){if(!raiz){S.pila.push(S.pant);hPush();}else S.pila=[];S.pant=p;if(!['hecho'].includes(p))S.F=nuevoF();pintar();$('main').scrollTop=0;}
function atras(){if(S.pila.length){S.pant=S.pila.pop();pintar();}}
$('bk').onclick=volver;
/* botón "atrás" del celular: retrocede entre pantallas; en el inicio pregunta antes de salir */
function volver(){if(S.pila.length)history.back();else pedirSalir();}
let _saliendo=false,_D=0;
function hPush(){try{history.pushState({r:1},'');_D++;}catch(_){}}
try{history.replaceState({r:0},'');}catch(_){} hPush();
window.addEventListener('popstate',()=>{_D=Math.max(0,_D-1);if(_saliendo)return;
  if(document.getElementById('dlgSalir')){cerrarSalir();hPush();return;}
  if(S.pila.length){atras();return;}
  hPush(); pedirSalir();});
function pedirSalir(){if(document.getElementById('dlgSalir'))return;const d=document.createElement('div');d.id='dlgSalir';d.className='dlg';
  d.innerHTML=`<div class="dlgc"><b>¿Salir de REPORTE?</b><p>${S.COLA.some(x=>!x.enviado)?'Tienes registros por enviar; se enviarán cuando vuelvas a abrir la app con señal.':'Puedes volver a abrirla desde el ícono.'}</p>
   <div class="dlgb"><button class="btn b-g" onclick="cerrarSalir()">Quedarme</button><button class="btn b-y" onclick="salirApp()">Salir</button></div></div>`;
  document.body.appendChild(d);}
function cerrarSalir(){const d=document.getElementById('dlgSalir');if(d)d.remove();}
function salirApp(){cerrarSalir();_saliendo=true;try{window.close();}catch(_){}history.go(-(_D+1));setTimeout(()=>{_saliendo=false;},1500);}
function nuevoF(){const yo=S.col?[S.col.codigo]:[];return {tec:yo,ins:[],fotos:[],firma:[],ch:{}};}
const TIT={cargando:'REPORTE',login:'Ingresar',alta:'Registro de colaborador',espera:'Cuenta en revisión',perfil:'Mis datos',home:'Inicio',reporte:'Reporte',
  MECANICO:'1 · Reporte mecánico',LUBRICACION:'2 · Lubricación',LLANTAS:'3 · Llantas',GETS:'4 · GETs',MNTTO_PREV:'5 · Mntto preventivo',PENDIENTE:'Nuevo pendiente',
  pend:'Pendientes',consulta:'Ficha del equipo',envios:'Envíos',hecho:'Registro guardado',mas:'Mi cuenta'};
TIT.home='REPORTE MECÁNICO';TIT.reporte='Nuevo reporte';
function pintar(){
  $('tit').textContent=TIT[S.pant]||'REPORTE';
  $('sub').textContent=S.col?`${S.col.codigo} · ${S.obra||'sin obra'}`:'';
  $('bk').style.display=S.pila.length?'':'none';
  const enTab=!!S.col&&TABS.some(t=>t[0]===S.pant), enForm=FORMS.includes(S.pant);
  $('tabs').classList.toggle('hide',!enTab); $('pie').classList.toggle('hide',!enForm);
  $('nav2').classList.toggle('hide',!(S.col&&!enForm&&!['home','login','alta','espera','cargando'].includes(S.pant)));
  if(enTab)$('tabs').innerHTML=TABS.map(t=>`<a class="${S.pant===t[0]?'on':''}" onclick="ir('${t[0]}',true)">${svg(t[1])}<span>${t[2]}</span></a>`).join('');
  $('hlogo').style.display=S.pila.length?'none':''; $('hRef').style.display='none'; $('btnGuardar').disabled=false;
  $('main').classList.toggle('full',['reporte','mas'].includes(S.pant));
  $('main').innerHTML=(P[S.pant]||(()=>''))();
  if(AFTER[S.pant])AFTER[S.pant]();
  initFirma(); initUpper();
}
function marcarVacios(){document.querySelectorAll('select.fill').forEach(x=>{const f=()=>x.classList.toggle('sinval',!x.value);f();x.addEventListener('change',f);});}
function initUpper(){document.querySelectorAll('input.up,textarea.up').forEach(i=>i.addEventListener('input',()=>{const p=i.selectionStart;i.value=i.value.toUpperCase();try{i.setSelectionRange(p,p);}catch(_){}}));}

const opts=(arr,sel,ph)=>(ph!=null?`<option value="">${ph}</option>`:'')+arr.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('');
function chips(k,arr,def,cls){ if(S.F.ch[k]==null&&def!=null)S.F.ch[k]=def;
  return `<div class="chips" data-ch="${k}">${arr.map(v=>`<span class="${S.F.ch[k]===v?'on':''} ${v==='OPERATIVO'?'op':v==='INOPERATIVO'?'in':''}" data-v="${esc(v)}">${esc(v)}</span>`).join('')}</div>`;}
document.addEventListener('click',ev=>{const s=ev.target.closest('.chips span');if(!s)return;const box=s.parentElement,k=box.dataset.ch;if(!k)return;
  S.F.ch[k]=s.dataset.v;box.querySelectorAll('span').forEach(x=>x.classList.toggle('on',x===s));if(box.dataset.re!=null||RE_CH.includes(k)){guardarCampos();pintar();}});
const RE_CH=['esp','trabLL','neuN'];
/* lee los campos visibles a S.F para no perderlos al repintar */
function guardarCampos(){document.querySelectorAll('[data-k]').forEach(i=>{S.F[i.dataset.k]=i.type==='checkbox'?i.checked:i.value;});}
const val=k=>{const i=document.querySelector(`[data-k="${k}"]`);return i?(i.type==='checkbox'?i.checked:i.value):S.F[k];};
const vF=(k,d)=>S.F[k]!=null?S.F[k]:(d??'');

function cabecera(conHr){
  const lista=eqObra(); if(!S.F.eq&&lista.length===1)S.F.eq=lista[0].cod_sap;
  const e=eqDe(S.F.eq), ahora=new Date(), hh=ahora.toTimeString().slice(0,5);
  if(S.F.ch.turno==null)S.F.ch.turno=(ahora.getHours()>=7&&ahora.getHours()<19)?'DIA':'NOCHE';
  return `<div class="c"><div class="sec">Equipo y tiempo</div>
   <label>Equipo · obra ${esc(S.obra||'—')}</label>
   <input list="dlEq" data-k="eqTxt" value="${esc(vF('eqTxt',e?e.cod_sap+' · '+(e.equipo||''):''))}" placeholder="Escribe el código o el nombre" onchange="elegirEq(this.value)" autocomplete="off">
   <datalist id="dlEq">${lista.map(x=>`<option value="${esc(x.cod_sap)} · ${esc(x.equipo||'')} ${esc(x.modelo||'')}">`).join('')}</datalist>
   <div class="dim" id="eqInfo">${e?`${esc(e.marca||'')} ${esc(e.modelo||'')} · último ${e.contador==='Km'?'KM':'HR'}: ${e.hrkm_actual!=null?f0(e.hrkm_actual):'—'}${e.fecha_lectura?' ('+fd(e.fecha_lectura)+')':''}`:'Elige un equipo de la lista'}</div>
   ${conHr?`<label>${e&&e.contador==='Km'?'Kilometraje':'Horómetro'} del tablero</label><input type="number" inputmode="numeric" data-k="hr" value="${esc(vF('hr'))}" oninput="chkHr()"><div id="hrMsg" class="dim"></div>`:''}
   <div class="r2"><div><label>Fecha</label><input type="date" data-k="fecha" value="${esc(vF('fecha',hoyIso()))}"></div><div><label>Turno</label>${chips('turno',['DIA','NOCHE'])}</div></div>
   <div class="r2"><div><label>Hora inicio</label><input type="time" data-k="hini" value="${esc(vF('hini',hh))}"></div><div><label>Hora fin</label><input type="time" data-k="hfin" value="${esc(vF('hfin'))}"></div></div>
   <label>Técnicos que participaron (un solo registro para todos)</label>
   <input class="up" placeholder="Buscar por nombre o código" oninput="filtrarTec(this.value)" style="margin-bottom:6px">
   <div class="tec" id="tecs">${tecChips()}</div>
   <div class="dim" style="margin-top:4px">Seleccionados: <b id="tecSel">${S.F.tec.join(', ')||'—'}</b></div>
  </div>`;}
function tecChips(q){const L=S.COL.slice().sort((a,b)=>(S.F.tec.includes(b.codigo)-S.F.tec.includes(a.codigo))||((b.obra===S.obra)-(a.obra===S.obra))||a.ap_paterno.localeCompare(b.ap_paterno));
  const qq=nrm(q||'');
  return L.filter(c=>!qq||S.F.tec.includes(c.codigo)||nrm(c.codigo+' '+c.nombres+' '+c.ap_paterno+' '+(c.ap_materno||'')).includes(qq)).slice(0,30)
   .map(c=>`<span class="${S.F.tec.includes(c.codigo)?'on':''}" onclick="tglTec('${esc(c.codigo)}')"><b>${esc(c.codigo)}</b> · ${esc(c.nombres.split(' ')[0])} ${esc(c.ap_paterno)}</span>`).join('')||'<span class="dim">Sin colaboradores registrados</span>';}
function filtrarTec(q){$('tecs').innerHTML=tecChips(q);}
function tglTec(c){const i=S.F.tec.indexOf(c);if(i>=0)S.F.tec.splice(i,1);else S.F.tec.push(c);$('tecs').innerHTML=tecChips(document.querySelector('#tecs').previousElementSibling.value);$('tecSel').textContent=S.F.tec.join(', ')||'—';}
function elegirEq(v){const c=String(v).split('·')[0].trim().toUpperCase();const e=eqDe(c)||S.EQ.find(x=>nrm(x.cod_sap)===nrm(c));
  guardarCampos(); if(e){S.F.eq=e.cod_sap;S.F.eqTxt=e.cod_sap+' · '+(e.equipo||'');} else {S.F.eq=null;} pintar();}
function chkHr(){const m=$('hrMsg');if(!m)return;const e=eqDe(S.F.eq),v=Number(val('hr'));S.F.hrConv=null;
  if(!e||!val('hr')){m.className='dim';m.textContent='';return;}
  if(window.GLLR_DSF&&GLLR_DSF.de(e.cod_sap).length){const c=GLLR_DSF.clasificar(e.cod_sap,val('fecha')||hoyIso(),v,e);
    if(c.tipo==='panel'){m.className='hint';m.innerHTML=`⟲ Lectura de panel: se guardará <b>${f0(c.v)} horas máquina</b>`;S.F.hrConv=c;return;}
    if(c.tipo==='duda'){m.className='warn';m.innerHTML=`⚠ No coincide con lo esperado${c.exp!=null?' (~'+f0(c.exp)+' horas máquina)':''}. Al guardar se preguntará si es panel u horas máquina.`;return;}}
  const ult=+e.hrkm_actual||0;
  if(ult&&v<ult){m.className='warn';m.innerHTML=`⚠ Menor que la última lectura (${f0(ult)}). Revisa el número.`;}
  else if(ult&&v-ult>(e.contador==='Km'?3000:300)){m.className='warn';m.innerHTML=`⚠ Avanza ${f0(v-ult)} desde la última lectura: revisa el número.`;}
  else{m.className='dim';m.textContent=ult?`Avanza ${f0(v-ult)} desde la última lectura`:'';}}
function insumos(tipo,esp,tit){ const L=M(tipo,esp); const def=L[0];
  if(!S.F.ins.length&&def)S.F.ins=[{n:'',q:'',u:''}];
  return `<div class="c"><div class="sec">${tit}</div>
   ${S.F.ins.map((x,i)=>`<div class="it"><select onchange="cambiaIns(${i},this.value,'${tipo}','${esp||''}')"><option value="">— elegir —</option>${L.map(m=>`<option ${m.valor===x.n?'selected':''}>${esc(m.valor)}</option>`).join('')}<option ${x.n==='NINGUNO'?'selected':''}>NINGUNO</option></select>
     <input type="number" inputmode="decimal" placeholder="Cant." value="${esc(x.q)}" oninput="S.F.ins[${i}].q=this.value"><select onchange="S.F.ins[${i}].u=this.value">${opts(MV('UNIDAD'),x.u,'')}</select><span class="x" onclick="guardarCampos();S.F.ins.splice(${i},1);pintar()">✕</span></div>`).join('')}
   <span class="add" onclick="guardarCampos();S.F.ins.push({n:'',q:'',u:''});pintar()">+ agregar otro</span>
   <div class="dim">La unidad se pone sola según el insumo; se puede cambiar.</div></div>`;}
function cambiaIns(i,v,tipo,esp){const m=M(tipo,esp||null).find(x=>x.valor===v);S.F.ins[i].n=v;if(m&&m.unidad)S.F.ins[i].u=m.unidad;else if(v==='NINGUNO')S.F.ins[i].u='';guardarCampos();pintar();}
function cierre(){return `<div class="c"><div class="sec">Foto (opcional, máx. 3) y firma</div>
   <div class="fotos">${S.F.fotos.map((f,i)=>`<div style="background-image:url(${f.url})"><i onclick="event.stopPropagation();S.F.fotos.splice(${i},1);guardarCampos();pintar()">✕</i></div>`).join('')}${S.F.fotos.length<3?`<div onclick="guardarCampos();$('inFoto').click()">📷</div>`:''}</div>
   <label>Observación adicional</label><textarea class="up" rows="2" data-k="obs">${esc(vF('obs'))}</textarea>
   <label>Firma de quien registra (${esc(S.col?S.col.codigo:'')})</label><canvas class="firma" id="firma"></canvas><span class="add" onclick="S.F.firma=[];initFirma()">Borrar firma</span>
</div>`;}
/* fotos: se comprimen en el celular (máx. 1280 px, JPEG ~70%) */
$('inFoto').onchange=async()=>{const f=$('inFoto').files[0];$('inFoto').value='';if(!f)return;
  try{const b=await comprimir(f);S.F.fotos.push({blob:b,url:URL.createObjectURL(b)});pintar();toast(`📷 Foto lista (${Math.round(b.size/1024)} KB)`);}catch(e){toast('No se pudo leer la foto');}};
function comprimir(file){return new Promise((ok,ko)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>b?ok(b):ko(),'image/jpeg',0.7);URL.revokeObjectURL(img.src);};img.onerror=ko;img.src=URL.createObjectURL(file);});}
/* firma: se guarda el trazo como texto liviano (no imagen) */
function initFirma(){const c=$('firma');if(!c)return;const r=c.getBoundingClientRect();c.width=r.width;c.height=r.height;const x=c.getContext('2d');x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#1F3864';
  const W=c.width,H=c.height;const dib=()=>{x.clearRect(0,0,W,H);S.F.firma.forEach(tr=>{x.beginPath();tr.forEach((p,i)=>{const X=p[0]/300*W,Y=p[1]/100*H;i?x.lineTo(X,Y):x.moveTo(X,Y);});x.stroke();});};dib();
  let d=null;const pt=e=>{const b=c.getBoundingClientRect();return [Math.round((e.clientX-b.left)/b.width*300),Math.round((e.clientY-b.top)/b.height*100)];};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);d=[pt(e)];S.F.firma.push(d);};
  c.onpointermove=e=>{if(!d)return;const p=pt(e),q=d[d.length-1];if(Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])<2)return;d.push(p);dib();};
  c.onpointerup=c.onpointercancel=()=>{d=null;};}
const firmaTxt=()=>S.F.firma.filter(t=>t.length>1).map(t=>t.map(p=>p.join(',')).join(' ')).join('|');

/* ═══════════════════════ ENVÍO (sincronización) ═══════════════════════ */
let _sync=false;
async function sincronizar(manual){
  if(_sync||!S.online)return;_sync=true;let ok=0,err=0;
  try{
    const {data:{session}}=await sb.auth.getSession(); if(!session){_sync=false;return;}
    for(const it of S.COLA.filter(x=>!x.enviado)){
      try{
        const rutas=[];
        for(let i=0;i<(it.fotos||[]).length;i++){
          const ruta=`${it.reg.obra||'SIN-OBRA'}/${it.reg.fecha}/${it.id}_${i+1}.jpg`;
          const {error}=await sb.storage.from('pdm-fotos').upload(ruta,it.fotos[i],{contentType:'image/jpeg',upsert:true});
          if(error)throw new Error('Foto: '+error.message); rutas.push(ruta);
        }
        const fila={...it.reg,fotos:rutas.length?rutas:null}; delete fila.created_local;
        const {error}=await sb.from('pdm_registros').upsert(fila,{onConflict:'id',ignoreDuplicates:true});
        if(error)throw error;
        it.enviado=true;it.error=null;it.reg.fotos=rutas.length?rutas:null;it.enviado_en=new Date().toISOString();ok++;
        S.REC.unshift({...it.reg});S.REC=S.REC.slice(0,300);
      }catch(e){it.error=e.message||String(e);err++;}
      await DB.poner(it);
    }
    // se limpian los enviados con más de 7 días
    const lim=Date.now()-7*86400000;
    for(const it of S.COLA.filter(x=>x.enviado&&new Date(x.enviado_en||0).getTime()<lim)){await DB.quitar(it.id);}
    S.COLA=S.COLA.filter(x=>!(x.enviado&&new Date(x.enviado_en||0).getTime()<lim));
    DB.set('rec',S.REC);
  }finally{_sync=false;}
  if(ok&&S.pant!=='hecho')toast(`⇅ ${ok} registro(s) enviados`);
  if(err&&manual)toast(`${err} registro(s) no se pudieron enviar: revisa Envíos`,5000);
  if(['home','envios'].includes(S.pant))pintar();
}
setInterval(()=>{if(S.online&&S.COLA.some(x=>!x.enviado))sincronizar();},60000);

function nombreCol(c){const x=colDe(c);return x?c:c;}
function textoWA(r,foto){
  const e=eqDe(r.cod_sap)||{}, d=r.detalle||{}, T=[];
  const hh=v=>String(v||'').slice(0,5);
  // trabajos realizados (según el área)
  const t0=[r.trabajo,r.modulo==='MECANICO'&&r.sistema?'('+r.sistema+(r.componente?' · '+r.componente:'')+')':''].filter(Boolean).join(' ');
  if(r.modulo!=='MNTTO_PREV'&&t0)T.push(t0);
  if(r.descripcion)T.push('Falla: '+r.descripcion);
  if(r.modulo==='LUBRICACION'&&d.punto)T.push('Punto: '+d.punto);
  if(r.modulo==='LLANTAS'){(d.posiciones||[]).forEach(q=>T.push(`P${q.pos}: ${q.cocada!=null?q.cocada+' mm':'—'}${q.presion!=null?' · '+q.presion+' psi':''}${q.torque!=null?' · '+q.torque+' N·m':''}`));
    if(d.cambio)T.push(`Llanta nueva P${d.cambio.pos||'?'}: ${[d.cambio.marca,d.cambio.medida,d.cambio.diseno,d.cambio.estado].filter(Boolean).join(' · ')}${d.cambio.serie?' · S/N '+d.cambio.serie:''}`);}
  if(r.modulo==='GETS'){if(d.implemento)T.push('Implemento: '+d.implemento);(d.componentes||[]).forEach(c=>T.push(`${c.n}${c.cant!=null?' × '+c.cant:''}${c.desgaste!=null?' · desgaste '+c.desgaste+'%':''}`));}
  if(r.modulo==='MNTTO_PREV'){if(r.trabajo)T.push(r.trabajo);(d.tareas||[]).forEach(x=>T.push(x));}
  if(r.insumos&&r.insumos.length)T.push('Insumos: '+r.insumos.map(x=>`${x.n}${x.q!=null&&x.q!==''?' '+x.q+' '+(x.u||''):''}`.trim()).join(', '));
  if(r.observacion)T.push('Obs.: '+r.observacion);
  const L=[];
  L.push(`∙ Equipo: ${r.cod_sap}`);
  L.push(`∙ ${e.contador==='Km'?'Kilometraje':'Horómetro'}: ${r.hrkm!=null?f0(r.hrkm):'—'}`);
  L.push(`∙ Fecha: ${fd(r.fecha)}`);
  L.push(`∙ Hora: ${hh(r.hora_ini)}${r.hora_fin?' – '+hh(r.hora_fin):''}`);
  L.push(' ');
  L.push('∙ Trabajos realizados:');
  T.forEach(x=>L.push('   - '+x)); if(!T.length)L.push(' ');
  L.push(`∙ Estado: ${r.estado_equipo||'—'}`);
  L.push(`∙ Técnicos: ${(r.tecnicos||[]).join(', ')}`);
  L.push('━━━━━━━━━━━━━━━━');
  L.push(`Foto:${foto?' '+foto:' sin foto'}`);
  return L.join('\n');
}
const _furl=new Map();
function fotosDe(r){const it=S.COLA.find(x=>x.id===r.id);return (it&&it.fotos||[]).filter(Boolean).map(b=>{if(!_furl.has(b))_furl.set(b,URL.createObjectURL(b));return _furl.get(b);});}

async function whatsapp(r){
  const it=S.COLA.find(x=>x.id===r.id), blobs=(it&&it.fotos||[]).filter(Boolean);
  const files=blobs.map((b,i)=>new File([b],`${r.cod_sap}_${fd(r.fecha).replace(/\//g,'-')}_${i+1}.jpg`,{type:'image/jpeg'}));
  // 1) celular moderno: menú Compartir con texto + fotos (elige WhatsApp)
  if(files.length&&navigator.canShare&&navigator.canShare({files})){
    const txt=textoWA(r,files.length===1?'adjunta':files.length+' adjuntas');
    try{await navigator.clipboard.writeText(txt);}catch(_){}
    try{await navigator.share({files,text:txt});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  // 2) sin opción de adjuntar: enlace a la foto (válido 7 días) o aviso
  let foto='';

  return '<option value="">— elegir equipo —</option>'+L.map(x=>`<option value="${esc(x.cod_sap)}" ${S.F.cq===x.cod_sap?'selected':''}>${esc(x.cod_sap)} · ${esc(x.equipo||'')} ${esc(x.modelo||'')}</option>`).join('');}
const ESPN={MECANICO:'Mecánico',SOLDADOR:'Soldador',ELECTRICISTA:'Electricista',LUBRICADOR:'Lubricador',LLANTERO:'Llantero'};
const espDe=r=>ESPN[r.especialidad]||({LUBRICACION:'Lubricador',LLANTAS:'Llantero'}[r.modulo])||'Mecánico';
const SOSP={CRITICO:['p-b','Crítico'],PRECAUCION:['p-w','Precaución'],NORMAL:['p-ok','Normal']};
async function consultar(){const c=String(S.F.cq||'').split('·')[0].trim().toUpperCase(), e=eqDe(c), box=$('cqRes');if(!box)return;
  if(!c){box.innerHTML='';return;} if(!e){box.innerHTML='<div class="c dim">Equipo no encontrado.</div>';return;}
  const u=e.contador==='Km'?'km':'h';
  const prox=+e.frecuencia?(+e.hrkm_ult_mntto||0)+(+e.frecuencia):null, rest=prox!=null&&e.hrkm_actual!=null?prox-(+e.hrkm_actual):null;
  const dsf=window.GLLR_DSF&&GLLR_DSF.de(e.cod_sap).length;
  const pct=rest==null?0:Math.max(0,Math.min(100,100-rest/(+e.frecuencia)*100));
  box.innerHTML=`<div class="hero"><div class="dim">${esc(e.equipo||'')} · ${esc(e.marca||'')} ${esc(e.modelo||'')}</div><div class="code">${esc(e.cod_sap)}</div>
    <div class="stats"><div class="st"><span>${e.contador==='Km'?'Kilometraje':'Horómetro'}</span><b>${e.hrkm_actual!=null?f0(e.hrkm_actual)+' '+u:'—'}</b>${dsf?'<small class="pill p-a">⟲ desfase</small>':''}</div>
     <div class="st"><span>Próximo PM</span><b style="color:${rest==null?'inherit':rest<0?'#f87171':rest<(+e.frecuencia*0.1)?'#fbbf24':'#4ade80'}">${rest==null?'—':rest<0?'vencido '+f0(-rest):'faltan '+f0(rest)}</b>${rest==null?'':`<div class="pbar"><i style="width:${pct}%;background:${rest<0?'#ef4444':rest<(+e.frecuencia*0.1)?'#f59e0b':'#22c55e'}"></i></div>`}</div>
     <div class="st"><span>SOS aceite</span><b id="cqSos">…</b></div><div class="st"><span>Pendientes</span><b id="cqPend">…</b></div></div></div>
    <div class="lblc">Historial</div><div id="cqL" class="tlx dim">${S.online?'Cargando…':''}</div>`;
  // pendientes abiertos del equipo
  let np=(S.PEND||[]).filter(p=>p.cod_sap===e.cod_sap).length;
  if(S.online){const {data}=await sb.from('pdm_registros').select('id').eq('cod_sap',e.cod_sap).eq('backlog_estado','ABIERTO').eq('anulado',false);if(data)np=data.length;}
  if($('cqPend'))$('cqPend').textContent=np?np+(np===1?' abierto':' abiertos'):'ninguno';
  // último resultado SOS (el peor estado entre los últimos de cada sistema)
  let sos=(await DB.get('sos_'+e.cod_sap).catch(()=>null))||null;
  if(S.online){const {data}=await sb.from('sos_muestras').select('sistema,estado_std,f_muestreo').eq('cod_sap',e.cod_sap).order('f_muestreo',{ascending:false}).limit(80);
    if(data){const ult={};data.forEach(m=>{const k=m.sistema||'-';if(!ult[k]||String(m.f_muestreo)>String(ult[k].f_muestreo))ult[k]=m;});
      const rk={CRITICO:3,PRECAUCION:2,NORMAL:1};sos=Object.values(ult).sort((a,b)=>(rk[b.estado_std]||0)-(rk[a.estado_std]||0)||String(b.f_muestreo).localeCompare(String(a.f_muestreo)))[0]||null;DB.set('sos_'+e.cod_sap,sos);}}
  if($('cqSos')){const t=sos&&SOSP[sos.estado_std];$('cqSos').innerHTML=sos?`<span style="color:${sos.estado_std==='CRITICO'?'#f87171':sos.estado_std==='PRECAUCION'?'#fbbf24':'#4ade80'}">${esc(t?t[1]:sos.estado_std)}</span><small class="dim" style="display:block;font-size:12px;font-weight:400">${fd(sos.f_muestreo)}</small>`:'—';}
  // historial
  let regs=S.REC.filter(r=>r.cod_sap===e.cod_sap).concat(S.COLA.filter(x=>!x.enviado&&x.reg.cod_sap===e.cod_sap).map(x=>x.reg));
  if(S.online){const {data}=await sb.from('pdm_registros').select('id,fecha,modulo,especialidad,trabajo,sistema,tecnicos,backlog').eq('cod_sap',e.cod_sap).eq('anulado',false).order('fecha',{ascending:false}).limit(20);if(data)regs=data;}
  if(!$('cqL'))return;
  $('cqL').className='tlx';$('cqL').innerHTML=regs.length?regs.slice(0,20).map(r=>`<div>${esc(MODN[r.modulo]||r.modulo)} · ${esc(String(r.trabajo||r.sistema||'').toLowerCase())}${r.backlog?' 📌':''}<br><small>${fd(r.fecha)} · ${esc(espDe(r))} · ${esc((r.tecnicos||[]).join(', '))}</small></div>`).join(''):'<span class="dim">Sin registros.</span>';}
async function cargarPend(){const box=$('pdRes');let L=(await DB.get('pend').catch(()=>null))||[];
  if(S.online){let q=sb.from('pdm_registros').select('id,fecha,cod_sap,backlog,tecnicos,registrado_por,obra,estado_equipo').eq('backlog_estado','ABIERTO').eq('anulado',false).order('fecha',{ascending:false}).limit(150);
    if(S.obra)q=q.eq('obra',S.obra);const {data,error}=await q;if(!error){L=data||[];DB.set('pend',L);}}
  S.PEND=L;const bd=$('pendBadge');if(bd){bd.textContent=L.length;bd.style.display=L.length?'':'none';}
  if(!box)return;
  box.className='';box.innerHTML=L.length?L.map(p=>`<div class="row"><div><b>${esc(p.cod_sap)}</b> · ${esc(p.backlog)}<br><span class="dim">${fd(p.fecha)} · ${esc(p.registrado_por||'')}${p.estado_equipo==='INOPERATIVO'?' · <b style="color:#B91C1C">INOPERATIVO</b>':''}</span></div>
     <span class="pill p-w" style="cursor:pointer" onclick="cerrarPend('${p.id}')">Cerrar</span></div>`).join(''):'<span class="dim">Sin pendientes abiertos.</span>';}
async function cerrarPend(id){if(!S.online)return toast('Necesitas señal para cerrar un pendiente');if(!confirm('¿Marcar este pendiente como resuelto?'))return;
  const {error}=await sb.from('pdm_registros').update({backlog_estado:'CERRADO',backlog_cerrado_en:new Date().toISOString()}).eq('id',id);
  if(error)return toast('No se pudo cerrar: '+error.message,5000);toast('✓ Pendiente cerrado');cargarPend();}

/* ═══════════════════════ INICIO ═══════════════════════ */
pintar(); arrancar().catch(e=>{console.error(e);toast('Error al iniciar: '+e.message,6000);ir('login',true);});
</script>
