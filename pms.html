<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PM-S — Programa de Mantenimiento Preventivo Semanal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --steel:#1c232b;--steel-2:#2a333d;--bg:#eef0f2;--card:#fff;--line:#d3d8dd;--ink:#1a1d21;
    --muted:#6b747d;--amber:#f2a900;--ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;
    --bad:#b91c1c;--bad-bg:#fee2e2;--gray:#6b7280;--gray-bg:#f1f3f5;--blue:#1d4ed8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .hide{display:none !important}
  .mono{font-family:"SF Mono",ui-monospace,monospace}
  header{background:var(--steel);color:#fff;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:3px solid var(--amber);flex-shrink:0}
  header h1{font-size:14px;font-weight:700}header p{font-size:10px;color:#9aa4ad;text-transform:uppercase;letter-spacing:1.5px}
  header .who{font-size:12px;color:#cdd4da}
  .toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
  .toolbar input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .act{border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;background:#eef0f2;color:var(--ink)}
  .act:hover{filter:brightness(.96)}
  .act.primary{background:var(--amber);color:#1a1200}
  .act.clear{background:#fee2e2;color:#b91c1c;border:1.5px solid #f87171}
  .chip{background:#f1f3f5;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;color:var(--muted)}
  .spacer{flex:1}
  .pill{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10px;font-weight:700}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.na{background:var(--gray-bg);color:var(--gray)}
  .delrow{border:none;background:none;color:#cbd2d9;cursor:pointer;font-size:12px;padding:0 2px;line-height:1}
  .delrow:hover{color:var(--bad)}
  footer{padding:7px 16px;color:var(--muted);font-size:12px;text-align:center;flex-shrink:0}
  /* ===== PM-S ===== */
  #pmsWrap{padding:0;overflow:auto;flex:1;min-height:0;contain:paint}
  table.pms{border-collapse:separate;border-spacing:0;font-size:11px;background:#fff;width:auto;min-width:100%}
  .pms th,.pms td{border-bottom:1px solid #e6e8eb;border-right:1px solid #eef0f2;white-space:nowrap}
  .pms thead th{color:#fff;font-size:10px;font-weight:400;padding:2px 4px;text-align:center;z-index:5;border:none;border-right:1px solid #fff;border-bottom:1px solid #fff}
  .pms thead .hlab{padding:1px 0 2px;line-height:1.05}
  .pms thead .colf{width:100%;min-width:44px;border:1px solid #cfd6dd;border-radius:4px;padding:1px 3px;font-size:10px;height:16px;background:#fff;color:#1a1d21;outline:none}
  .pms thead .colf:focus{border-color:var(--amber);box-shadow:0 0 0 2px rgba(242,169,0,.2)}
  .pms tbody td{padding:1px 5px;height:22px}
  .pms tbody tr{content-visibility:auto;contain-intrinsic-size:auto 22px}
  .pms tbody tr:hover td{background:#f9fafb}
  .pms td.pms-c{text-align:center}
  .pms td.pms-l{text-align:left}
  .pms td.mono{font-family:"SF Mono",ui-monospace,monospace}
  .pms td.pms-day{text-align:center;width:26px;min-width:26px;padding:0}
  .pms td.pms-day.dom{background:#fef2f2}
  .pms td.pms-ed{cursor:cell}
  .pms td.pms-ed:hover{background:#fff7e6;box-shadow:inset 0 0 0 1px #f0d68a}
  .pms td[data-editing]{padding:0;box-shadow:inset 0 0 0 2px var(--amber)}
  .pms td[data-editing] input{width:100%;border:none;background:#fff;font:inherit;padding:1px 4px;outline:none;text-align:center}
  .pms tbody td.idx{padding:0 4px;text-align:center;color:var(--muted);font-family:"SF Mono",monospace;background:#f8fafc;font-size:10px;white-space:nowrap}
  .pms tbody td.idx .rn{font-weight:600}
  .pms tbody td.idx .delrow{opacity:0;vertical-align:middle}
  .pms tbody tr:hover td.idx .delrow{opacity:1}
  .pms tbody tr.rowsel-g td{background:#bbf7d0 !important}
  .pms tbody tr.rowsel-g td.cellsel-g{background:#4ade80 !important;font-weight:700}
  .pms td.pms-noeq{color:#b45309;background:#fffbeb}

</style>
</head>
<body>
<header>
  <div><h1>PM-S — Programa de Mantenimiento Preventivo Semanal</h1><p>Unidad de Equipos · UDE</p></div>
  <span class="who" id="who"></span>
</header>
<div class="toolbar">
  <button class="act primary" id="pmsBtnAdd">&#65291; MNTTO</button>
  <button class="act" id="pmsBtnHoy">Semana actual</button>
  <input type="number" id="pmsBuscarSem" min="1" max="53" placeholder="Buscar semana" style="width:120px">
  <button class="act" id="pmsBtnVerEjec">Mostrar ejecutados</button>
  <button class="act clear" id="pmsBtnClear">&#10005; Borrar filtros</button>
  <span class="chip" id="pmsCount">&mdash;</span>
  <span class="chip" id="pmsCountEjec">&mdash;</span>
  <div class="spacer"></div>
  <input type="hidden" id="pmsSemana"><input type="hidden" id="pmsAnio">
</div>
<div id="pmsWrap"><table class="pms"><thead id="pmsThead"></thead><tbody id="pmsBody"></tbody></table></div>
<footer id="appFoot">Doble clic en OM, HR/KM o Fecha Ejecuci&oacute;n para editar &middot; los cambios se guardan solos.</footer>
<script>
/* ── configuracion: la escribe la pagina principal en este mismo navegador ── */
const CFG = (()=>{try{return JSON.parse(localStorage.getItem('gllr_sbcfg')||'null')}catch(_){return null}})();
if(!CFG||!CFG.url){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif">'
   +'<h2 style="font-size:18px;margin-bottom:10px">Abre primero la p&aacute;gina principal</h2>'
   +'<p style="color:#6b747d">Esta pesta&ntilde;a toma la conexi&oacute;n y la sesi&oacute;n desde el Maestro de Equipos.<br>'
   +'Ingresa ah&iacute; y vuelve a pulsar PM-S.</p></div>';
  throw new Error('sin configuracion');
}
const sb = window.supabase.createClient(CFG.url, CFG.key);

let datos=[], perfil=null;
function hoy0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function dias(a,b){return Math.round((a-b)/86400000);}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/86400000+1)/7);}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function fmtDate(v){if(!v)return"";const p=String(v).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:String(v);}
function famNum(e){const m=String(e.familia||'').match(/\d+/);return m?+m[0]:99;}
function roundToFreq(V,F){
  V=Number(V)||0; F=Number(F)||0;
  if(F<=0)return Math.round(V);
  const L=Math.floor(V/F)*F, U=L+F, band=F*0.2;
  if((V-L)<band)return L;
  if((U-V)<=band)return U;
  const idx=Math.floor((V-L)/band+0.5);
  return L+idx*band;
}
function mant(e){
  if(e.__mant)return e.__mant;              // caché: se recalcula solo al editar el equipo
  const H=hoy0(),freq=+e.frecuencia||0,pmr=roundToFreq(+e.hrkm_ult_mntto||0,freq),act=+e.hrkm_actual||0,hd=+e.hr_dia||0;
  let proy=act; if(e.fecha_lectura){const dd=Math.max(0,dias(H,new Date(e.fecha_lectura)));proy=act+dd*hd;}
  const proximo=freq?(pmr+freq):0; const restante=proximo-proy;
  let est="na";const margen=Math.max(freq*0.15,25);
  if(freq)est=restante<=0?"bad":(restante<=margen?"warn":"ok");
  let fprox="",sem="",fproxDate=null;
  if(hd>0&&freq){const dd=Math.floor(restante/hd)+1;fproxDate=new Date(H.getTime()+dd*86400000);fprox=fmtDate(fproxDate.toISOString().slice(0,10));sem=isoWeek(fproxDate);}
  return (e.__mant={proy:Math.round(proy),proximo:Math.round(proximo),restante:Math.round(restante),est,fprox,sem,fproxDate});
}
let DIDX=new Map();
function reindexDatos(){DIDX=new Map(datos.map(e=>[String(e.id),e]));}
function getE(id){return DIDX.get(String(id))||datos.find(x=>String(x.id)===String(id))||null;}
const MAESTRO_CAMPOS="id,status,cod_proyec,familia,cod_sap,equipo,marca,modelo,serie_placa,hrkm_actual,fecha_lectura,hr_dia,hrkm_ult_mntto,fecha_ult_mntto,frecuencia";

/* ═══════════════════ PM-S : programa semanal + historico acumulado ═══════════════════ */
let pmsData=[], pmsSel=null, pmsSelCell=null, pmsVerEjec=false, pmsColF={}, pmsCargado=false;
const PMS_DIA=['L','M','M','J','V','S','D'];
const PMS_MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];
/* lunes / domingo de una semana ISO */
function isoWeekMonday(y,w){const j=new Date(Date.UTC(y,0,4)),dw=j.getUTCDay()||7,m=new Date(j);m.setUTCDate(j.getUTCDate()-(dw-1)+(w-1)*7);m.setUTCHours(0,0,0,0);return m;}
function isoWeekSunday(y,w){const m=isoWeekMonday(y,w),s=new Date(m);s.setUTCDate(m.getUTCDate()+6);s.setUTCHours(23,59,59,999);return s;}

/* ---- TIPO DE PM segun marca / modelo y el HR/KM programado ---- */
function pmsTipoPM(marca,modelo,hrkm){
  const h=Number(hrkm)||0; if(!h)return'';
  const M=String(marca||'').toUpperCase(), MO=String(modelo||'').toUpperCase();
  const es=(v,n)=>n>0&&h%n===0;
  if(M.includes('MERCEDES')&&MO.includes('SPRINTER')){
    if(es(h,90000))return'PM4'; if(es(h,60000))return'PM3'; if(es(h,5000))return'PM1'; return'';
  }
  if(M.includes('MERCEDES')&&MO.includes('AROCS')){
    if(es(h,6000))return'PM4'; if(es(h,3000))return'PM3'; if(es(h,2000))return'PM2'; if(es(h,1000))return'PM1'; return'';
  }
  if(M.includes('VOLVO')){
    if(es(h,6000))return'PM4'; if(es(h,3000))return'PM3'; if(es(h,1500))return'PM2'; if(es(h,500))return'PM1'; return'';
  }
  if(M.includes('TOYOTA')||M.includes('HINO')){
    if(es(h,4000))return'PM4'; if(es(h,10000))return'PM2'; if(es(h,5000))return'PM1'; return'';
  }
  if(es(h,2000))return'PM4'; if(es(h,1000))return'PM3'; if(es(h,500))return'PM2'; if(es(h,250))return'PM1';
  return'';
}
/* ---- TIEMPO REQ. ---- */
function pmsTiempo(tipo,familia){
  if(String(familia||'').toUpperCase().includes('VEH'))return'1 dia';
  return {PM1:'2 hrs',PM2:'4 hrs',PM3:'8 hrs',PM4:'1.5 dias'}[tipo]||'';
}
/* ---- fila enriquecida con los datos del maestro ---- */
function pmsFila(r){
  const e = (r.maestro_id!=null?getE(r.maestro_id):null) || pmsPorSap(r.cod_sap);
  const freq = e? (+e.frecuencia||0) : 0;
  let hp = (r.hrkm_prog!=null&&r.hrkm_prog!=='')?+r.hrkm_prog:null;
  if(hp==null && r.hrkm_ejec!=null && freq) hp = roundToFreq(+r.hrkm_ejec,freq);
  const tipo = pmsTipoPM(e&&e.marca, e&&e.modelo, hp);
  const est  = pmsEstado(r);
  const fSem = r.fecha_prog || null;          // la SEMANA sale de Fecha Prog.
  return {r,e,
    proyec:r.cod_proyec||(e&&e.cod_proyec)||'', sap:r.cod_sap||'',
    equipo:(e&&e.equipo)||'', marca:(e&&e.marca)||'', modelo:(e&&e.modelo)||'',
    placa:(e&&e.serie_placa)||'', fam:e?famNum(e):99,
    hp, tipo, treq:pmsTiempo(tipo,e&&e.familia), est,
    sem: fSem? isoWeek(new Date(fSem+'T00:00:00')) : '',
    anio: fSem? +String(fSem).slice(0,4) : 0};
}
let PMS_SAPX=new Map();
function pmsReindexSap(){PMS_SAPX=new Map();for(const e of datos){const k=String(e.cod_sap||'').trim();if(k&&!PMS_SAPX.has(k))PMS_SAPX.set(k,e);}}
function pmsPorSap(sap){return PMS_SAPX.get(String(sap||'').trim())||null;}
/* ---- ESTADO ---- */
function pmsEstado(r){
  const lleno = r.om && r.hrkm_ejec!=null && r.hrkm_ejec!=='' && r.fecha_ejec;
  if(lleno) return 'EJECUTADO';
  const H=hoy0(), dow=(H.getDay()+6)%7;
  const lunes=new Date(H.getTime()-dow*86400000); lunes.setHours(0,0,0,0);
  if(r.fecha_prog && new Date(r.fecha_prog+'T00:00:00') < lunes) return 'PENDIENTE';
  return 'PROGRAMADO';
}
/* ---- reparto de PM en los dias de la semana (balancea y evita domingo) ---- */
function pmsBalance(filas,lunes){
  const idxDe=f=>{
    const fp=f.r.fecha_prog; if(!fp)return null;
    const d=new Date(fp+'T00:00:00'); const off=Math.round((d-lunes)/86400000);
    return (off>=0&&off<=6)?off:null;
  };
  const dentro=filas.filter(f=>idxDe(f)!==null);
  if(!dentro.length)return new Map();
  const cap=Math.max(1,Math.ceil(dentro.length/6));      // se reparte en lun..sab
  const cubos=[[],[],[],[],[],[],[]];
  for(const f of dentro){let i=idxDe(f); if(i===6)i=5; cubos[i].push(f);}
  for(let i=0;i<6;i++){
    while(cubos[i].length>cap){
      let dest=-1;
      for(let d=1;d<6&&dest<0;d++){
        if(i+d<6&&cubos[i+d].length<cap)dest=i+d;
        else if(i-d>=0&&cubos[i-d].length<cap)dest=i-d;
      }
      if(dest<0)break;
      cubos[dest].push(cubos[i].pop());
    }
  }
  const m=new Map();
  cubos.forEach((arr,i)=>arr.forEach(f=>m.set(f.r.id,i)));
  return m;
}
/* ---- carga ---- */
async function pmsCargar(){
  const {data,error}=await sb.from('pm_prog').select('*').order('fecha_prog',{ascending:true});
  if(error){pmsBody.innerHTML=`<tr><td colspan="23" style="padding:20px;color:#b91c1c">${esc(error.message)}</td></tr>`;return;}
  pmsData=data||[]; pmsCargado=true; pmsRender();
}
/* ---- encabezado ---- */
function pmsHead(){
  const wk=+pmsSemana.value||isoWeek(hoy0()), yr=+pmsAnio.value||hoy0().getFullYear();
  const lun=isoWeekMonday(yr,wk), hoyISO=hoy0().toISOString().slice(0,10);
  const dias=[];for(let i=0;i<7;i++){const d=new Date(lun);d.setUTCDate(lun.getUTCDate()+i);dias.push(d);}
  const B='#002060', V='#006600', G='#595959';
  const th=(t,st='')=>`<th style="${st}">${t}</th>`;
  const opts=[];for(let w=1;w<=53;w++)opts.push(`<option value="${w}" ${w===wk?'selected':''}>Semana - ${w}</option>`);

  let h=`<tr class="pms-r1"><th colspan="23" style="background:#1c232b;letter-spacing:1px;font-weight:700">ÁREA DE CONTROL DE EQUIPOS</th></tr>`;
  h+=`<tr class="pms-r2"><th colspan="23" style="background:#f2f2f2;color:#002060;font-size:14px;font-weight:800">PROGRAMA DE MANTENIMIENTO PREVENTIVO SEMANAL — EQUIPOS</th></tr>`;
  h+=`<tr class="pms-r3">${th('',`background:${B};border:none`)}<th colspan="10" style="background:${B};border:none"></th>`
    +`<th colspan="7" style="background:#bfbfbf;color:#002060;font-weight:800">${PMS_MES[lun.getUTCMonth()]} ${lun.getUTCFullYear()}</th>`
    +`<th colspan="3" style="background:#1c232b;font-weight:700">EJECUCIÓN</th><th colspan="2" style="background:${G}"></th></tr>`;
  h+=`<tr class="pms-r4"><th colspan="11" style="background:${B};border:none"></th>`
    +`<th colspan="7" style="background:${B};padding:1px"><select id="pmsSelSem" style="width:130px;border:none;border-radius:4px;font-size:11px;padding:1px 3px;font-weight:700;color:#002060">${opts.join('')}</select>`
    +` <input id="pmsAnioIn" type="number" value="${yr}" style="width:56px;border:none;border-radius:4px;font-size:11px;padding:1px 3px;text-align:center"></th>`
    +`<th colspan="5" style="background:#1c232b"></th></tr>`;
  h+=`<tr class="pms-r5"><th colspan="11" style="background:${B};border:none"></th>`;
  dias.forEach((d,i)=>{h+=`<th style="background:${i===6?'#C00000':B};width:26px;min-width:26px">${PMS_DIA[i]}</th>`;});
  h+=`<th colspan="5" style="background:#1c232b"></th></tr>`;
  h+=`<tr class="pms-r6"><th colspan="11" style="background:${B};border:none"></th>`;
  dias.forEach((d,i)=>{const iso=d.toISOString().slice(0,10),esH=iso===hoyISO;
    h+=`<th style="background:${esH?'#F2A900':(i===6?'#C00000':B)};color:${esH?'#1a1200':'#fff'};font-weight:${esH?800:400}">${String(d.getUTCDate()).padStart(2,'0')}</th>`;});
  h+=`<th colspan="5" style="background:#1c232b"></th></tr>`;

  const cols=[['#',B,42],['Proyecto',B,66],['Cód. SAP<br>JJC',B,68],['Equipo / Vehículo',B,180],['Marca',B,96],['Modelo',B,120],['Serie/Placa',B,96],
              ['Tiempo<br>Req.',B,54],['TIPO DE<br>PM',B,54],['HR/KM<br>Prog.',B,68],['Fecha<br>Prog.',B,64]];
  h+='<tr class="pms-cols">';
  cols.forEach(([l,bg,w])=>h+=`<th style="background:${bg};min-width:${w}px"><div class="hlab">${l}</div></th>`);
  dias.forEach((d,i)=>h+=`<th style="background:${i===6?'#C00000':B}"></th>`);
  [['OM',V,84],['HR / KM',V,72],['FECHA<br>EJECUCION',V,74],['ESTADO',G,80],['SEMANA',G,54]].forEach(([l,bg,w])=>h+=`<th style="background:${bg};min-width:${w}px"><div class="hlab">${l}</div></th>`);
  h+='</tr>';

  const f=(k,ph)=>`<th style="background:#e8eaf0;padding:1px 2px"><input class="colf" data-pmsf="${k}" placeholder="${ph||''}" value="${esc(pmsColF[k]||'')}"></th>`;
  h+='<tr class="pms-filt">'+f('_n','#')+f('proyec','Proyecto')+f('sap','SAP')+f('equipo','Equipo')+f('marca','Marca')+f('modelo','Modelo')+f('placa','Serie')
    +'<th style="background:#e8eaf0"></th><th style="background:#e8eaf0"></th><th style="background:#e8eaf0"></th><th style="background:#e8eaf0"></th>';
  dias.forEach(()=>h+='<th style="background:#e8eaf0"></th>');
  h+=f('om','OM')+f('hrkm','HR/KM')+f('fejec','Fecha')+f('est','Estado')+f('sem','Sem.')+'</tr>';

  pmsThead.innerHTML=h;
  const ss=document.getElementById('pmsSelSem'); if(ss)ss.onchange=()=>{pmsSemana.value=ss.value;pmsRender();};
  const ai=document.getElementById('pmsAnioIn'); if(ai)ai.onchange=()=>{pmsAnio.value=ai.value;pmsRender();};
  pmsFixTops();
}
function pmsFixTops(){
  const t=pmsThead; if(!t)return; let top=0;
  for(const row of t.rows){for(const th of row.cells){th.style.position='sticky';th.style.top=top+'px';}top+=row.getBoundingClientRect().height;}
}
/* ---- cuerpo ---- */
function pmsRender(){
  pmsReindexSap();
  const wk=+pmsSemana.value||isoWeek(hoy0()), yr=+pmsAnio.value||hoy0().getFullYear();
  pmsHead();
  const filas=pmsData.map(pmsFila).sort((a,b)=>
      String(a.r.fecha_ejec||'9999-99-99').localeCompare(String(b.r.fecha_ejec||'9999-99-99'))
      || String(a.proyec).localeCompare(String(b.proyec)) || a.fam-b.fam
      || String(a.equipo).localeCompare(String(b.equipo)));
  const lun=isoWeekMonday(yr,wk);
  const bal=pmsBalance(filas.filter(f=>f.est!=='EJECUTADO'),lun);
  const dias=[];for(let i=0;i<7;i++){const d=new Date(lun);d.setUTCDate(lun.getUTCDate()+i);dias.push(d);}
  const PILL={PM1:'na',PM2:'ok',PM3:'warn',PM4:'bad'};
  const EST={PROGRAMADO:'#1d4ed8',EJECUTADO:'#15803d',PENDIENTE:'#b45309'};
  let h='';
  filas.forEach(f=>{
    const r=f.r, sel=(pmsSel!=null&&String(pmsSel)===String(r.id))?' rowsel-g':'';
    const di=bal.has(r.id)?bal.get(r.id):-1;
    let celdas='';
    for(let i=0;i<7;i++){
      const on=i===di;
      celdas+=`<td class="pms-day${i===6?' dom':''}" style="${on?'background:#FEF08A;font-weight:800;color:#1a1200':''}">${on?(f.tipo||'PM'):''}</td>`;
    }
    h+=`<tr data-pmsid="${r.id}"${sel?' class="'+sel.trim()+'"':''}>`
     +`<td class="idx"><span class="rn">0</span><button class="delrow" data-pmsdel="${r.id}" title="Eliminar fila">✕</button></td>`
     +`<td class="pms-c">${esc(f.proyec)}</td>`
     +`<td class="pms-c mono${f.e?'':' pms-noeq'}"${f.e?'':' title="Este Cód. SAP no está en la pestaña Equipos: no se pueden derivar Equipo, Marca, Modelo ni Tipo de PM."'}>${esc(f.sap)}${f.e?'':' ⚠'}</td>`
     +`<td class="pms-l">${esc(f.equipo)}</td>`
     +`<td class="pms-l">${esc(f.marca)}</td>`
     +`<td class="pms-l">${esc(f.modelo)}</td>`
     +`<td class="pms-l mono">${esc(f.placa)}</td>`
     +`<td class="pms-c">${esc(f.treq)}</td>`
     +`<td class="pms-c">${f.tipo?`<span class="pill ${PILL[f.tipo]}">${f.tipo}</span>`:''}</td>`
     +`<td class="pms-c mono">${f.hp!=null?Number(f.hp).toLocaleString('es-PE'):''}</td>`
     +`<td class="pms-c">${fmtDate(r.fecha_prog)}</td>`
     +celdas
     +`<td class="pms-c mono pms-ed" data-pmsk="om">${esc(r.om||'')}</td>`
     +`<td class="pms-c mono pms-ed" data-pmsk="hrkm_ejec">${r.hrkm_ejec!=null?Number(r.hrkm_ejec).toLocaleString('es-PE'):''}</td>`
     +`<td class="pms-c pms-ed" data-pmsk="fecha_ejec">${fmtDate(r.fecha_ejec)}</td>`
     +`<td class="pms-c" style="color:${EST[f.est]};font-weight:700">${f.est}</td>`
     +`<td class="pms-c">${f.sem||''}</td></tr>`;
  });
  pmsBody.innerHTML=h||`<tr><td colspan="23" style="padding:24px;text-align:center;color:#6b747d">Sin registros. Usa “＋ MNTTO” o “Programar mntto” desde Equipos.</td></tr>`;
  pmsFilas=filas; pmsIndexar(); pmsAplicar();
}
let pmsFilas=[], PMSX=[];
function pmsIndexar(){
  PMSX=[]; const byId=new Map(pmsFilas.map(f=>[String(f.r.id),f]));
  pmsBody.querySelectorAll('tr[data-pmsid]').forEach(tr=>{
    const f=byId.get(tr.dataset.pmsid); if(!f)return;
    PMSX.push({f,tr,rn:tr.querySelector('.rn')});
  });
}
function pmsAplicar(){
  const q=(pmsBuscarSem.value||'').trim();
  const cf=[];for(const k in pmsColF){const v=(pmsColF[k]||'').trim().toLowerCase();if(v)cf.push([k,v]);}
  const estF=(pmsColF['est']||'').toLowerCase();
  let n=0,ver=0;
  for(const m of PMSX){
    const f=m.f,r=f.r; let ok=true;
    if(f.est==='EJECUTADO' && !pmsVerEjec && !estF.includes('ejec')) ok=false;
    if(ok&&q&&String(f.sem)!==q) ok=false;
    if(ok)for(const [k,v] of cf){
      const val = k==='_n'?'' : k==='om'?String(r.om||'') : k==='hrkm'?String(r.hrkm_ejec??'')
                : k==='fejec'?fmtDate(r.fecha_ejec) : k==='est'?f.est : k==='sem'?String(f.sem)
                : String(f[k]??'');
      if(!val.toLowerCase().includes(v)){ok=false;break;}
    }
    const d=ok?'':'none';
    if(m.tr.style.display!==d)m.tr.style.display=d;
    if(ok){n++;if(m.rn&&m.rn.textContent!=n)m.rn.textContent=n;}
    if(f.est==='EJECUTADO')ver++;
  }
  pmsCount.textContent=n+' fila(s)';
  pmsCountEjec.textContent=ver+' ejecutado(s)';
}
let pmsFiltT; function pmsAplicarD(){clearTimeout(pmsFiltT);pmsFiltT=setTimeout(pmsAplicar,80);}

/* ---- interaccion ---- */
pmsThead.addEventListener('input',ev=>{const k=ev.target.dataset.pmsf;if(!k)return;pmsColF[k]=ev.target.value;pmsAplicarD();});
pmsBuscarSem.oninput=pmsAplicarD;
pmsBtnVerEjec.onclick=()=>{pmsVerEjec=!pmsVerEjec;pmsBtnVerEjec.textContent=pmsVerEjec?'Ocultar ejecutados':'Mostrar ejecutados';pmsBtnVerEjec.classList.toggle('primary',pmsVerEjec);pmsAplicar();};
pmsBtnClear.onclick=()=>{pmsColF={};pmsBuscarSem.value='';pmsVerEjec=false;pmsBtnVerEjec.textContent='Mostrar ejecutados';pmsBtnVerEjec.classList.remove('primary');pmsRender();};
pmsBtnHoy.onclick=()=>{const H=hoy0();pmsSemana.value=isoWeek(H);pmsAnio.value=H.getFullYear();pmsRender();};

pmsBody.addEventListener('click',async ev=>{
  const del=ev.target.dataset.pmsdel;
  if(del){
    const f=pmsFilas.find(x=>String(x.r.id)===String(del));
    if(!confirm('¿Eliminar esta fila del PM-S?\n\n'+(f?(f.sap+' · '+f.equipo):'')+'\n\nNo se modifica ningún dato de la pestaña Equipos.'))return;
    const {error}=await sb.from('pm_prog').delete().eq('id',del);
    if(error)return alert('No se pudo eliminar: '+error.message);
    pmsData=pmsData.filter(x=>String(x.id)!==String(del)); pmsRender(); return;
  }
  const tr=ev.target.closest('tr[data-pmsid]'); if(!tr)return;
  pmsBody.querySelectorAll('tr.rowsel-g').forEach(r=>r.classList.remove('rowsel-g'));
  tr.classList.add('rowsel-g'); pmsSel=tr.dataset.pmsid;
  pmsBody.querySelectorAll('td.cellsel-g').forEach(c=>c.classList.remove('cellsel-g'));
  const td=ev.target.closest('td'); if(td){td.classList.add('cellsel-g');pmsSelCell=td;}
});
pmsBody.addEventListener('dblclick',ev=>{
  const td=ev.target.closest('td.pms-ed'); if(!td||td.dataset.editing)return;
  const tr=td.closest('tr[data-pmsid]'), r=pmsData.find(x=>String(x.id)===String(tr.dataset.pmsid)); if(!r)return;
  const k=td.dataset.pmsk; let ctrl;
  if(k==='fecha_ejec') ctrl=`<input type="date" value="${r.fecha_ejec||''}">`;
  else if(k==='hrkm_ejec') ctrl=`<input type="number" step="1" value="${r.hrkm_ejec??''}">`;
  else ctrl=`<input type="number" step="1" min="0" max="999999999" value="${r.om??''}">`;
  td.dataset.editing='1'; td.innerHTML=ctrl;
  const inp=td.querySelector('input'); inp.focus(); try{inp.select();}catch(_){}
  if(k==='om')inp.oninput=()=>{inp.value=inp.value.replace(/[^0-9]/g,'').slice(0,9);};
});
pmsBody.addEventListener('focusout',ev=>{
  const td=ev.target.closest&&ev.target.closest('td[data-editing]'); if(!td)return;
  pmsCommit(td,ev.target.value);
});
pmsBody.addEventListener('keydown',ev=>{
  const td=ev.target.closest&&ev.target.closest('td[data-editing]'); if(!td)return;
  if(ev.key==='Enter'){ev.preventDefault();ev.target.blur();}
  else if(ev.key==='Escape'){delete td.dataset.editing;pmsRender();}
});
async function pmsCommit(td,raw){
  const tr=td.closest('tr[data-pmsid]'), id=tr.dataset.pmsid, k=td.dataset.pmsk;
  const r=pmsData.find(x=>String(x.id)===String(id)); delete td.dataset.editing;
  if(!r){pmsRender();return;}
  let val = raw===''?null : (k==='om'? String(parseInt(raw,10)) : k==='hrkm_ejec'? Number(raw) : raw);
  if((r[k]??null)===(val??null)){pmsRender();return;}
  r[k]=val;
  const {error}=await sb.from('pm_prog').update({[k]:val}).eq('id',id);
  if(error){appFoot.textContent='⚠️ No se guardó: '+error.message;pmsRender();return;}
  // reflejar en el maestro: HR/KM ult. y F. ult.
  if((k==='hrkm_ejec'||k==='fecha_ejec') && r.maestro_id){
    const up={}; if(r.hrkm_ejec!=null)up.hrkm_ult_mntto=r.hrkm_ejec; if(r.fecha_ejec)up.fecha_ult_mntto=r.fecha_ejec;
    if(Object.keys(up).length){
      await sb.from('maestro').update(up).eq('id',r.maestro_id);
      const e=getE(r.maestro_id); if(e){Object.assign(e,up);delete e.__mant;}
    }
  }
  appFoot.textContent='Guardado ✓';setTimeout(()=>appFoot.textContent='Doble clic en una celda para editar · los cambios se guardan solos.',1200);
  pmsRender();
}
/* ---- alta de filas ---- */
function pmsElegibles(){
  return datos.filter(e=>String(e.status||'').toUpperCase()!=='DESMOVILIZADO' && (+e.hr_dia||0)>0)
              .sort((a,b)=>String(a.cod_sap||'').localeCompare(String(b.cod_sap||'')));
}
async function pmsAgregar(e){
  if(!e)return;
  if(String(e.status||'').toUpperCase()==='DESMOVILIZADO'){alert('El equipo está DESMOVILIZADO, no se puede programar.');return;}
  if(!(+e.hr_dia||0)){alert('El equipo no tiene HR/día registrado, no se puede calcular su programación.');return;}
  const c=mant(e);
  const fila={maestro_id:e.id,cod_proyec:e.cod_proyec||null,cod_sap:e.cod_sap,
    hrkm_prog:c.proximo||null, fecha_prog:c.fproxDate?c.fproxDate.toISOString().slice(0,10):null};
  const {data,error}=await sb.from('pm_prog').insert(fila).select().single();
  if(error)return alert('No se pudo agregar: '+error.message);
  pmsData.push(data);
  if(data.fecha_prog){const d=new Date(data.fecha_prog+'T00:00:00');pmsSemana.value=isoWeek(d);pmsAnio.value=d.getFullYear();}
  pmsSel=data.id; pmsRender();
}
pmsBtnAdd.onclick=()=>{
  const el=pmsElegibles();
  if(!el.length)return alert('No hay equipos elegibles (se excluyen DESMOVILIZADOS y los que no tienen HR/día).');
  const opts=el.map(e=>`<option value="${e.id}">${esc(e.cod_sap)} — ${esc(e.equipo)} (${esc(e.cod_proyec||'')})</option>`).join('');
  document.body.insertAdjacentHTML('beforeend',
   `<div id="pmsModal" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center">
      <div style="background:#fff;border-radius:12px;padding:22px;width:440px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.3)">
        <h3 style="margin:0 0 6px;font-size:15px">Agregar mantenimiento</h3>
        <p style="margin:0 0 14px;font-size:12px;color:#6b747d">Solo equipos de la pestaña Equipos. HR/KM y Fecha Prog. se calculan solos.</p>
        <select id="pmsModalEq" size="10" style="width:100%;padding:6px;border:1px solid #d1d5db;border-radius:8px;font-size:12px">${opts}</select>
        <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end">
          <button class="act ghost" onclick="document.getElementById('pmsModal').remove()">Cancelar</button>
          <button class="act primary" id="pmsModalOk">Agregar</button>
        </div>
      </div></div>`);
  document.getElementById('pmsModalOk').onclick=async()=>{
    const id=document.getElementById('pmsModalEq').value;
    document.getElementById('pmsModal').remove();
    await pmsAgregar(getE(id));
  };
};
/* ---- entrada desde la pestaña Equipos ---- */

window.addEventListener('resize',pmsFixTops);

/* ── arranque ── */
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){document.body.innerHTML='<div style="padding:60px;text-align:center"><h2 style="font-size:18px">Sesi&oacute;n no iniciada</h2><p style="color:#6b747d">Ingresa en la p&aacute;gina principal y vuelve a pulsar PM-S.</p></div>';return;}
  const {data:p}=await sb.from('profiles').select('id,nombre,rol,estado,proyectos').eq('id',session.user.id).single();
  perfil=p||{}; who.textContent=(perfil.nombre||session.user.email)+' · '+(perfil.rol||'');
  if(perfil.estado!=='aprobado'){document.body.innerHTML='<div style="padding:60px;text-align:center"><h2 style="font-size:18px">Acceso pendiente</h2><p style="color:#6b747d">Tu cuenta a&uacute;n no est&aacute; aprobada.</p></div>';return;}

  const {data:m,error:e1}=await sb.from('maestro').select(MAESTRO_CAMPOS).order('cod_proyec').order('id');
  if(e1){appFoot.textContent='No se pudo cargar el maestro: '+e1.message;return;}
  datos=m||[]; reindexDatos();

  const H=hoy0(); pmsSemana.value=isoWeek(H); pmsAnio.value=H.getFullYear();
  await pmsCargar();

  // ?add=<id>  -> viene del boton "Programar mntto" de la pagina principal
  const add=new URLSearchParams(location.search).get('add');
  if(add){const e=getE(add); if(e)await pmsAgregar(e); else alert('No se encontr\u00f3 el equipo indicado.');}
})();
</script>
