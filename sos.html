<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icono-16.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="manifest" href="manifest.json">

<style>
  :root{--steel:#1c232b;--amber:#FFCD11;--line:#dfe3e7;--ink:#1a1d21;--muted:#6b747d;--bg:#f4f6f8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .hide{display:none !important}
  .mono{font-family:"SF Mono",ui-monospace,monospace}
  .spacer{flex:1}
  header{background:var(--steel);color:#fff;padding:8px 16px;display:flex;align-items:center;flex-shrink:0}
  .brand-min{width:270px;flex:0 0 270px;overflow:hidden}
  .brand-min h1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-min p{font-size:10px;color:#9aa4ad;text-transform:uppercase;letter-spacing:1.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .who{font-size:12px;color:#cdd4da}
  header .sp2{flex:1}
  /* nivel 1 — pestañas entre páginas, píldora flotante */
  header nav{align-items:center;background:#12161B;border-radius:10px;padding:3px;gap:2px;
    display:flex;flex-shrink:0;margin-left:14px}
  header nav button{background:transparent;border:none;padding:7px 14px;cursor:pointer;font:inherit;
    font-size:12.5px;font-weight:600;color:#8E959C;border-radius:7px;transition:background .12s,color .12s}
  header nav button:hover{color:#fff;background:#1D232B}
  header nav button.on{background:var(--amber);color:#1A1200}
  /* nivel 2 — sub-pestañas propias de SOS, más discretas, debajo del nivel 1 */
  #subnav{background:#fff;border-bottom:1px solid var(--line);padding:0 16px;display:flex;gap:4px;flex-shrink:0}
  #subnav button{background:none;border:none;padding:10px 14px;cursor:pointer;font:inherit;
    font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent}
  #subnav button:hover{color:var(--ink)}
  #subnav button.on{color:var(--ink);border-bottom-color:var(--amber)}
  .toolbar{display:flex;flex-wrap:nowrap;gap:12px;align-items:center;padding:9px 16px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0;height:auto;overflow-x:auto}
  .toolbar>*{flex:0 0 auto}
  .toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;height:34px;padding:0 12px;font-size:12.5px}
  #fObra,#fSistema,#fFuente{min-width:150px;flex:0 0 auto}
  .act{border:1px solid var(--line);background:#fff;border-radius:9px;height:34px;padding:0 13px;
    font-weight:500;font-size:12.5px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .act:hover{border-color:#C9CDD2;filter:none}
  .act.primary{background:linear-gradient(180deg,#FFE98A,#FFD84A);border-color:#DCB61C;color:#5C4708;font-weight:600}
  .act.bad,.act.clear{background:linear-gradient(180deg,#FBE6E6,#F5CFCF);border-color:#DFA0A0;color:#8E2020;font-weight:600}
  .chip{background:#FBFBFB;border:1px solid #E0E3E6;border-radius:9px;height:34px;padding:0 13px;font-size:12.5px;font-weight:500;color:#9AA0A6;display:inline-flex;align-items:center}
  footer{padding:6px 16px;color:var(--muted);font-size:12px;text-align:center;flex-shrink:0}
  #wrap{flex:1;overflow:auto;padding:0 14px 10px;min-height:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;
    position:sticky;top:0;z-index:8;background:var(--bg);padding:10px 0}
  .cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:10px 0}
  .c{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px}
  .c.cf{cursor:pointer;transition:box-shadow .1s,border-color .1s}
  .c.cf:hover{box-shadow:0 0 0 2px #DDE0E3}
  .c.cf.on{box-shadow:0 0 0 2px var(--amber);background:#FFFBE8}
  .c .l{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .c .v{font-size:22px;font-weight:800;color:#1F3864;line-height:1.15;margin-top:2px}
  .c .v .ratio{font-size:14px;color:#98a2ad;font-weight:700}
  .c .s .ratio{color:#c2c7cd}
  .c .v.bad{color:#dc2626}.c .v.warn{color:#B45309}.c .v.ok{color:#15803d}
  .c .s{font-size:9.5px;color:#98a2ad;margin-top:2px}
  table.t{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff}
  table.t th{background:linear-gradient(180deg,#7B87C0 0%,#4254A5 60%,#334281 100%);
    color:#fff;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;padding:6px;
    text-align:left;position:sticky;top:0;z-index:2;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  table.t th.c,table.t td.c{text-align:center}
  table.t th.r,table.t td.r{text-align:right}
  table.t td{padding:4px 6px;border-bottom:1px solid #e6e8eb;vertical-align:middle}
  table.t tbody tr:hover td{background:#f7fbff}
  table.t tr.corte td{border-top:2px solid #cbd5e1}
  /* Filas de una sola línea: el texto que no entra se corta con puntos
     suspensivos y se lee completo al abrir la fila. */
  table.t td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
  table.t td.desc{max-width:380px}
  table.t tbody tr{height:26px}
  /* la vista de alertas lleva campos editables: ahí no se recorta */
  #boxAle table.t td{overflow:visible;max-width:none;white-space:normal}
  #boxAle table.t td.desc{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .dim{color:var(--muted)}
  .std{color:#2E75B6;font-style:normal;font-size:10px}
  .clave{color:#1F3864;font-weight:700;font-size:10.5px;letter-spacing:-.2px}
  .warn{color:#B45309;font-size:10px}
  .pend{color:#98a2ad;font-size:10.5px}
  .pill{border-radius:999px;padding:1px 9px;font-size:10px;font-weight:800;display:inline-block}
  .badgeB{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:700}
  .badgeB.st-ok{background:#DDF2DF;color:#0C7A16}
  .badgeB.st-mid{background:#FFF8DE;color:#9E7F0B}
  .badgeB.st-low{background:#EFEFEF;color:#6C6C6C}
  .e-NORMAL{background:#dcfce7;color:#15803d}
  .e-PRECAUCION{background:#fef3c7;color:#B45309}
  .e-CRITICO{background:#fee2e2;color:#b91c1c}
  .e-NA{background:#eef0f2;color:#6b747d}
  .b-bad{color:#dc2626;font-weight:800}.b-mid{color:#B45309;font-weight:700}
  .mini{border:none;background:#eef0f2;border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px}
  .vacio{padding:44px;text-align:center;color:#98a2ad}
  .hint{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.5}
  input.ed{width:100%;border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:11.5px}
  input.ed.lg{min-width:150px}
  select.ed{border:1px solid var(--line);border-radius:5px;padding:3px 4px;font-size:11px}
  .ed.ok{border-color:#15803d;background:#f0fdf4}
  .modal{position:fixed;inset:0;background:rgba(15,20,26,.55);z-index:99;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto}
  .mc{background:#fff;border-radius:12px;width:min(940px,98vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .mh h3{font-size:15px;color:#1f3864}
  .mh .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .mb{padding:12px 16px 18px;max-height:74vh;overflow:auto}
  .campo{margin-bottom:12px}
  .mb .campo div{white-space:normal}
  .campo b{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .an{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px}
  .an>div{background:#f6f8fa;border-radius:8px;padding:6px 9px;font-size:11.5px;display:flex;justify-content:space-between;gap:8px}
  .an span{color:var(--muted)}.an b{color:#1F3864}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .form label{font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .form label.full{grid-column:1/-1}
  .eqnew{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .eqnew input,.eqnew select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;flex:1;min-width:120px}
  .form input,.form select{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:400;color:var(--ink)}
  .form input[readonly]{background:#f5f6f8;color:#6b747d}

  /* ── ESTILO OFICIAL GLLR: encabezado de 2 filas (banda + columna pastel) ── */
  table.of{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff;table-layout:fixed}
  table.of thead{position:sticky;top:0;z-index:6;background:#fff}
  table.of tr.bands th{background:#fff;padding:3px 3px 4px;border:none;border-bottom:1px solid var(--line);text-align:center}
  table.of .bnd{display:block;border-radius:7px;padding:4px 8px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
  table.of .bnd.azul{background:linear-gradient(180deg,#7B87C0 0%,#4254A5 48%,#334281 100%);border:1px solid #293466;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  table.of .bnd.amarillo{background:linear-gradient(180deg,#FFDC58 0%,#FFCD11 48%,#C7A00D 100%);border:1px solid #9E7F0B;color:#3B2E00;text-shadow:none}
  table.of .bnd.verde{background:linear-gradient(180deg,#55BF5D 0%,#0CA318 48%,#097F13 100%);border:1px solid #07650F;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  table.of .bnd.plomo{background:linear-gradient(180deg,#ADADAD 0%,#8A8A8A 48%,#6C6C6C 100%);border:1px solid #565656;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  /* mismos chips, sueltos (fuera de una tabla, ej. títulos de sección en la Ficha SOS) */
  .bnd.azul,.bnd.amarillo,.bnd.verde,.bnd.plomo,.bnd.rojo{border-radius:7px;font-weight:700;letter-spacing:.02em}
  .bnd.azul{background:linear-gradient(180deg,#7B87C0 0%,#4254A5 48%,#334281 100%);border:1px solid #293466;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .bnd.amarillo{background:linear-gradient(180deg,#FFDC58 0%,#FFCD11 48%,#C7A00D 100%);border:1px solid #9E7F0B;color:#3B2E00;text-shadow:none}
  .bnd.verde{background:linear-gradient(180deg,#55BF5D 0%,#0CA318 48%,#097F13 100%);border:1px solid #07650F;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .bnd.plomo{background:linear-gradient(180deg,#ADADAD 0%,#8A8A8A 48%,#6C6C6C 100%);border:1px solid #565656;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .bnd.rojo{background:linear-gradient(180deg,#E05A5F 0%,#D3141A 48%,#A51014 100%);border:1px solid #830C10;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  table.of tr.cols th{padding:3px 6px;text-align:left;font-weight:600;font-size:10px;line-height:1.15;border-right:1px solid #fff;border-bottom:1px solid #fff}
  table.of tr.cols th.c{text-align:center}
  table.of th.azul{background:#E5E7F2;color:#4254A5}
  table.of th.amarillo{background:#FFF8DE;color:#9E7F0B}
  table.of th.verde{background:#DDF2DF;color:#0C7A16}
  table.of th.plomo{background:#EFEFEF;color:#6C6C6C}
  table.of td{padding:2px 6px;border-bottom:1px solid #e6e8eb;border-right:1px solid #eef0f2;line-height:1.2;vertical-align:middle;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.of td.c{text-align:center}table.of td.r{text-align:right}
  table.of tbody tr:hover td{background:#f7fbff}
  table.of .frz{position:sticky;left:0;background:#fff;z-index:2}
  table.of tr.bands .frz{background:#fff;z-index:5}
  table.of tr.cols th.frz{z-index:5}
  table.of tbody tr:hover td.frz{background:#f7fbff}
  table.of .frz1{left:0}
  table.of .frz2{left:30px}
  table.of .frz3{left:58px}
  table.of td.idx{text-align:center}
  table.of td.idx .rn{font-weight:600}
  table.of td.idx .delrow{opacity:0;vertical-align:middle;border:none;background:none;color:#cbd2d9;cursor:pointer;font-size:12px;padding:0 0 0 3px;line-height:1}
  table.of tbody tr:hover td.idx .delrow{opacity:1}
  table.of tbody tr:hover td.idx .delrow:hover{color:#D3141A}
  .colb{border:none;background:transparent;color:inherit;opacity:.55;cursor:pointer;font-size:10px;padding:0 2px;vertical-align:middle}
  .colb:hover{opacity:1}
  .colb-open{opacity:.8;font-size:11px}

  /* ── ESTILO GLLR · sección 6: comportamiento general (líneas, filtros, resaltado, edición, deshacer) ── */
  table.t td,table.t th{border-right:1px solid #eef0f2}
  table.of tbody tr.fila-sel td,table.t tbody tr.fila-sel td{background:#d3e9f8!important}
  table.of tbody tr.fila-sel td.celda-sel,table.t tbody tr.fila-sel td.celda-sel{background:#7cb9e0!important;box-shadow:inset 0 0 0 1px #2b7cb0}
  table.of tbody td.col-hov,table.t tbody td.col-hov{background:#EAF2FF}
  table.of tbody tr:hover td.col-hov,table.t tbody tr:hover td.col-hov{background:#DCEBFF}
  .hcabg{cursor:pointer;display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:2px 4px;margin:-2px -4px}
  .hcabg:hover{background:rgba(0,0,0,.07)}
  .hcabg.filtrado{background:rgba(0,0,0,.13)}
  .hcabg .emb{font-size:8px;opacity:.7}
  .hcabg.filtrado .emb{opacity:1}
  #colPop{position:fixed;background:#fff;border:1px solid #dfe3e7;border-radius:10px;
    box-shadow:0 10px 30px rgba(20,30,50,.18);width:250px;z-index:60;display:none}
  #colPop.abierto{display:block}
  #colPop .cp-h{padding:9px 11px;border-bottom:1px solid #f1f3f5;font-size:11.5px;color:#1f3864;font-weight:700}
  #colPop .cp-b{padding:8px 9px}
  #colPop input[type=search]{width:100%;border:1px solid #dfe3e7;border-radius:7px;padding:7px 9px;font:inherit;font-size:12.5px;margin-bottom:6px}
  #colPop .cp-l{max-height:196px;overflow:auto;border-top:1px solid #f1f3f5;padding-top:5px}
  #colPop .cp-l label{display:flex;align-items:center;gap:8px;padding:5px 4px;font-size:12.5px;border-radius:6px;cursor:pointer}
  #colPop .cp-l label:hover{background:#f7f8f9}
  #colPop .cp-l label span:nth-child(2){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #colPop .cp-n{color:#98a2ad;font-size:11px}
  #colPop .cp-f{display:flex;gap:6px;padding:8px 9px;border-top:1px solid #f1f3f5}
  #colPop .cp-f button{flex:1;border:1px solid #dfe3e7;background:#fff;border-radius:7px;padding:7px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  #colPop .cp-f .ok{background:var(--amber);border-color:var(--amber);color:#1a1200}
  .fx{border:none;background:transparent;color:#c2c7cd;font-size:13px;cursor:pointer;padding:0 4px;line-height:1}
  .fx:hover{color:#D3141A}
  .act:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand-min"><h1>SOS &mdash; Muestreo de Aceites</h1><p>Unidad de Equipos &middot; UDE &middot; 210926-1</p></div>
  <nav id="navPrin"></nav>
  <div class="sp2"></div>
  <span class="who" id="who"></span>
</header>
<script>if(window.self!==window.top){document.getElementById('topbar').style.display='none';}</script>
<div id="subnav">
  <button id="tab_fra" class="on">&#128230; Frascos</button>
  <button id="tab_plan">Muestras</button>
  <button id="tab_ale">Seguimiento de alertas</button>
  <span style="margin-left:auto;font-size:10px;color:#9aa4ad;letter-spacing:.5px;padding-right:4px">v210926-1</span>
</div>
<div class="toolbar">
  <input type="month" id="fPeriodo" title="Mes de muestreo a calcular">
  <input type="search" id="fBusca" placeholder="Equipo, frasco, n&deg; muestra&hellip;" style="width:250px">
  <input type="date" id="fDesde"><input type="date" id="fHasta">
  <button class="act" id="btnTodoHist" title="Quitar el filtro de fecha y ver todo el historial">Ver todo</button>
  <select id="fObra"><option value="">Obra</option></select>
  <select id="fEstado"><option value="">Todos los estados</option><option value="CRITICO">Cr&iacute;tico</option><option value="PRECAUCION">Precauci&oacute;n</option><option value="NORMAL">Normal</option></select>
  <select id="fSistema"><option value="">Sistemas</option></select>

</div>
<div id="wrap">
  <div class="cards" id="cards"></div>
  <div id="boxFra"></div>
  <div id="boxPlan" class="hide"></div>
  <div id="boxAle" class="hide"></div>
</div>
<footer id="pie">Cargando&hellip;</footer>
<script>
const CFG=(()=>{try{return JSON.parse(localStorage.getItem('gllr_sbcfg')||'null')}catch(_){return null}})();
if(!CFG||!CFG.url){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif">'
   +'<h2 style="font-size:18px;margin-bottom:10px">Abre primero la p&aacute;gina principal</h2>'
   +'<p style="color:#6b747d">Esta pesta&ntilde;a toma la conexi&oacute;n y la sesi&oacute;n desde el Maestro de Equipos.</p></div>';
  throw new Error('sin configuracion');
}
if(!window.supabase){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:-apple-system,sans-serif">'
    +'<h2 style="font-size:18px;margin-bottom:10px">No se pudo cargar un componente necesario</h2>'
    +'<p style="color:#6b747d;max-width:420px;margin:0 auto 16px">Revisa tu conexión a internet e inténtalo de nuevo. '
    +'Si el problema sigue, puede ser un corte temporal de un servicio externo — prueba en unos minutos.</p>'
    +'<button onclick="location.reload()" style="background:#FFCD11;border:none;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer">Reintentar</button></div>';
  throw new Error('window.supabase no disponible');
}
const sb=window.supabase.createClient(CFG.url,CFG.key);
function hoy0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function dias(a,b){return Math.round((a-b)/86400000);}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/86400000+1)/7);}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function fmtDate(v){if(!v)return"";const p=String(v).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:String(v);}
function famNum(e){const m=String(e.familia||'').match(/\d+/);return m?+m[0]:99;}
function roundToFreq(V,F){
  V=Number(V)||0; F=Number(F)||0;
  if(F<=0)return Math.round(V);
  const L=Math.floor(V/F)*F, U=L+F, band=F*0.2;
  if((V-L)<band)return L;
  if((U-V)<=band)return U;
  const idx=Math.floor((V-L)/band+0.5);
  return L+idx*band;
}
function mant(e){
  if(e.__mant)return e.__mant;              // caché: se recalcula solo al editar el equipo
  const H=hoy0(),freq=+e.frecuencia||0,pmr=roundToFreq(+e.hrkm_ult_mntto||0,freq),act=+e.hrkm_actual||0,hd=+e.hr_dia||0;
  let proy=act; if(e.fecha_lectura){const dd=Math.max(0,dias(H,new Date(e.fecha_lectura)));proy=act+dd*hd;}
  const proximo=freq?(pmr+freq):0; const restante=proximo-proy;
  let est="na";const margen=Math.max(freq*0.15,25);
  if(freq)est=restante<=0?"bad":(restante<=margen?"warn":"ok");
  let fprox="",sem="",fproxDate=null;
  if(hd>0&&freq){const dd=Math.floor(restante/hd)+1;fproxDate=new Date(H.getTime()+dd*86400000);fprox=fmtDate(fproxDate.toISOString().slice(0,10));sem=isoWeek(fproxDate);}
  return (e.__mant={proy:Math.round(proy),proximo:Math.round(proximo),restante:Math.round(restante),est,fprox,sem,fproxDate});
}

const RANGO_PM=[['PM4',8],['PM3',4],['PM2',2],['PM1',1]]; // de mayor a menor
function nivelPM(proximoHr,freq){
  if(!freq)return null;
  for(const[nombre,mult]of RANGO_PM){ if(proximoHr%(freq*mult)===0)return nombre; }
  return 'PM1';
}
function rangoIncluye(pmEvento,pmSistema){ // PM4 incluye PM3,PM2,PM1; etc. (acumulativo)
  const val={PM1:1,PM2:2,PM3:4,PM4:8};
  return (val[pmSistema]||99)<=(val[pmEvento]||0);
}

async function altitudDe(proy){

/* ---------- uniformar estado y sistema ---------- */
function estadoStd(txt){
  const k=nrm(txt); if(!k)return null;
  if(EQE.has(k))return EQE.get(k);
  if(/CRITIC|ACCION REQUERIDA|OBSERVACION/.test(k))return 'CRITICO';
  if(/PRECAU|ALERTA|MONITOREAR/.test(k))return 'PRECAUCION';
  if(/NORMAL|NO SE REQUIERE/.test(k))return 'NORMAL';
  return null;                       // desconocido: se avisa para agregarlo
}
function sistemaStd(txt){
  const k=nrm(txt); if(!k)return null;
  return EQS.get(k)||null;
}

/* Clave única de una muestra: EQUIPO_SISTEMA_FECHA
   ejemplo: ECV109_MOTOR_02.24.26
   El sistema se recorta a 5 caracteres y la fecha va MM.DD.AA.
   Sirve para enlazar el resultado del laboratorio con su fila de la planilla. */
function claveMuestra(sap,sistema,fecha){
  if(!sap||!fecha)return null;
  const s=nrm(sistema||'').replace(/[^A-Z0-9]/g,'').slice(0,5)||'XXXXX';
  const [a,m,d]=String(fecha).slice(0,10).split('-');
  if(!a||!m||!d)return null;
  return `${nrm(sap)}_${s}_${m}.${d}.${a.slice(2)}`;
}
/* ---------- fechas y números tolerantes ---------- */
function aFecha(v){
  if(v instanceof Date&&!isNaN(v))return isoDe(v);
  // Excel a veces entrega la fecha como número de serie (días desde 1899-12-30).
  // Sin este caso, "45942" se leía como el año 45942.
  const n=Number(v);
  if(isFinite(n)&&n>20000&&n<80000&&String(v).trim().length<=7)
    return new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10);
  const s=String(v??'').trim(); if(!s||s==='-')return null;
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return s.slice(0,10);
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);
  if(m){let a=+m[3]; if(a<100)a+=2000;
    return `${a}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}
  const d=new Date(s);
  if(isNaN(d))return null;
  const y=d.getFullYear();
  return (y<1990||y>2100)?null:isoDe(d);      // descarta años imposibles
}
function aNum(v){
  if(v==null||v==='')return null;
  const n=Number(String(v).replace(/[^0-9.,-]/g,'').replace(',','.'));
  return isFinite(n)?n:null;
}

/* ---------- lectura de un Excel: ubica el encabezado ---------- */
function leerHoja(filas,claves){
  for(let i=0;i<Math.min(14,filas.length);i++){
    const f=(filas[i]||[]).map(nrm);
    const hay=claves.filter(k=>f.some(c=>c===nrm(k))).length;
    if(hay>=Math.min(3,claves.length)){
      const cols={}; (filas[i]||[]).forEach((c,j)=>{const k=nrm(c); if(k&&!(k in cols))cols[k]=j;});
      return {fila:i,cols};
    }
  }
  return null;
}
const val=(f,cols,...nombres)=>{
  for(const n of nombres){const j=cols[nrm(n)]; if(j!==undefined&&f[j]!==''&&f[j]!=null)return f[j];}
  return null;
};

/* Enlaza cada resultado con su fila de la planilla */
function enlazarPlanilla(r){
  // 1) por clave EQUIPO_SISTEMA_FECHA
  const k=claveMuestra(r.cod_sap,r.sistema_std||r.componente,r.fecha);
  if(k){
    const p=MUESTRAS.find(x=>claveMuestra(x.cod_sap,x.sistema_std||x.sistema,x.f_muestreo)===k);
    if(p)return p;
  }
  if(r.cod_frasco){
    const p=MUESTRAS.find(x=>x.nro_frasco&&nrm(x.nro_frasco)===nrm(r.cod_frasco));
    if(p)return p;
  }
  // sin frasco: mismo equipo, mismo sistema y la fecha de muestreo más cercana
  const cand=MUESTRAS.filter(x=>nrm(x.cod_sap)===nrm(r.cod_sap)
    && (!r.sistema_std||!x.sistema_std||x.sistema_std===r.sistema_std));
  if(!cand.length)return null;
  if(!r.fecha)return cand[0];
  const t=new Date(r.fecha+'T00:00:00').getTime();
  let mejor=null,dmin=Infinity;
  cand.forEach(x=>{
    if(!x.f_muestreo)return;
    const d=Math.abs(new Date(x.f_muestreo+'T00:00:00').getTime()-t)/86400000;
    if(d<dmin){dmin=d;mejor=x;}
  });
  return dmin<=45?mejor:null;      // más de mes y medio de diferencia: no se asume
}

const EDITADO=new Map(); // "periodo|proyecto" -> cantidad editada manualmente (sesión)
function calcularNecesidad(periodo){
  const [Y,M]=periodo.split('-').map(Number);
  const porProyecto=new Map(); // proyecto -> {sugerido, detalle:[]}
  const sinTipo=new Set(), sinSistemas=new Set();
  datos.forEach(e=>{
    if(esDesmovM(e)||sinSOS(e))return;
    const freq=+e.frecuencia||0; if(!freq)return;
    const c=mant(e); if(!c.fproxDate)return;
    if(c.fproxDate.getFullYear()!==Y||(c.fproxDate.getMonth()+1)!==M)return;
    const proxLimpio=Math.round(c.proximo/freq)*freq;
    const pmEvento=nivelPM(proxLimpio,freq);
    const tipo=tipoDe(e);
    let sistemas=tipo?SIST.filter(s=>nrm(s.tipo_equipo)===nrm(tipo)&&rangoIncluye(pmEvento,s.pm)):[];
    if(!tipo)sinTipo.add(e.equipo||e.cod_sap);
    else if(!sistemas.length)sinSistemas.add(tipo);
    const nFrascos=sistemas.length||1;
    const proy=e.cod_proyec||'(sin proyecto)';
    if(!porProyecto.has(proy))porProyecto.set(proy,{sugerido:0,detalle:[]});
    const reg=porProyecto.get(proy);
    reg.sugerido+=nFrascos;
    reg.detalle.push({equipo:e.equipo,cod_sap:e.cod_sap,pm:pmEvento,
      sistemas:sistemas.length?sistemas.map(s=>s.sistema):['(sin tabla — 1 por defecto)'],frascos:nFrascos});
  });
  return {porProyecto,sinTipo:[...sinTipo],sinSistemas:[...sinSistemas]};
}
function nombreMes(periodo){
  const [Y,M]=periodo.split('-').map(Number);
  return new Date(Y,M-1,1).toLocaleDateString('es-PE',{month:'long',year:'numeric'});
}

async function despacharProyecto(proy,periodo){
  const key=periodo+'|'+proy;
  const n=EDITADO.has(key)?EDITADO.get(key):(calcularNecesidad(periodo).porProyecto.get(proy)||{sugerido:0}).sugerido;
  if(!n||n<=0)return alert('La cantidad a enviar debe ser mayor a 0.');
  const libres=FRASCOS.filter(f=>f.estado==='Disponible').sort((a,b)=>a.codigo.localeCompare(b.codigo)).slice(0,n);
  if(libres.length<n)return alert(`Solo hay ${libres.length} frasco(s) disponible(s) en stock; necesitas ${n}. Agrega más frascos o reduce la cantidad.`);
  if(!confirm(`¿Despachar ${n} frasco(s) (${libres[0].codigo} … ${libres[libres.length-1].codigo}) a ${proy}?`))return;
  const antes=libres.map(f=>({...f}));
  const hoy=isoDe(new Date());
  const {error}=await sb.from('sos_frascos').update({estado:'Enviado',proyecto_actual:proy,fecha_envio:hoy,fecha_regreso:null,updated_at:new Date().toISOString()})
    .in('id',libres.map(f=>f.id));
  if(error)return alert('No se pudo despachar: '+error.message);
  libres.forEach(f=>{f.estado='Enviado';f.proyecto_actual=proy;f.fecha_envio=hoy;});
  EDITADO.delete(key);
  marcarAccion('fra',{tipo:'lote',antes});
  pintarFra();
}
async function regresarFrasco(id){
  if(!confirm('¿Este frasco regresó sin usar? Vuelve a Disponible.'))return;
  const f=FRASCOS.find(x=>String(x.id)===String(id)); if(!f)return;
  const antes={...f};
  const {error}=await sb.from('sos_frascos').update({estado:'Disponible',proyecto_actual:null,fecha_regreso:isoDe(new Date()),updated_at:new Date().toISOString()}).eq('id',id);
  if(error)return alert('No se pudo actualizar: '+error.message);
  f.estado='Disponible';f.proyecto_actual=null;
  marcarAccion('fra',{tipo:'campo',id,antes});
  pintarFra();
}
async function agregarFrascos(){
  const n=prompt('¿Cuántos frascos nuevos agregar al catálogo (correlativos)?','50');
  const cant=Math.round(+n||0); if(!cant||cant<=0)return;
  const usados=FRASCOS.map(f=>+f.codigo.replace(/\D/g,'')).filter(x=>isFinite(x));
  const desde=(usados.length?Math.max(...usados):0)+1;
  const nuevos=Array.from({length:cant},(_,i)=>({codigo:'F-'+String(desde+i).padStart(4,'0')}));
  const {data,error}=await sb.from('sos_frascos').insert(nuevos).select();
  if(error)return alert('No se pudo agregar: '+error.message);
  FRASCOS=FRASCOS.concat(data||[]);
  marcarAccion('fra',{tipo:'lote_nueva',ids:(data||[]).map(x=>x.id)});
  pintarFra();
}

function activarResaltado(tabla){

// -- Deshacer (Ctrl+Z), independiente por sub-pestaña --
let ULTIMA={fra:null,plan:null,res:null,ale:null};
function marcarAccion(v,acc){ ULTIMA[v]=acc; if(vista===v)btnDeshacer.disabled=false; }
async function deshacer(){
  const acc=ULTIMA[vista]; if(!acc||btnDeshacer.disabled)return;
  btnDeshacer.disabled=true;
  const tabla=({plan:'sos_muestras',ale:'sos_alertas',fra:'sos_frascos'})[vista];
  const arr=({plan:()=>MUESTRAS,ale:()=>ALE,fra:()=>FRASCOS})[vista]();
  try{
    if(acc.tipo==='campo'||acc.tipo==='fila'){
      const limpio={...acc.antes}; delete limpio.id; delete limpio.created_at;
      const {data,error}=await sb.from(tabla).update(limpio).eq('id',acc.id).select().single();
      if(error)throw error;
      const i=arr.findIndex(x=>String(x.id)===String(acc.id)); if(i>-1)arr[i]=data; else arr.push(data);
    }else if(acc.tipo==='nueva'){
      const {error}=await sb.from(tabla).delete().eq('id',acc.id);
      if(error)throw error;
      const i=arr.findIndex(x=>String(x.id)===String(acc.id)); if(i>-1)arr.splice(i,1);
    }else if(acc.tipo==='eliminada'){
      const {data,error}=await sb.from(tabla).insert(acc.antes).select().single();
      if(error)throw error;
      arr.push(data);
    }else if(acc.tipo==='lote'){
      for(const prev of acc.antes){
        const limpio={...prev}; delete limpio.id;
        const {data,error}=await sb.from(tabla).update(limpio).eq('id',prev.id).select().single();
        if(error)throw error;
        const i=arr.findIndex(x=>String(x.id)===String(prev.id)); if(i>-1)arr[i]=data;
      }
    }else if(acc.tipo==='lote_nueva'){
      const {error}=await sb.from(tabla).delete().in('id',acc.ids);
      if(error)throw error;
      acc.ids.forEach(id=>{ const i=arr.findIndex(x=>String(x.id)===String(id)); if(i>-1)arr.splice(i,1); });
    }else if(acc.tipo==='lote_eliminada'){
      const {data,error}=await sb.from(tabla).insert(acc.antes).select();
      if(error)throw error;
      (data||[]).forEach(d=>arr.push(d));
    }
    ULTIMA[vista]=null; pintar();
  }catch(err){
    alert('No se pudo deshacer: '+err.message);
    ULTIMA[vista]=acc; btnDeshacer.disabled=false;
  }
}
document.addEventListener('keydown',ev=>{
  const t=ev.target, enCampo=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'&&!enCampo){ ev.preventDefault(); deshacer(); }
});

// -- edición en línea (doble clic) genérica, para campos simples sin dependencias cruzadas --
function editarCeldaG(cfg){
  const {td,tabla,vista,arrGetter,id,campo,tipo,opciones}=cfg;
  if(td.querySelector('input,select'))return;
  const d=arrGetter().find(x=>String(x.id)===String(id)); if(!d)return;
  const original=td.innerHTML;
  let editor;
  if(tipo==='select'){
    editor=document.createElement('select');
    (opciones||['']).forEach(o=>{const op=document.createElement('option'); op.value=o; op.textContent=o||'—'; if((d[campo]||'')===o)op.selected=true; editor.appendChild(op);});
  }else{
    editor=document.createElement('input');
    editor.type=tipo==='fecha'?'date':(tipo==='num'?'number':'text');
    if(tipo==='num')editor.step='any';
    editor.value=d[campo]??'';
  }
  editor.className='ed'; editor.style.width='100%'; editor.style.boxSizing='border-box';
  td.innerHTML=''; td.appendChild(editor); editor.focus();
  if(editor.select)editor.select();
  let resuelto=false;
  async function confirmar(){
    if(resuelto)return; resuelto=true;
    const antes={...d};
    const val=editor.value===''?null:(tipo==='num'?(+editor.value):editor.value);
    if(val===(d[campo]??null)){ pintar(); return; }
    const {data,error}=await sb.from(tabla).update({[campo]:val}).eq('id',id).select().single();
    if(error){ alert('No se pudo guardar: '+error.message); td.innerHTML=original; return; }
    Object.assign(d,data); marcarAccion(vista,{tipo:'campo',id,antes}); pintar();
  }
  editor.onblur=confirmar;
  editor.onkeydown=ev=>{
    if(ev.key==='Enter'){ev.preventDefault();confirmar();}
    if(ev.key==='Escape'){resuelto=true; td.innerHTML=original;}
  };
  if(editor.tagName==='SELECT')editor.onchange=confirmar;
}

let filtroCardPlan=null;
function filtrarPlan(){
  const q=nrm(fBusca.value), o=fObra.value, d=fDesde.value, h=fHasta.value;
  const si=fSistema.value, fu=fFuente.value, es=fEstado.value;
  return MUESTRAS.filter(p=>{
    const f=p.f_muestreo||'';
    if(d&&f&&f<d)return false;
    if(h&&f&&f>h)return false;
    if(o&&String(p.obra||'')!==o)return false;
    if(si&&p.sistema_std!==si)return false;
    if(fu&&p.fuente!==fu)return false;
    if(es&&p.estado_std!==es)return false;
    if(filtroCardPlan==='CRITICO'&&p.estado_std!=='CRITICO')return false;
    if(filtroCardPlan==='PRECAUCION'&&p.estado_std!=='PRECAUCION')return false;
    if(filtroCardPlan==='sinuni'&&!(p.sistema&&!p.sistema_std))return false;
    if(filtroCardPlan==='conres'&&!(p.estado_std||p.fuente))return false;

    if(q){
      const e=getE(p.maestro_id);

    }
    return true;
  });
}
function estadoValidacion(p){
  if(!p.nro_frasco)return {txt:'—',cls:'dim'};
  const f=FRASCOS.find(x=>x.codigo===p.nro_frasco);
  if(!f)return {txt:'⚠ no existe en catálogo',cls:'b-mid'};
  if(f.estado==='Usado'&&String(f.planilla_id)===String(p.id))return {txt:'✓ OK',cls:'e-NORMAL'};
  if(f.estado==='Usado'&&String(f.planilla_id)!==String(p.id))return {txt:'⚠ vinculado a otra muestra',cls:'b-bad'};
  return {txt:'⚠ frasco no marcado Usado',cls:'b-mid'};

const GRUPOS_FICHA_FIJOS=['Desgaste','Contaminantes','Salud - aceite','Salud - viscosidad'];
function gruposFicha(){
  return GRUPOS_FICHA_FIJOS.map(titulo=>({
    titulo,
    claves: LIMITES.filter(x=>x.grupo===titulo).sort((a,b)=>(a.orden||0)-(b.orden||0)).map(x=>x.parametro)
  }));
}
function unidadDe(clave){ const m=clave.match(/\(([^)]+)\)/); return m?m[1]:''; }
function svgLineasGrupo(titulo,claves,historial){
  const colores=['#4254A5','#0CA318','#C7A00D','#D3141A','#7B5EA7','#1a1d21']; // azul, verde, amarillo, rojo, violeta, negro
  const etiquetasX=historial.map(h=>`${fmtDate(h.f_muestreo)}|${h.horometro!=null?f0(h.horometro)+'h':'—'}`);
  const series=claves.map((k,i)=>({nombre:k.replace(/\s*\([^)]*\)/i,''),color:colores[i%colores.length],limite:limiteDe(k),
    valores:historial.map(h=>{const v=h.analisis&&h.analisis[k]; return typeof v==='number'?v:null;})}));
  const activas=series.filter(s=>s.valores.some(v=>v!=null));
  if(!activas.length)return `<div class="campo" style="border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center;color:#98a2ad">
    <b style="font-size:20px;color:#1a1d21">${esc(titulo)}</b><br><span style="font-size:16px">Sin datos de este grupo</span></div>`;
  const W=700,H=320,padL=54,padB=54,padT=20,padR=20;
  const n=etiquetasX.length;
  const limMax=Math.max(0,...activas.map(s=>s.limite||0));
  const max=Math.max(1,limMax,...activas.flatMap(s=>s.valores.filter(v=>v!=null)))*1.15;
  const xAt=ix=>n<=1?padL+(W-padL-padR)/2:padL+ix*(W-padL-padR)/(n-1);
  const yAt=v=>padT+(H-padT-padB)*(1-v/max);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:660px;display:block">`;
  for(let gl=0;gl<=4;gl++){
    const y=padT+(H-padT-padB)*(1-gl/4);
    svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eef0f2"/>`;
    svg+=`<text x="${padL-6}" y="${y+5}" font-size="13" text-anchor="end" fill="#98a2ad">${f1(max*gl/4)}</text>`;
  }
  etiquetasX.forEach((et,ix)=>{
    const [fe,ho]=et.split('|'); const x=xAt(ix);
    svg+=`<text x="${x}" y="${H-padB+22}" font-size="12.5" text-anchor="middle" fill="#6b747d">${esc(fe)}</text>`;
    svg+=`<text x="${x}" y="${H-padB+38}" font-size="12" text-anchor="middle" fill="#98a2ad">${esc(ho)}</text>`;
  });
  activas.forEach(s=>{
    if(s.limite){
      const y=yAt(s.limite);
      svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${s.color}" stroke-width="1.5" stroke-dasharray="5,4" opacity=".55"/>`;
    }
    const pts=s.valores.map((v,ix)=>v==null?null:[xAt(ix),yAt(v)]).filter(Boolean);
    if(pts.length>1)svg+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
    s.valores.forEach((v,ix)=>{
      if(v==null)return;
      svg+=`<circle cx="${xAt(ix)}" cy="${yAt(v)}" r="4.5" fill="${s.color}"><title>${esc(s.nombre)}: ${v}</title></circle>`;
    });
  });
  svg+='</svg>';
  const leyenda=activas.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:16px;font-size:15px;color:#333">
    <span style="width:13px;height:13px;background:${s.color};display:inline-block;border-radius:3px"></span>${esc(s.nombre)}${s.limite?` <span class="dim" style="font-size:12px">(límite ${s.limite})</span>`:''}</span>`).join('');
  return `<div class="campo" style="border:1px solid var(--line);border-radius:10px;padding:14px">
    <b style="font-size:19px">${esc(titulo)}</b>
    <div style="margin:8px 0">${leyenda}</div>${svg}
  </div>`;
}

function ale(r){ return ALE.find(a=>String(a.resultado_id)===String(r.id))||{}; }
async function guardarAlerta(rid,ctrl){
  const r=MUESTRAS.find(x=>String(x.id)===String(rid)); if(!r)return;
  const col=ctrl.dataset.c;
  let val=ctrl.value===''?null:ctrl.value;
  let a=ALE.find(x=>String(x.resultado_id)===String(r.id));
  try{
    if(a){
      const antes={...a};
      const {error}=await sb.from('sos_alertas').update({[col]:val}).eq('id',a.id).select('id');
      if(error)throw error;
      a[col]=val;
      marcarAccion('ale',{tipo:'campo',id:a.id,antes});
    }else{
      const nueva={resultado_id:r.id,nro_muestra:r.nro_muestra,link_pdf:r.link_pdf||null,[col]:val};
      const {data,error}=await sb.from('sos_alertas').insert(nueva).select().single();
      if(error)throw error;
      ALE.push(data);
      marcarAccion('ale',{tipo:'nueva',id:data.id});
    }
    ctrl.classList.add('ok'); setTimeout(()=>ctrl.classList.remove('ok'),900);
    if(col==='f_indicacion'||col==='estado_seg')pintarAle();
  }catch(e){ alert('No se pudo guardar: '+e.message); pintarAle(); }
}

const card=(l,v,s,cls)=>`<div class="c"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div><div class="s">${s}</div></div>`;

/* Reconoce el archivo por sus columnas, no por el nombre */
function detectarTipo(filas,nombre,hoja){
  const t=nrm(nombre+' '+hoja);
  if(/INGRESO|FESA|LUBTEC|MARCO/.test(t))return leerHoja(filas,['N° MUESTRA','EQUIPO','COMPONENTE'])?'res':null;
  if(/PLANILLA/.test(t))return leerHoja(filas,['N° Frasco','Sistema'])?'plan':null;
  // sin pistas en el nombre: se mira el contenido
  if(leerHoja(filas,['N° MUESTRA','EQUIPO','COMPONENTE','ESTADO']))return 'res';
  if(leerHoja(filas,['No. de control de laboratorio','ID de equipo','Compartimento','Estado']))return 'res';
  if(leerHoja(filas,['N° Frasco','Sistema','Muestreo']))return 'plan';
  return null;
}

btnSubir.onclick=()=>{
  const i=document.createElement('input'); i.type='file'; i.accept='.xlsx,.xls,.csv';
  i.onchange=async()=>{
    const f=i.files&&i.files[0]; if(!f)return;
    pie.textContent='Leyendo '+f.name+'…';
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
      const hoja=wb.Sheets[wb.SheetNames[0]];
      const filas=XLSX.utils.sheet_to_json(hoja,{header:1,raw:true,defval:''});
      // se reconoce solo si es una planilla de envío o un ingreso de laboratorio,
      // sin importar en qué vista estés
      const tipo=detectarTipo(filas,f.name,wb.SheetNames[0]);
      if(tipo==='plan'){ verVista('plan'); await subirPlanilla(filas,f.name); }
      else if(tipo==='res'){ verVista('plan'); await subirResultados(filas,f.name,wb.SheetNames[0]); }
      else alert('No se reconoció el formato del archivo.\n\n'
        +'Se esperaba una PLANILLA DE MUESTRAS (con N° Frasco, Código del Equipo, Sistema, Muestreo)\n'
        +'o un archivo de laboratorio (con N° MUESTRA, EQUIPO, COMPONENTE, FECHA, ESTADO).');
    }catch(err){ alert('No se pudo leer el archivo: '+err.message); }
    pie.textContent='';
  };
  i.click();
};

const CAMPOS_COMPARABLES_PLAN=[
  ['nro_planilla','N° Planilla'],['nro_frasco','N° Frasco'],
  ['obra','Obra'],['marca','Marca'],['modelo','Modelo'],['serie','Serie'],
  ['tipo_aceite','Tipo de aceite'],['galones','Galones'],['horometro','Horómetro'],
  ['horas_aceite','Horas del aceite'],['cant_agregado','Cant. agregado'],
  ['f_envio','Fecha de envío'],['tipo','Tipo'],['observacion','Observación']
];
function diffCamposPlan(existente,entrante){
  const cambios=[];
  for(const [campo,label] of CAMPOS_COMPARABLES_PLAN){
    const nuevo=entrante[campo];
    if(nuevo===null||nuevo===undefined||nuevo==='')continue; // nunca pisar con un valor vacío
    const actual=existente[campo];
    if(String(actual??'')!==String(nuevo))cambios.push({campo,label,antes:actual,despues:nuevo});
  }
  return cambios;
}
function mostrarValor(campo,v){
  if(v===null||v===undefined||v==='')return '<span class="dim">(vacío)</span>';
  if(campo==='f_envio')return esc(fmtDate(v));
  return esc(String(v));
}
async function subirPlanilla(filas,nom){
  const regs=leerPlanilla(filas);
  if(!regs||!regs.length){alert('No se reconoció el formato.\n\nDebe tener las columnas de la PLANILLA DE MUESTRAS: N° Frasco, Código del Equipo, Sistema, Muestreo…');return;}
  const clave=p=>[p.cod_sap||'',p.sistema||'',p.f_muestreo||''].join('|');
  const mapaExistente=new Map(MUESTRAS.map(p=>[clave(p),p]));
  const candidatas=[]; const conCambios=[];
  const vistas=new Set(); let repetidasEnArchivo=0, yaIgual=0;
  regs.forEach(p=>{
    const k=clave(p);
    if(mapaExistente.has(k)){
      const existente=mapaExistente.get(k);
      const cambios=diffCamposPlan(existente,p);
      if(cambios.length)conCambios.push({existente,entrante:p,cambios});
      else yaIgual++;
      return;
    }
    if(vistas.has(k)){repetidasEnArchivo++;return;}
    vistas.add(k);
    candidatas.push(p);
  });
  const nuevos=candidatas;
  const sinEq=regs.filter(p=>!p.maestro_id&&p.cod_sap);
  const sinSis=regs.filter(p=>p.sistema&&!p.sistema_std);
  if(!confirm(`${nom}\n\n`
    +`Muestras leídas: ${regs.length}\n`
    +`Nuevas para agregar: ${nuevos.length}\n`
    +`Ya registradas, sin cambios: ${yaIgual}\n`
    +(conCambios.length?`Ya registradas, con datos nuevos o distintos (te las muestro a continuación): ${conCambios.length}\n`:'')
    +(repetidasEnArchivo?`Repetidas dentro del propio archivo (se omiten): ${repetidasEnArchivo}\n`:'')
    +(sinEq.length?`Códigos que no están en Equipos: ${sinEq.length}\n`:'')
    +(sinSis.length?`Sistemas sin equivalencia: ${sinSis.length} (los podrás asignar después)\n`:'')
    +`\n¿Continuar?`))return;
  // ampliar el filtro de fechas visible para que se vea todo lo cargado (nuevo o ya existente)
  const fechas=regs.map(r=>r.f_muestreo).filter(Boolean).sort();
  if(fechas.length){
    if(!fDesde.value||fechas[0]<fDesde.value)fDesde.value=fechas[0];
    const ultima=fechas[fechas.length-1];
    if(!fHasta.value||ultima>fHasta.value)fHasta.value=ultima;
  }
  let ok=0; const fallidas=[];
  for(const p of nuevos){
    const {error}=await sb.from('sos_muestras').insert(p);
    if(error)fallidas.push({p,msg:error.message}); else ok++;
  }
  if(fallidas.length){
    const detalle=fallidas.slice(0,8).map(x=>`· ${x.p.cod_sap||'—'} / ${x.p.sistema||'—'} / ${x.p.f_muestreo||'—'} → ${x.msg}`).join('\n');
    alert(`Se guardaron ${ok} de ${nuevos.length}.\n\n${fallidas.length} fila(s) rechazadas por la base de datos:\n${detalle}`
      +(fallidas.length>8?`\n… y ${fallidas.length-8} más.`:''));
  }
  if(ok||fallidas.length)await cargarTodo();
  pie.textContent=`${ok} muestra(s) agregadas a la planilla.`;
  if(conCambios.length)revisarCambiosPlanilla(conCambios);
}
function revisarCambiosPlanilla(lista){
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="mrev"><div class="mc" style="width:min(760px,96vw)">
    <div class="mh"><h3>Filas con datos nuevos o distintos</h3>
      <div class="sub">${lista.length} fila(s) ya existían pero el archivo trae celdas vacías completadas o valores distintos. Revisa y confirma cuáles aplicar.</div>
      <div class="spacer"></div><button class="act" id="revCer">Cerrar sin aplicar</button></div>
    <div class="mb">
      ${lista.map((g,i)=>{
        const p=g.existente;
        return `<div class="campo" style="border:1px solid var(--line);border-radius:8px">
          <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#1F3864">
            <input type="checkbox" class="revChk" data-i="${i}" checked>
            <b>${esc(p.cod_sap||'')} · ${esc(p.sistema||'')} · ${fmtDate(p.f_muestreo)}${p.nro_planilla?' · Planilla '+esc(p.nro_planilla):''}</b>
          </label>
          <table class="t" style="margin-top:6px"><thead><tr><th>Campo</th><th>Valor actual</th><th>Valor nuevo</th></tr></thead>
          <tbody>${g.cambios.map(c=>`<tr><td>${esc(c.label)}</td><td>${mostrarValor(c.campo,c.antes)}</td><td><b>${mostrarValor(c.campo,c.despues)}</b></td></tr>`).join('')}</tbody></table>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)">
      <button class="act" id="revNo">Cancelar</button><button class="act primary" id="revOk">Aplicar seleccionados</button></div>
  </div></div>`);
  const cerrar=()=>{const e=document.getElementById('mrev');if(e)e.remove();};
  document.getElementById('revCer').onclick=cerrar;
  document.getElementById('revNo').onclick=cerrar;
  document.getElementById('mrev').addEventListener('click',ev=>{if(ev.target.id==='mrev')cerrar();});
  document.getElementById('revOk').onclick=async()=>{
    const idxSel=[...document.querySelectorAll('.revChk:checked')].map(c=>+c.dataset.i);
    if(!idxSel.length){cerrar();return;}
    let ok=0; const fallidas=[];
    for(const i of idxSel){
      const g=lista[i];
      const patch={}; g.cambios.forEach(c=>patch[c.campo]=c.despues);
      const {data,error}=await sb.from('sos_muestras').update(patch).eq('id',g.existente.id).select().single();
      if(error){fallidas.push({g,msg:error.message});continue;}
      Object.assign(g.existente,data); ok++;
    }
    cerrar();
    if(fallidas.length)alert(`Se actualizaron ${ok} de ${idxSel.length}.\n\n${fallidas.length} no se pudieron guardar:\n`
      +fallidas.slice(0,6).map(x=>`· ${x.g.existente.cod_sap||'—'} → ${x.msg}`).join('\n'));
    pie.textContent=`${ok} muestra(s) actualizadas con datos del archivo.`;
    pintar();
  };
}

function buscarDuplicadosPlanilla(){
  const grupos=new Map();
  MUESTRAS.forEach(p=>{
    const k=[p.cod_sap||'',p.sistema||'',p.f_muestreo||''].join('|');
    if(!p.cod_sap||!p.sistema||!p.f_muestreo)return; // sin estos 3 datos no hay forma confiable de agrupar
    if(!grupos.has(k))grupos.set(k,[]);
    grupos.get(k).push(p);
  });
  const dup=[...grupos.values()].filter(g=>g.length>1);
  if(!dup.length){ alert('No se encontraron filas duplicadas (mismo Cód. SAP, Sistema y Fecha de muestreo).'); return; }
  const contarLlenos=p=>CAMPOS_COMPARABLES_PLAN.reduce((n,[c])=>n+(p[c]!=null&&p[c]!==''?1:0),0);
  dup.forEach(g=>g.sort((a,b)=>contarLlenos(b)-contarLlenos(a) || String(b.created_at||'').localeCompare(String(a.created_at||''))));
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="mdup"><div class="mc" style="width:min(820px,96vw)">
    <div class="mh"><h3>Filas duplicadas</h3>
      <div class="sub">${dup.length} grupo(s) con el mismo equipo, sistema y fecha de muestreo. Marcada por defecto la fila con más datos completos — las demás se borrarán.</div>
      <div class="spacer"></div><button class="act" id="dupCer">Cerrar</button></div>
    <div class="mb">
      ${dup.map((g,gi)=>`<div class="campo" style="border:1px solid var(--line);border-radius:8px">
        <b style="font-size:12.5px;color:#1F3864">${esc(g[0].cod_sap||'')} · ${esc(g[0].sistema||'')} · ${fmtDate(g[0].f_muestreo)} · ${g.length} filas</b>
        <table class="t" style="margin-top:6px"><thead><tr><th class="c">Mantener</th><th>N° Planilla</th><th>N° Frasco</th><th>Horómetro</th><th>Observación</th><th>Creado</th></tr></thead>
        <tbody>${g.map((p,pi)=>`<tr>
          <td class="c"><input type="radio" name="dupg${gi}" class="dupR" data-gi="${gi}" data-pi="${pi}" ${pi===0?'checked':''}></td>
          <td>${p.nro_planilla?esc(p.nro_planilla):'<span class="dim">(vacío)</span>'}</td>
          <td>${p.nro_frasco?esc(p.nro_frasco):'<span class="dim">(vacío)</span>'}</td>
          <td>${p.horometro!=null?f0(p.horometro):'<span class="dim">(vacío)</span>'}</td>
          <td class="desc">${p.observacion?esc(p.observacion):'<span class="dim">(vacío)</span>'}</td>
          <td class="dim">${p.created_at?fmtDate(p.created_at.slice(0,10)):''}</td>
        </tr>`).join('')}</tbody></table>
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)">
      <button class="act" id="dupNo">Cancelar</button><button class="act primary" id="dupOk">Borrar las no marcadas</button></div>
  </div></div>`);
  const cerrar=()=>{const e=document.getElementById('mdup');if(e)e.remove();};
  document.getElementById('dupCer').onclick=cerrar;
  document.getElementById('dupNo').onclick=cerrar;
  document.getElementById('mdup').addEventListener('click',ev=>{if(ev.target.id==='mdup')cerrar();});
  document.getElementById('dupOk').onclick=async()=>{
    const mantener=new Map();
    document.querySelectorAll('.dupR:checked').forEach(r=>mantener.set(+r.dataset.gi,+r.dataset.pi));
    const aBorrar=[];
    dup.forEach((g,gi)=>{ const keepPi=mantener.has(gi)?mantener.get(gi):0; g.forEach((p,pi)=>{ if(pi!==keepPi)aBorrar.push(p); }); });
    if(!aBorrar.length){cerrar();return;}
    if(!confirm(`¿Eliminar ${aBorrar.length} fila(s) duplicada(s)? (se puede deshacer con Ctrl+Z justo después)`))return;
    const {error}=await sb.from('sos_muestras').delete().in('id',aBorrar.map(p=>p.id));
    if(error){alert('No se pudo eliminar: '+error.message);return;}
    const antes=aBorrar.map(p=>({...p}));
    aBorrar.forEach(p=>{ const i=MUESTRAS.findIndex(x=>String(x.id)===String(p.id)); if(i>-1)MUESTRAS.splice(i,1); });
    marcarAccion('plan',{tipo:'lote_eliminada',antes});
    cerrar();
    pie.textContent=`${aBorrar.length} fila(s) duplicada(s) eliminadas.`;
    pintar();
  };
}

async function subirResultados(filas,nom,hoja){
  // el laboratorio se deduce del nombre de la hoja o del archivo
  const t=nrm(hoja+' '+nom);
  let fuente = /FESA/.test(t)?'FESA' : /LUBTEC/.test(t)?'LUBTEC' : /MARCO/.test(t)?'MARCO PERUANA' : null;
  if(!fuente&&leerHoja(filas,['No. de control de laboratorio','ID de equipo','Compartimento']))fuente='CAT S·O·S (Ferreyros)';
  if(!fuente){
    fuente=prompt('¿De qué laboratorio es este archivo?\n\nEscribe: FESA, LUBTEC, MARCO o FERREYROS','FESA');
    if(!fuente)return;
    fuente=nrm(fuente).startsWith('MARCO')?'MARCO PERUANA':nrm(fuente).startsWith('FERREYROS')?'CAT S·O·S (Ferreyros)':nrm(fuente);
  }
  const regs=(leerResultados(filas,fuente)||[]).filter(Boolean);
  if(!regs||!regs.length){alert('No se reconoció el formato.\n\nDebe tener las columnas N° MUESTRA, EQUIPO, COMPONENTE, FECHA y ESTADO (o el formato nativo de Ferreyros).');return;}
  // ya registrado = misma fuente + mismo N° de muestra ya tiene resultado en Muestras
  const yaHay=new Set(MUESTRAS.filter(m=>m.fuente).map(m=>m.fuente+'|'+nrm(m.nro_muestra)));
  const nuevos=regs.filter(r=>!yaHay.has(fuente+'|'+nrm(r.nro_muestra)));
  // por cada nuevo: buscar una fila de Muestras que YA exista (planilla) y que TODAVÍA no tenga resultado propio
  nuevos.forEach(r=>{
    const p=enlazarPlanilla(r);
    r.muestraExistente=(p&&!p.estado_std&&!p.fuente)?p:null;
  });
  const conMuestra=nuevos.filter(r=>r.muestraExistente);
  const sinMuestra=nuevos.filter(r=>!r.muestraExistente);
  const sinEst=[...new Set(regs.filter(r=>r.estado&&!r.estado_std).map(r=>r.estado))];
  const sinSis=[...new Set(regs.filter(r=>r.componente&&!r.sistema_std).map(r=>r.componente))];
  let msg=`${nom}  ·  laboratorio: ${fuente}\n\n`
    +`Resultados leídos: ${regs.length}\n`
    +`Nuevos para agregar: ${nuevos.length}\n`
    +`Ya registrados (se omiten): ${regs.length-nuevos.length}\n`
    +`Enlazados con una muestra ya registrada: ${conMuestra.length} de ${nuevos.length}\n`
    +(sinMuestra.length?`Sin enlazar (te los mostraré para armar su fila): ${sinMuestra.length}\n`:'');
  if(sinEst.length)msg+=`\n⚠ Estados sin equivalencia (quedarán sin uniformar):\n  ${sinEst.slice(0,6).join(', ')}${sinEst.length>6?'…':''}\n`;
  if(sinSis.length)msg+=`\n⚠ Sistemas sin equivalencia:\n  ${sinSis.slice(0,6).join(', ')}${sinSis.length>6?'…':''}\n`;
  msg+='\n¿Guardar?';
  if(!confirm(msg))return;
  if(!nuevos.length)return;
  let ok=0; const fallidas=[];
  for(const r of conMuestra){
    const patch={
      fuente:r.fuente, nro_muestra:r.nro_muestra,
      nro_frasco:r.muestraExistente.nro_frasco||r.cod_frasco||null,
      horometro:r.muestraExistente.horometro??r.horometro,
      estado:r.estado, estado_std:r.estado_std, observacion_lab:r.observacion, link_pdf:r.link_pdf, analisis:r.analisis
    };
    const {data,error}=await sb.from('sos_muestras').update(patch).eq('id',r.muestraExistente.id).select().single();
    if(error){fallidas.push({r,msg:error.message});continue;}
    Object.assign(r.muestraExistente,data); ok++;
  }
  if(fallidas.length){
    const detalle=fallidas.slice(0,8).map(x=>`· ${x.r.cod_sap||'—'} / ${x.r.componente||'—'} / ${x.r.fecha||'—'} → ${x.msg}`).join('\n');
    alert(`Se enlazaron ${ok} de ${conMuestra.length}.\n\n${fallidas.length} fila(s) rechazadas:\n${detalle}`);
  }
  await cargarTodo();
  pie.textContent=`${ok} resultado(s) enlazados con muestras existentes.`;
  if(sinMuestra.length)revisarNuevasPlanillas(sinMuestra);
  if(sinEst.length||sinSis.length){
    // se nombra exactamente qué falta y se ofrece resolverlo al momento
    const det=(sinEst.length?`Estados sin equivalencia (${sinEst.length}):\n   ${sinEst.join('\n   ')}\n\n`:'')
             +(sinSis.length?`Sistemas sin equivalencia (${sinSis.length}):\n   ${sinSis.slice(0,15).join('\n   ')}`
               +(sinSis.length>15?`\n   … y ${sinSis.length-15} más`:'')+'\n':'');
    const abrir=confirm(
      `Los resultados se guardaron, pero estos textos del laboratorio todavía no tienen equivalencia,\n`
      +`así que esas filas quedan sin uniformar y no entran en los filtros ni en las alertas:\n\n${det}\n`
      +`¿Abrir el panel de Equivalencias para asignarlas ahora?\n`
      +`(al guardarlas, los datos ya cargados se corrigen solos)`);
    if(abrir)eqAbrir();
  }
}

  document.getElementById('mnp').addEventListener('click',ev=>{if(ev.target.id==='mnp')cerrar();});

      MUESTRAS.push(data);
      ok++;
    }
    cerrar();
    if(fallidas.length)alert(`Se crearon ${ok} de ${idxSel.length}.\n\n${fallidas.length} no se pudieron crear:\n`
      +fallidas.slice(0,6).map(x=>`· ${x.x.cod_sap||'—'} → ${x.msg}`).join('\n'));
    pie.textContent=`${ok} fila(s) nuevas creadas en Planilla desde resultados de laboratorio.`;
    pintar();
  };
}

      <label>N° de frasco<input id="p_fra" list="fral" value="${esc(p.nro_frasco||'')}" placeholder="Disponible o ya enviado a obra">
        <datalist id="fral">${[...new Set([p.nro_frasco,...FRASCOS.filter(f=>f.estado==='Enviado'||f.estado==='Disponible').map(f=>f.codigo)].filter(Boolean))].sort()
          .map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></label>
      <label>Equipo<select id="p_eq"><option value="">—</option>
        ${eqs.map(e=>`<option value="${e.id}" ${String(p.maestro_id)===String(e.id)?'selected':''}>${esc(e.cod_sap)} · ${esc(e.equipo||'')}</option>`).join('')}
      </select></label>
      <label>Marca<input id="p_marca" value="${esc(p.marca||'')}" readonly placeholder="Automático"></label>
      <label>Modelo<input id="p_modelo" value="${esc(p.modelo||'')}" readonly placeholder="Automático"></label>
      <label>Serie<input id="p_serie" value="${esc(p.serie||'')}" readonly placeholder="Automático"></label>
      <label>Sistema<input id="p_sis" list="sisl" value="${esc(p.sistema||'')}">
        <datalist id="sisl">${sis.map(s=>`<option>${esc(s)}</option>`).join('')}</datalist></label>
      <label>Tipo de aceite<input id="p_ace" value="${esc(p.tipo_aceite||'')}"></label>
      <label>Horómetro<input id="p_hor" type="number" step="1" value="${p.horometro??''}"></label>
      <label>Horas del aceite<input id="p_hac" type="number" step="1" value="${p.horas_aceite??''}"></label>
      <label>Cantidad (galones)<input id="p_gal" type="number" step="0.1" value="${p.galones??''}"></label>
      <label>Cantidad agregada<input id="p_agr" type="number" step="0.1" value="${p.cant_agregado??0}"></label>
      <label>Fecha de muestreo<input id="p_fm" type="date" value="${p.f_muestreo||''}"></label>
      <label>Fecha de envío<input id="p_fe" type="date" value="${p.f_envio||''}"></label>
      <label>Tipo<select id="p_tip">
        ${['','Muestra','Cambio'].map(o=>`<option ${String(p.tipo||'')===o?'selected':''}>${o}</option>`).join('')}</select></label>
      <label class="full">Observación<input id="p_obs" value="${esc(p.observacion||'')}" placeholder="Automático a partir de 2026 (según altitud del proyecto)"></label>
    </div></div></div></div>`);
  const cerrar=()=>{const e=document.getElementById('mpl');if(e)e.remove();};
  document.getElementById('plCan').onclick=cerrar;
  document.getElementById('mpl').addEventListener('click',ev=>{if(ev.target.id==='mpl')cerrar();});
  function actualizarPorEquipo(){
    const eid=document.getElementById('p_eq').value, e=eid?getE(eid):null;
    document.getElementById('p_marca').value=e?(e.marca||''):'';
    document.getElementById('p_modelo').value=e?(e.modelo||''):'';
    document.getElementById('p_serie').value=e?(e.serie_placa||''):'';

    obraEl.value=e?(e.cod_proyec||''):'';

    const obra=document.getElementById('p_obra').value, fm=document.getElementById('p_fm').value;
    if(!obra||!fm||fm<'2026-01-01')return;
    if(ALTITUD.has(nrm(obra)))obsEl.value=`Trabaja a: ${ALTITUD.get(nrm(obra))} m.s.n.m.`;
  }
  document.getElementById('p_eq').onchange=actualizarPorEquipo;
  document.getElementById('p_fm').onchange=sugerirObservacion;
  document.getElementById('p_plaNuevo').onclick=()=>{
    const obra=document.getElementById('p_obra').value;
    if(!obra)return alert('Elige primero el equipo (define la obra).');
    document.getElementById('p_pla').value=sugerirPlanilla(obra,true);

  const del=document.getElementById('plDel');

    if(!confirm('¿Eliminar esta muestra de la planilla?'))return;
    const {error}=await sb.from('sos_muestras').delete().eq('id',p.id);
    if(error)return alert('No se pudo eliminar: '+error.message);

    const e=eid?getE(eid):null;
    const sisTxt=document.getElementById('p_sis').value.trim();
    const fraCod=document.getElementById('p_fra').value.trim()||null;
    const fmuestreo=document.getElementById('p_fm').value||null;
    let obs=document.getElementById('p_obs').value.trim();
    const obra=document.getElementById('p_obra').value.trim()||(e?e.cod_proyec:null);
    if(!obs&&obra&&fmuestreo&&fmuestreo>='2026-01-01'){
      const alt=await altitudDe(obra);
      if(alt)obs=`Trabaja a: ${alt} m.s.n.m.`;
    }
    const d={
      obra, nro_planilla:document.getElementById('p_pla').value.trim()||null,
      nro_frasco:fraCod,
      cod_sap:e?e.cod_sap:null, maestro_id:e?e.id:null,
      marca:e?e.marca:null, modelo:e?e.modelo:null, serie:e?e.serie_placa:null,
      sistema:sisTxt||null, sistema_std:sistemaStd(sisTxt)||(sisTxt||null),
      tipo_aceite:document.getElementById('p_ace').value.trim()||null,
      horometro:aNum(document.getElementById('p_hor').value),
      horas_aceite:aNum(document.getElementById('p_hac').value),
      galones:aNum(document.getElementById('p_gal').value),
      cant_agregado:aNum(document.getElementById('p_agr').value)??0,
      f_muestreo:fmuestreo,
      f_envio:document.getElementById('p_fe').value||null,
      tipo:document.getElementById('p_tip').value||null,
      observacion:obs||null,
      registrado_por:perfil?perfil.nombre:null
    };
    if(!d.maestro_id){alert('Elige el equipo.');return;}
    if(!d.f_muestreo){alert('Indica la fecha de muestreo.');return;}
    const {data:guardado,error}= id ? await sb.from('sos_muestras').update(d).eq('id',p.id).select().single()
                      : await sb.from('sos_muestras').insert(d).select().single();
    if(error)return alert('No se pudo guardar: '+error.message);
    // sincronizar el catálogo de frascos si el N° de frasco cambió
    if(fraCod!==(p.nro_frasco||null)){
      if(p.nro_frasco){
        const antiguo=FRASCOS.find(f=>f.codigo===p.nro_frasco&&f.estado==='Usado');
        if(antiguo){
          await sb.from('sos_frascos').update({estado:'Enviado',fecha_uso:null,planilla_id:null}).eq('id',antiguo.id);
          antiguo.estado='Enviado'; antiguo.fecha_uso=null; antiguo.planilla_id=null;
        }
      }
      if(fraCod){
        const nuevo=FRASCOS.find(f=>f.codigo===fraCod);
        if(nuevo){
          await sb.from('sos_frascos').update({estado:'Usado',fecha_uso:d.f_muestreo,planilla_id:guardado.id,updated_at:new Date().toISOString()}).eq('id',nuevo.id);
          nuevo.estado='Usado'; nuevo.fecha_uso=d.f_muestreo; nuevo.planilla_id=guardado.id;
        }
      }
    }
    cerrar(); await cargarTodo();
  };
}

      return {'N° Muestra':r.nro_muestra,'Código de Equipo':r.cod_sap||'','Sistema':r.sistema_std||r.sistema||'',
        'Estado':r.estado_std,'Horómetro':r.horometro??'','Observación del laboratorio':r.observacion_lab||'',
        'N° OM SAP':a.om_sap||'','Acciones correctivas':a.acciones||'','Fecha de indicación':a.f_indicacion||'',
        'Estado de seguimiento':a.estado_seg||'OM abierta','Días transcurridos':dias,
        'Link al reporte PDF':a.link_pdf||r.link_pdf||''};});
  }
  if(!rows.length)return alert('No hay datos para exportar.');
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,nombre.slice(0,30));
  XLSX.writeFile(wb,`SOS_${nombre}_${new Date().toISOString().slice(0,10)}.xlsx`);
};

function eqEditar(td,tabla,lista,recomponer,id,campo,tipo,opciones){
  if(!(perfil&&perfil.rol==='admin'))return;
  if(td.querySelector('input,select'))return;
  const row=lista.find(x=>String(x.id)===String(id)); if(!row)return;
  const original=td.innerHTML;
  let editor;
  if(tipo==='select'){
    editor=document.createElement('select');
    opciones.forEach(o=>{const op=document.createElement('option'); op.value=o; op.textContent=o; if(nrm(row[campo]||'')===nrm(o))op.selected=true; editor.appendChild(op);});
  }else{
    editor=document.createElement('input'); editor.type=tipo==='num'?'number':'text'; if(tipo==='num')editor.step='any';
    editor.value=row[campo]??'';
  }
  editor.className='ed'; editor.style.width='100%'; editor.style.boxSizing='border-box';
  td.innerHTML=''; td.appendChild(editor); editor.focus(); if(editor.select)editor.select();
  const vacioPermitido=campo==='laboratorio'||campo==='limite';
  let resuelto=false;
  async function confirmar(){
    if(resuelto)return; resuelto=true;
    const crudo=editor.value.trim();
    if(!vacioPermitido&&!crudo){ td.innerHTML=original; return; }
    const nuevo=tipo==='num'?(crudo===''?null:+crudo):(crudo||null);
    if(nuevo===(row[campo]??null)){ eqPintarTablas(); return; }
    const {error}=await sb.from(tabla).update({[campo]:nuevo}).eq('id',id);
    if(error){ alert('No se pudo guardar: '+error.message); td.innerHTML=original; return; }
    row[campo]=nuevo;
    recomponer();
    eqPintarTablas();
    if(tabla==='sos_eq_estado'||tabla==='sos_eq_sistema')reNormalizar();
    if(tabla==='sos_eq_tipo'&&vista==='fra')pintarFra();
  }
  editor.onblur=confirmar;
  editor.onkeydown=ev=>{
    if(ev.key==='Enter'){ev.preventDefault();confirmar();}
    if(ev.key==='Escape'){resuelto=true; td.innerHTML=original;}
  };
  if(editor.tagName==='SELECT')editor.onchange=confirmar;
}

/* al cambiar una equivalencia se vuelven a uniformar los datos ya guardados */
async function reNormalizar(){
  const camb=[];
  MUESTRAS.forEach(p=>{
    const e=p.estado?estadoStd(p.estado):p.estado_std, s=sistemaStd(p.sistema);
    if(e!==p.estado_std||s!==p.sistema_std){p.estado_std=e;p.sistema_std=s;camb.push(p);}
  });
  for(const p of camb) await sb.from('sos_muestras').update({estado_std:p.estado_std,sistema_std:p.sistema_std}).eq('id',p.id);
  if(camb.length)pie.textContent=`Se uniformaron ${camb.length} muestra(s).`;
  pintar();
}

/* Supabase entrega como máximo 1.000 filas por consulta. Esta función
   pide de a mil hasta traerlas todas, para que no falten periodos. */
async function traerTodo(tabla,orden,asc){
  const PASO=1000; let desde=0, out=[];
  for(;;){
    let q=sb.from(tabla).select('*');
    if(orden)q=q.order(orden,{ascending:asc!==false});
    const {data,error}=await q.range(desde,desde+PASO-1);
    if(error)return {data:out,error};
    out=out.concat(data||[]);
    if(!data||data.length<PASO)break;
    desde+=PASO;
    if(desde>200000)break;                       // tope de seguridad
  }
  return {data:out,error:null};
}
async function cargarTodo(){
  pie.textContent='Cargando…';
  const [pl,al,li]=await Promise.all([
    traerTodo('sos_muestras','f_muestreo',false),
    traerTodo('sos_alertas'),
    sb.from('sos_limites').select('*').order('orden')
  ]);
  if(pl.error){pie.textContent='No se pudo cargar: '+pl.error.message;return;}
  MUESTRAS=pl.data||[]; ALE=al.data||[]; LIMITES=li.data||[];
  const obraSel=fObra.value, sisSel=fSistema.value;
  const obras=[...new Set(MUESTRAS.map(p=>p.obra).filter(Boolean))].sort();
  fObra.innerHTML='<option value="">Obra</option>'+obras.map(o=>`<option>${esc(o)}</option>`).join('');
  fObra.value=obraSel;
  const siss=[...new Set(MUESTRAS.map(r=>r.sistema_std).filter(Boolean))].sort();

  fSistema.value=sisSel;
  pie.textContent=`${MUESTRAS.length} muestra(s) · ${MUESTRAS.filter(m=>m.estado_std).length} con resultado · ${ALE.length} en seguimiento.`;
  pintar();
}

/* ── Cambiar de pestaña sin recargar ──
   Antes de abrir una ventana se pregunta por su canal si ya está viva; si
   contesta, se le pide que se enfoque sola — nunca se llama a window.open()
   sobre una que ya existe, así jamás se recarga. Solo se abre una ventana
   nueva si nadie contesta a tiempo. */
function navPreguntar(nombreCanal,ms){
  if(!('BroadcastChannel' in window))return Promise.resolve(false);
  return new Promise(res=>{
    const ch=new BroadcastChannel(nombreCanal);
    let listo=false;
    const oye=ev=>{ if(ev.data&&ev.data.tipo==='pong'){listo=true;ch.removeEventListener('message',oye);ch.close();res(true);} };
    ch.addEventListener('message',oye);
    ch.postMessage({tipo:'ping'});
    setTimeout(()=>{ if(!listo){ch.removeEventListener('message',oye);ch.close();res(false);} },ms||260);
  });
}
// referencias propias, para las ventanas que esta página termina abriendo
const VENT={};
async function navAbrirOEnfocar(archivo,nombreCanal){
  // 1) ¿la abrí yo mismo antes? — la más confiable, es mía.
  const propia=VENT[nombreCanal];
  if(propia&&!propia.closed){try{propia.focus();return;}catch(_){}}
  // 2) Equipos es el centro: si me abrió a mí (window.opener), tiene las
  //    referencias reales de todas las ventanas — le pregunto si esa ya
  //    existe y, si es así, que la enfoque ella (referencia directa, no
  //    depende de que otra pestaña en segundo plano se enfoque sola).
  let esHub=false;
  try{ esHub = window.opener && !window.opener.closed && window.opener.ES_HUB; }catch(_){}
  if(esHub){
    // volver a Equipos: es mi propio "padre", se enfoca directo
    if(nombreCanal==='gllr_index'){ try{window.opener.focus();return;}catch(_){} }
    try{ if(window.opener.enfocarSiExiste(nombreCanal))return; }catch(_){}
    // no existe todavía: la abro YO (aquí el clic es real y reciente, así
    // el navegador no la bloquea) y le aviso a Equipos para la próxima vez
    const w=window.open(archivo,nombreCanal);
    if(w){
      try{w.focus();}catch(_){} VENT[nombreCanal]=w;
      try{window.opener.registrarVentana(nombreCanal,w);}catch(_){}
    }else alert('El navegador bloqueó la ventana emergente.\n\nPermite las ventanas emergentes de este sitio.');
    return;
  }
  // 3) no hay Equipos disponible como intermediario: preguntar por su
  //    canal directamente antes de abrir
  if(await navPreguntar(nombreCanal))return; // ya estaba abierta y se acaba de enfocar sola
  const w=window.open(archivo,nombreCanal);
  if(w){ try{w.focus();}catch(_){} VENT[nombreCanal]=w; }
  else alert('El navegador bloqueó la ventana emergente.\n\nPermite las ventanas emergentes de este sitio.');
}
function pintarNav(actual){
  const nav=document.getElementById('navPrin'); if(!nav)return;
  let h=NAV_PAGINAS.filter(p=>navPuede(p.k)).map(p=>
    `<button class="${p.k===actual?'on':''}" data-nav="${p.k}">${p.lab}</button>`).join('');
  nav.innerHTML=h;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.nav; if(k===actual)return;
    const p=NAV_PAGINAS.find(x=>x.k===k); if(!p)return;
    navAbrirOEnfocar(p.arch,p.win);
  });
}
