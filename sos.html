<style>

<script>
const CFG=(()=>{try{return JSON.parse(localStorage.getItem('gllr_sbcfg')||'null')}catch(_){return null}})();
if(!CFG||!CFG.url){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif">'
   +'<h2 style="font-size:18px;margin-bottom:10px">Abre primero la p&aacute;gina principal</h2>'
   +'<p style="color:#6b747d">Esta pesta&ntilde;a toma la conexi&oacute;n y la sesi&oacute;n desde el Maestro de Equipos.</p></div>';
  throw new Error('sin configuracion');
}
if(!window.supabase){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:-apple-system,sans-serif">'
    +'<h2 style="font-size:18px;margin-bottom:10px">No se pudo cargar un componente necesario</h2>'
    +'<p style="color:#6b747d;max-width:420px;margin:0 auto 16px">Revisa tu conexión a internet e inténtalo de nuevo. '
    +'Si el problema sigue, puede ser un corte temporal de un servicio externo — prueba en unos minutos.</p>'
    +'<button onclick="location.reload()" style="background:#FFCD11;border:none;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer">Reintentar</button></div>';
  throw new Error('window.supabase no disponible');
}
const sb=window.supabase.createClient(CFG.url,CFG.key);
function hoy0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function dias(a,b){return Math.round((a-b)/86400000);}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/86400000+1)/7);}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function fmtDate(v){if(!v)return"";const p=String(v).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:String(v);}
function famNum(e){const m=String(e.familia||'').match(/\d+/);return m?+m[0]:99;}
function roundToFreq(V,F){
  V=Number(V)||0; F=Number(F)||0;
  if(F<=0)return Math.round(V);
  const L=Math.floor(V/F)*F, U=L+F, band=F*0.2;
  if((V-L)<band)return L;
  if((U-V)<=band)return U;
  const idx=Math.floor((V-L)/band+0.5);
  return L+idx*band;
}
function mant(e){
  if(e.__mant)return e.__mant;              // caché: se recalcula solo al editar el equipo
  const H=hoy0(),freq=+e.frecuencia||0,pmr=roundToFreq(+e.hrkm_ult_mntto||0,freq),act=+e.hrkm_actual||0,hd=+e.hr_dia||0;
  let proy=act; if(e.fecha_lectura){const dd=Math.max(0,dias(H,new Date(e.fecha_lectura)));proy=act+dd*hd;}
  const proximo=freq?(pmr+freq):0; const restante=proximo-proy;
  let est="na";const margen=Math.max(freq*0.15,25);
  if(freq)est=restante<=0?"bad":(restante<=margen?"warn":"ok");
  let fprox="",sem="",fproxDate=null;
  if(hd>0&&freq){const dd=Math.floor(restante/hd)+1;fproxDate=new Date(H.getTime()+dd*86400000);fprox=fmtDate(fproxDate.toISOString().slice(0,10));sem=isoWeek(fproxDate);}
  return (e.__mant={proy:Math.round(proy),proximo:Math.round(proximo),restante:Math.round(restante),est,fprox,sem,fproxDate});
}



/* ═══════════════════ SOS · MUESTREO DE ACEITES ═══════════════════ */
let datos=[], DIDX=new Map(), perfil=null;
let PLAN=[], RES=[], ALE=[], EQE=new Map(), EQS=new Map(), EQLE=[], EQLS=[];
let vista='plan';

const nrm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const f0=n=>Number(n).toLocaleString('es-PE',{maximumFractionDigits:0});
const f1=n=>Number(n).toLocaleString('es-PE',{maximumFractionDigits:1});
const getE=id=>DIDX.get(String(id))||null;
const isoDe=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};

/* ---------- uniformar estado y sistema ---------- */
function estadoStd(txt){
  const k=nrm(txt); if(!k)return null;
  if(EQE.has(k))return EQE.get(k);
  if(/CRITIC|ACCION REQUERIDA|OBSERVACION/.test(k))return 'CRITICO';
  if(/PRECAU|ALERTA|MONITOREAR/.test(k))return 'PRECAUCION';
  if(/NORMAL|NO SE REQUIERE/.test(k))return 'NORMAL';
  return null;                       // desconocido: se avisa para agregarlo
}
function sistemaStd(txt){
  const k=nrm(txt); if(!k)return null;
  return EQS.get(k)||null;
}

/* Clave única de una muestra: EQUIPO_SISTEMA_FECHA
   ejemplo: ECV109_MOTOR_02.24.26
   El sistema se recorta a 5 caracteres y la fecha va MM.DD.AA.
   Sirve para enlazar el resultado del laboratorio con su fila de la planilla. */
function claveMuestra(sap,sistema,fecha){
  if(!sap||!fecha)return null;
  const s=nrm(sistema||'').replace(/[^A-Z0-9]/g,'').slice(0,5)||'XXXXX';
  const [a,m,d]=String(fecha).slice(0,10).split('-');
  if(!a||!m||!d)return null;
  return `${nrm(sap)}_${s}_${m}.${d}.${a.slice(2)}`;
}
/* ---------- fechas y números tolerantes ---------- */
function aFecha(v){
  if(v instanceof Date&&!isNaN(v))return isoDe(v);
  // Excel a veces entrega la fecha como número de serie (días desde 1899-12-30).
  // Sin este caso, "45942" se leía como el año 45942.
  const n=Number(v);
  if(isFinite(n)&&n>20000&&n<80000&&String(v).trim().length<=7)
    return new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10);
  const s=String(v??'').trim(); if(!s||s==='-')return null;
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return s.slice(0,10);
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);
  if(m){let a=+m[3]; if(a<100)a+=2000;
    return `${a}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}
  const d=new Date(s);
  if(isNaN(d))return null;
  const y=d.getFullYear();
  return (y<1990||y>2100)?null:isoDe(d);      // descarta años imposibles
}
function aNum(v){
  if(v==null||v==='')return null;
  const n=Number(String(v).replace(/[^0-9.,-]/g,'').replace(',','.'));
  return isFinite(n)?n:null;
}

/* ---------- lectura de un Excel: ubica el encabezado ---------- */
function leerHoja(filas,claves){
  for(let i=0;i<Math.min(14,filas.length);i++){
    const f=(filas[i]||[]).map(nrm);
    const hay=claves.filter(k=>f.some(c=>c===nrm(k))).length;
    if(hay>=Math.min(3,claves.length)){
      const cols={}; (filas[i]||[]).forEach((c,j)=>{const k=nrm(c); if(k&&!(k in cols))cols[k]=j;});
      return {fila:i,cols};
    }
  }
  return null;
}
const val=(f,cols,...nombres)=>{
  for(const n of nombres){const j=cols[nrm(n)]; if(j!==undefined&&f[j]!==''&&f[j]!=null)return f[j];}
  return null;
};

/* ═══════ PLANILLA DE ENVÍO ═══════ */
const PLAN_COLS=['Obra','N° de Planilla','Item','N° Frasco','Código del Equipo','Marca','Modelo','Serie',
  'Sistema','Tipo de Aceite','Horometro','Muestreo','Envio'];
function leerPlanilla(filas){
  const m=leerHoja(filas,['N° Frasco','Sistema','Obra','Codigo del Equipo','Horometro']);
  if(!m)return null;
  const out=[];
  for(let i=m.fila+1;i<filas.length;i++){
    const f=filas[i]||[];
    const sap=String(val(f,m.cols,'Código del Equipo','Codigo del Equipo','Código\ndel Equipo','EQUIPO')??'').trim();
    const sis=String(val(f,m.cols,'Sistema')??'').trim();
    if(!sap&&!sis)continue;
    const e=datos.find(x=>nrm(x.cod_sap)===nrm(sap));
    out.push({
      obra:String(val(f,m.cols,'Obra')??'').trim()||null,

/* Columnas de análisis que se guardan tal cual vengan */
const ANALISIS=['Hierro (ppm)','Cromo (ppm)','Plomo (ppm)','Cobre (ppm)','Estaño (ppm)','Aluminio (ppm)',
 'Niquel (ppm)','Plata (ppm)','Silicio (ppm)','Indice PQ','V40','V100','Hollin','Oxidacion','Nitracion',
 'Sulfatacion','ISO','ISO 4406 >5','ISO 4406 >10','ISO 4406 >15','4µm','6µm','10µm','14µm','18µm','21µm',
 '38µm','50µm','70µm','TBN (mg KOH/g)','Agua (% V)','Diesel (%)','Refrigerante (%)','Sodio (ppm)',
 'Boro (ppm)','Magnesio (ppm)','Calcio (ppm)','Zinc (ppm)','Fosforo (ppm)'];

function leerResultados(filas,fuente){
  const m=leerHoja(filas,['N° MUESTRA','EQUIPO','COMPONENTE','FECHA','ESTADO']);
  if(!m)return null;
  const out=[];
  for(let i=m.fila+1;i<filas.length;i++){
    const f=filas[i]||[];
    const nro=String(val(f,m.cols,'N° MUESTRA','Nro Muestra','N MUESTRA')??'').trim();
    if(!nro)continue;
    const sap=String(val(f,m.cols,'EQUIPO')??'').trim();
    const comp=String(val(f,m.cols,'COMPONENTE')??'').trim();
    const est=String(val(f,m.cols,'ESTADO')??'').trim();
    const e=datos.find(x=>nrm(x.cod_sap)===nrm(sap));
    const an={};
    ANALISIS.forEach(k=>{const v=val(f,m.cols,k); const n=aNum(v);
      if(n!=null)an[k]=n; else if(v!=null&&String(v).trim()&&String(v).trim()!=='-')an[k]=String(v).trim();});
    out.push({
      fuente, nro_muestra:nro,
      cod_frasco:String(val(f,m.cols,'CÓDIGO FRASCO (si aplica)','No. de Etiqueta','Codigo Frasco')??'').trim()||null,
      cod_sap:sap||null, maestro_id:e?e.id:null,
      obra:String(val(f,m.cols,'OBRA','Nombre del Cliente','Cuenta')??'').trim()||(e?e.cod_proyec:null),
      componente:comp||null, sistema_std:sistemaStd(comp),
      fecha:aFecha(val(f,m.cols,'FECHA','Fecha de muestreo')),
      horometro:aNum(val(f,m.cols,'HORAS','Horometro','Horómetro')),
      estado:est||null, estado_std:estadoStd(est),
      observacion:String(val(f,m.cols,'Interpretacion','Recomendaciones','Comentarios','Observación del reporte')??'').trim()||null,
      link_pdf:String(val(f,m.cols,'Link al reporte PDF (OneDrive)','Link PDF')??'').trim()||null,
      analisis:Object.keys(an).length?an:null
    });
  }
  return out;
}
/* Enlaza cada resultado con su fila de la planilla */
function enlazarPlanilla(r){
  // 1) por clave EQUIPO_SISTEMA_FECHA
  const k=claveMuestra(r.cod_sap,r.sistema_std||r.componente,r.fecha);
  if(k){
    const p=PLAN.find(x=>claveMuestra(x.cod_sap,x.sistema_std||x.sistema,x.f_muestreo)===k);
    if(p)return p;
  }
  if(r.cod_frasco){
    const p=PLAN.find(x=>x.nro_frasco&&nrm(x.nro_frasco)===nrm(r.cod_frasco));
    if(p)return p;
  }
  // sin frasco: mismo equipo, mismo sistema y la fecha de muestreo más cercana
  const cand=PLAN.filter(x=>nrm(x.cod_sap)===nrm(r.cod_sap)
    && (!r.sistema_std||!x.sistema_std||x.sistema_std===r.sistema_std));
  if(!cand.length)return null;
  if(!r.fecha)return cand[0];
  const t=new Date(r.fecha+'T00:00:00').getTime();
  let mejor=null,dmin=Infinity;
  cand.forEach(x=>{
    if(!x.f_muestreo)return;
    const d=Math.abs(new Date(x.f_muestreo+'T00:00:00').getTime()-t)/86400000;
    if(d<dmin){dmin=d;mejor=x;}
  });
  return dmin<=45?mejor:null;      // más de mes y medio de diferencia: no se asume
}

function ale(r){ return ALE.find(a=>String(a.resultado_id)===String(r.id))||{}; }
async function guardarAlerta(rid,ctrl){
  const r=RES.find(x=>String(x.id)===String(rid)); if(!r)return;
  const col=ctrl.dataset.c;
  let val=ctrl.value===''?null:ctrl.value;
  let a=ALE.find(x=>String(x.resultado_id)===String(r.id));
  try{
    if(a){
      const {error}=await sb.from('sos_alertas').update({[col]:val}).eq('id',a.id).select('id');
      if(error)throw error;
      a[col]=val;
    }else{
      const nueva={resultado_id:r.id,nro_muestra:r.nro_muestra,link_pdf:r.link_pdf||null,[col]:val};
      const {data,error}=await sb.from('sos_alertas').insert(nueva).select().single();
      if(error)throw error;

/* ───────── PROGRAMACIÓN MENSUAL ─────────
   Se calcula sola cruzando el Maestro de Equipos (ubicación y horómetro,
   ya en vivo — no se vuelve a pedir esa información acá) con el Plan de
   Muestreo (frecuencia por tipo+sistema) y el histórico de Resultados
   (para saber qué ya se ejecutó). */
function esDesmov(s){return /^DESMOVILIZ/.test(String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase());}
function calcProgramacion(){
  const hoy=hoy0();
  const finMes=new Date(hoy.getFullYear(),hoy.getMonth()+1,0);
  const diasRestantes=Math.max(0,dias(finMes,hoy));
  const mesActual=isoDe(hoy).slice(0,7);
  const filas=[];
  datos.filter(e=>!esDesmov(e.status)).forEach(e=>{
    PM.filter(p=>nrm(p.tipo_equipo)===nrm(e.familia)).forEach(p=>{
      const freq=+p.frecuencia||0; if(!freq)return;
      const horAct=+e.hrkm_actual||0, hrDia=+e.hr_dia||0;
      const hist=RES.filter(r=>r.cod_sap===e.cod_sap&&nrm(r.sistema_std||r.componente||'')===nrm(p.sistema))
        .sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));
      const ultimo=hist[0]||null;
      const baseHor=ultimo?(+ultimo.horometro||0):0;
      const proximoHor=freq*(Math.floor(baseHor/freq)+1);
      const proyectadoFin=horAct+hrDia*diasRestantes;
      const proyectado7=horAct+hrDia*7;
      const vencido=horAct>=proximoHor;
      const venceSemana=!vencido&&proyectado7>=proximoHor;
      const venceMes=!vencido&&!venceSemana&&proyectadoFin>=proximoHor;
      const ejecutadoEsteMes=ultimo&&String(ultimo.fecha||'').slice(0,7)===mesActual&&baseHor>=proximoHor-freq;
      let estado='OK';
      if(ejecutadoEsteMes)estado='Ejecutado';
      else if(vencido)estado='Vencido';
      else if(venceSemana)estado='Vence esta semana';
      else if(venceMes)estado='Programado';
      filas.push({equipo:e,plan:p,horAct,proximoHor,faltan:Math.round(proximoHor-horAct),estado,ultimo});
    });
  });
  return filas;
}

/* ───────── CUMPLIMIENTO / RANGO DE OPERACIÓN ─────────
   Cruza el histórico de Resultados con la "vida útil" de cada componente
   (horómetro de la muestra menos el horómetro de ingreso del equipo,
   ya guardado en Maestro) para ver en qué tramo de vida empiezan a
   fallar los sistemas. */
function tramoDe(vida){
  if(vida==null||vida<0)return null;
  const ini=Math.floor(vida/2000)*2000;
  return `${ini/1000}k-${(ini+2000)/1000}k h`;
}
function calcRango(){
  const eqPorSap=new Map(datos.map(e=>[e.cod_sap,e]));
  const tipo=fTipoEq.value, sis=fSistema.value;
  const filas=RES.filter(r=>{
    const e=eqPorSap.get(r.cod_sap); if(!e)return false;
    if(tipo&&nrm(e.familia)!==nrm(tipo))return false;
    if(sis&&nrm(r.sistema_std||'')!==nrm(sis))return false;
    return e.hrkm_ingreso!=null&&r.horometro!=null;
  }).map(r=>{
    const e=eqPorSap.get(r.cod_sap);
    const vida=(+r.horometro||0)-(+e.hrkm_ingreso||0);
    return {vida,tramo:tramoDe(vida),estado:r.estado_std};
  }).filter(f=>f.tramo);
  const porTramo=new Map();
  filas.forEach(f=>{
    if(!porTramo.has(f.tramo))porTramo.set(f.tramo,{total:0,normal:0,precaucion:0,critico:0});
    const t=porTramo.get(f.tramo); t.total++;
    if(f.estado==='NORMAL')t.normal++; else if(f.estado==='PRECAUCION')t.precaucion++; else if(f.estado==='CRITICO')t.critico++;
  });
  return [...porTramo.entries()].sort((a,b)=>+a[0].replace('k','')-+b[0].replace('k',''));
}
function pintarRango(){
  const T=calcRango();
  const totalMuestras=T.reduce((a,[,c])=>a+c.total,0);
  const totalObs=T.reduce((a,[,c])=>a+c.precaucion+c.critico,0);
  cards.innerHTML=card('Muestras analizadas',totalMuestras,'con vida útil calculable')
    +card('Con observación',totalObs,'precaución + crítico','warn')
    +card('% con observación',totalMuestras?Math.round(totalObs/totalMuestras*100)+'%':'—','del total','bad');
  if(!T.length){boxRango.innerHTML='<div class="vacio">Sin datos suficientes — revisa que Maestro tenga el horómetro de ingreso cargado y que haya resultados con horómetro.</div>';return;}
  boxRango.innerHTML=`<table class="t"><thead><tr>
    <th>Rango de operación</th><th class="r">N° de muestras</th><th class="r">Normal</th>
    <th class="r">Precaución</th><th class="r">Crítico</th><th class="r">% con observación</th></tr></thead><tbody>
    ${T.map(([tramo,c])=>`<tr>
      <td class="mono">${esc(tramo)}</td><td class="r mono">${c.total}</td>
      <td class="r mono">${c.normal}</td><td class="r mono">${c.precaucion}</td><td class="r mono">${c.critico}</td>
      <td class="r mono">${Math.round((c.precaucion+c.critico)/c.total*100)}%</td>
    </tr>`).join('')}</tbody></table>`;
}

/* ═══════════════ SUBIR ARCHIVO ═══════════════ */
/* Reconoce el archivo por sus columnas, no por el nombre */
function detectarTipo(filas,nombre,hoja){
  const t=nrm(nombre+' '+hoja);
  if(/INGRESO|FESA|LUBTEC|MARCO/.test(t))return leerHoja(filas,['N° MUESTRA','EQUIPO','COMPONENTE'])?'res':null;
  if(/PLANILLA/.test(t))return leerHoja(filas,['N° Frasco','Sistema'])?'plan':null;
  // sin pistas en el nombre: se mira el contenido
  if(leerHoja(filas,['N° MUESTRA','EQUIPO','COMPONENTE','ESTADO']))return 'res';
  if(leerHoja(filas,['N° Frasco','Sistema','Muestreo']))return 'plan';
  return null;
}

btnSubir.onclick=()=>{
  const i=document.createElement('input'); i.type='file'; i.accept='.xlsx,.xls,.csv';
  i.onchange=async()=>{
    const f=i.files&&i.files[0]; if(!f)return;
    pie.textContent='Leyendo '+f.name+'…';
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
      const hoja=wb.Sheets[wb.SheetNames[0]];
      const filas=XLSX.utils.sheet_to_json(hoja,{header:1,raw:true,defval:''});
      // se reconoce solo si es una planilla de envío o un ingreso de laboratorio,
      // sin importar en qué vista estés
      const tipo=detectarTipo(filas,f.name,wb.SheetNames[0]);
      if(tipo==='plan'){ verVista('plan'); await subirPlanilla(filas,f.name); }
      else if(tipo==='res'){ verVista('res'); await subirResultados(filas,f.name,wb.SheetNames[0]); }
      else alert('No se reconoció el formato del archivo.\n\n'
        +'Se esperaba una PLANILLA DE MUESTRAS (con N° Frasco, Código del Equipo, Sistema, Muestreo)\n'
        +'o un archivo de laboratorio (con N° MUESTRA, EQUIPO, COMPONENTE, FECHA, ESTADO).');
    }catch(err){ alert('No se pudo leer el archivo: '+err.message); }
    pie.textContent='';
  };
  i.click();
};

async function subirPlanilla(filas,nom){
  const regs=leerPlanilla(filas);
  if(!regs||!regs.length){alert('No se reconoció el formato.\n\nDebe tener las columnas de la PLANILLA DE MUESTRAS: N° Frasco, Código del Equipo, Sistema, Muestreo…');return;}
  const clave=p=>[p.nro_planilla||'',p.nro_frasco||'',p.cod_sap||'',p.sistema||''].join('|');
  const yaHay=new Set(PLAN.map(clave));
  const nuevos=regs.filter(p=>!yaHay.has(clave(p)));
  const sinEq=regs.filter(p=>!p.maestro_id&&p.cod_sap);
  const sinSis=regs.filter(p=>p.sistema&&!p.sistema_std);
  if(!confirm(`${nom}\n\n`
    +`Muestras leídas: ${regs.length}\n`
    +`Nuevas para agregar: ${nuevos.length}\n`
    +`Ya registradas (se omiten): ${regs.length-nuevos.length}\n`
    +(sinEq.length?`Códigos que no están en Equipos: ${sinEq.length}\n`:'')
    +(sinSis.length?`Sistemas sin equivalencia: ${sinSis.length} (los podrás asignar después)\n`:'')
    +`\n¿Guardar?`))return;
  if(!nuevos.length)return;
  let ok=0,err='';
  for(let i=0;i<nuevos.length;i+=200){
    const {error}=await sb.from('sos_planilla').insert(nuevos.slice(i,i+200));
    if(error){err=error.message;break;} ok+=Math.min(200,nuevos.length-i);
  }
  if(err)alert('Se guardaron '+ok+' y luego hubo un error:\n'+err);
  await cargarTodo();
  pie.textContent=`${ok} muestra(s) agregadas a la planilla.`;
}

async function subirResultados(filas,nom,hoja){
  // el laboratorio se deduce del nombre de la hoja o del archivo
  const t=nrm(hoja+' '+nom);
  let fuente = /FESA/.test(t)?'FESA' : /LUBTEC/.test(t)?'LUBTEC' : /MARCO/.test(t)?'MARCO PERUANA' : null;
  if(!fuente){
    fuente=prompt('¿De qué laboratorio es este archivo?\n\nEscribe: FESA, LUBTEC o MARCO','FESA');
    if(!fuente)return;
    fuente=nrm(fuente).startsWith('MARCO')?'MARCO PERUANA':nrm(fuente);
  }
  const regs=leerResultados(filas,fuente);
  if(!regs||!regs.length){alert('No se reconoció el formato.\n\nDebe tener las columnas N° MUESTRA, EQUIPO, COMPONENTE, FECHA y ESTADO.');return;}
  // enlazar con la planilla y detectar lo que falta uniformar
  regs.forEach(r=>{const p=enlazarPlanilla(r); r.planilla_id=p?p.id:null;});
  const yaHay=new Set(RES.map(r=>r.fuente+'|'+nrm(r.nro_muestra)));
  const nuevos=regs.filter(r=>!yaHay.has(r.fuente+'|'+nrm(r.nro_muestra)));
  const sinEst=[...new Set(regs.filter(r=>r.estado&&!r.estado_std).map(r=>r.estado))];
  const sinSis=[...new Set(regs.filter(r=>r.componente&&!r.sistema_std).map(r=>r.componente))];
  const enl=nuevos.filter(r=>r.planilla_id).length;
  let msg=`${nom}  ·  laboratorio: ${fuente}\n\n`
    +`Resultados leídos: ${regs.length}\n`
    +`Nuevos para agregar: ${nuevos.length}\n`
    +`Ya registrados (se omiten): ${regs.length-nuevos.length}\n`
    +`Enlazados con una muestra de la planilla: ${enl} de ${nuevos.length}\n`;
  if(sinEst.length)msg+=`\n⚠ Estados sin equivalencia (quedarán sin uniformar):\n  ${sinEst.slice(0,6).join(', ')}${sinEst.length>6?'…':''}\n`;
  if(sinSis.length)msg+=`\n⚠ Sistemas sin equivalencia:\n  ${sinSis.slice(0,6).join(', ')}${sinSis.length>6?'…':''}\n`;
  msg+='\n¿Guardar?';
  if(!confirm(msg))return;
  if(!nuevos.length)return;
  let ok=0,err='';
  for(let i=0;i<nuevos.length;i+=150){
    const {error}=await sb.from('sos_resultados').insert(nuevos.slice(i,i+150));
    if(error){err=error.message;break;} ok+=Math.min(150,nuevos.length-i);
  }
  if(err)alert('Se guardaron '+ok+' y luego hubo un error:\n'+err);
  // los que quedaron enlazados actualizan el N° de muestra en la planilla
  for(const r of nuevos.filter(x=>x.planilla_id)){
    await sb.from('sos_planilla').update({nro_muestra:r.nro_muestra}).eq('id',r.planilla_id);
  }
  await cargarTodo();
  pie.textContent=`${ok} resultado(s) agregados · ${enl} enlazados con la planilla.`;
  if(sinEst.length||sinSis.length){
    // se nombra exactamente qué falta y se ofrece resolverlo al momento
    const det=(sinEst.length?`Estados sin equivalencia (${sinEst.length}):\n   ${sinEst.join('\n   ')}\n\n`:'')
             +(sinSis.length?`Sistemas sin equivalencia (${sinSis.length}):\n   ${sinSis.slice(0,15).join('\n   ')}`
               +(sinSis.length>15?`\n   … y ${sinSis.length-15} más`:'')+'\n':'');
    const abrir=confirm(
      `Los resultados se guardaron, pero estos textos del laboratorio todavía no tienen equivalencia,\n`
      +`así que esas filas quedan sin uniformar y no entran en los filtros ni en las alertas:\n\n${det}\n`
      +`¿Abrir el panel de Equivalencias para asignarlas ahora?\n`
      +`(al guardarlas, los datos ya cargados se corrigen solos)`);
    if(abrir)eqAbrir();
  }
}

/* ═══════════════ EQUIVALENCIAS (uniformar los 3 laboratorios) ═══════════════ */
function eqAbrir(){
  const admin=perfil&&perfil.rol==='admin';
  // textos que aparecen en los datos pero aún no tienen equivalencia
  const faltaE=[...new Set(RES.filter(r=>r.estado&&!r.estado_std).map(r=>r.estado))].sort();
  const faltaS=[...new Set([...RES.filter(r=>r.componente&&!r.sistema_std).map(r=>r.componente),
                            ...PLAN.filter(p=>p.sistema&&!p.sistema_std).map(p=>p.sistema)])].sort();
  const stds=[...new Set([...EQS.values()])].sort();
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="meq"><div class="mc">
    <div class="mh"><div><h3>Equivalencias</h3>
      <div class="sub">Uniforman el texto de cada laboratorio a un estado y un sistema comunes.</div></div>
      <div class="spacer"></div><button class="act" id="eqCer">Cerrar</button></div>
    <div class="mb">
      ${(faltaE.length||faltaS.length)?`<div class="campo"><b>Sin equivalencia en los datos cargados</b>
        ${faltaE.length?`<div class="warn" style="font-size:12px;margin-bottom:4px">Estados: ${faltaE.map(esc).join(' · ')}</div>`:''}
        ${faltaS.length?`<div class="warn" style="font-size:12px">Sistemas: ${faltaS.map(esc).join(' · ')}</div>`:''}
        <div class="hint">Agrégalos abajo y vuelve a cargar el archivo para que se uniformen.</div></div>`
       :'<div class="campo"><b>Estado</b><div style="color:#15803d;font-size:12px">Todo lo cargado está uniformado.</div></div>'}
      <div class="campo"><b>Estados</b>
        <table class="t"><thead><tr><th>Texto del laboratorio</th><th>Laboratorio</th><th>Estado estándar</th>${admin?'<th></th>':''}</tr></thead>
        <tbody id="eqTE"></tbody></table>
        ${admin?`<div class="eqnew">
          <input id="e_txt" placeholder="Texto tal como lo escribe el laboratorio" list="faltaE">
          <datalist id="faltaE">${faltaE.map(t=>`<option>${esc(t)}</option>`).join('')}</datalist>
          <input id="e_lab" placeholder="Laboratorio" style="max-width:150px">
          <select id="e_std"><option>NORMAL</option><option>PRECAUCION</option><option>CRITICO</option></select>
          <button class="act primary" id="e_add">Agregar</button></div>`:''}
      </div>
      <div class="campo"><b>Sistemas</b>
        <table class="t"><thead><tr><th>Texto del laboratorio</th><th>Sistema estándar</th>${admin?'<th></th>':''}</tr></thead>
        <tbody id="eqTS"></tbody></table>
        ${admin?`<div class="eqnew">
          <input id="s_txt" placeholder="Texto tal como aparece" list="faltaS">
          <datalist id="faltaS">${faltaS.map(t=>`<option>${esc(t)}</option>`).join('')}</datalist>
          <input id="s_std" placeholder="Sistema estándar" list="stdl">
          <datalist id="stdl">${stds.map(t=>`<option>${esc(t)}</option>`).join('')}</datalist>
          <button class="act primary" id="s_add">Agregar</button></div>`:''}
      </div>
      ${admin?'':'<div class="hint">Solo los administradores pueden modificar estas tablas.</div>'}
    </div></div></div>`);
  eqPintarTablas();
  const cerrar=()=>{const e=document.getElementById('meq');if(e)e.remove();};
  document.getElementById('eqCer').onclick=cerrar;
  document.getElementById('meq').addEventListener('click',ev=>{if(ev.target.id==='meq')cerrar();});
  if(!admin)return;
  document.getElementById('e_add').onclick=async()=>{
    const t=document.getElementById('e_txt').value.trim();
    if(!t)return alert('Escribe el texto del laboratorio.');
    const d={texto:t,laboratorio:document.getElementById('e_lab').value.trim()||null,
             estandar:document.getElementById('e_std').value};
    const {error}=await sb.from('sos_eq_estado').insert(d);
    if(error)return alert('No se pudo agregar: '+error.message);
    EQE.set(nrm(t),nrm(d.estandar)); EQLE.push(d);
    document.getElementById('e_txt').value='';
    eqPintarTablas(); reNormalizar();
  };
  document.getElementById('s_add').onclick=async()=>{
    const t=document.getElementById('s_txt').value.trim(), s=document.getElementById('s_std').value.trim();
    if(!t||!s)return alert('Completa el texto y el sistema estándar.');
    const {error}=await sb.from('sos_eq_sistema').insert({texto:t,estandar:s});
    if(error)return alert('No se pudo agregar: '+error.message);
    EQS.set(nrm(t),s); EQLS.push({texto:t,estandar:s});
    document.getElementById('s_txt').value='';
    eqPintarTablas(); reNormalizar();
  };
}
function eqPintarTablas(){

  ts.querySelectorAll('[data-ds]').forEach(b=>b.onclick=async()=>{

/* al cambiar una equivalencia se vuelven a uniformar los datos ya guardados */
async function reNormalizar(){
  const camb=[];
  RES.forEach(r=>{
    const e=estadoStd(r.estado), s=sistemaStd(r.componente);
    if(e!==r.estado_std||s!==r.sistema_std){r.estado_std=e;r.sistema_std=s;camb.push(r);}
  });
  const cambP=[];
  PLAN.forEach(p=>{const s=sistemaStd(p.sistema);
    if(s!==p.sistema_std){p.sistema_std=s;cambP.push(p);}});
  for(const r of camb) await sb.from('sos_resultados').update({estado_std:r.estado_std,sistema_std:r.sistema_std}).eq('id',r.id);
  for(const p of cambP) await sb.from('sos_planilla').update({sistema_std:p.sistema_std}).eq('id',p.id);
  if(camb.length||cambP.length)pie.textContent=`Se uniformaron ${camb.length} resultado(s) y ${cambP.length} muestra(s).`;
  pintar();
}

/* Supabase entrega como máximo 1.000 filas por consulta. Esta función
   pide de a mil hasta traerlas todas, para que no falten periodos. */
async function traerTodo(tabla,orden,asc){
  const PASO=1000; let desde=0, out=[];
  for(;;){
    let q=sb.from(tabla).select('*');
    if(orden)q=q.order(orden,{ascending:asc!==false});
    const {data,error}=await q.range(desde,desde+PASO-1);
    if(error)return {data:out,error};
    out=out.concat(data||[]);
    if(!data||data.length<PASO)break;
    desde+=PASO;
    if(desde>200000)break;                       // tope de seguridad
  }
  return {data:out,error:null};
}
let PM=[], PARAM={}, STOCK=[];
async function cargarTodo(){
  pie.textContent='Cargando…';
  const [pl,re,al,pm,pa,st]=await Promise.all([
    traerTodo('sos_planilla','f_muestreo',false),
    traerTodo('sos_resultados','fecha',false),
    traerTodo('sos_alertas'),
    sb.from('sos_plan_muestreo').select('*').order('tipo_equipo').order('sistema'),
    sb.from('sos_parametros').select('*').eq('id',1).single(),
    traerTodo('sos_stock','codigo',true)
  ]);
  if(pl.error||re.error){pie.textContent='No se pudo cargar: '+((pl.error||re.error).message);return;}
  PLAN=pl.data||[]; RES=re.data||[]; ALE=al.data||[];
  PM=pm.data||[]; PARAM=pa.data||{}; STOCK=st.data||[];
  const obras=[...new Set([...PLAN.map(p=>p.obra),...RES.map(r=>r.obra),...datos.map(d=>d.cod_proyec)].filter(Boolean))].sort();
  fObra.innerHTML='<option value="">Todas las obras</option>'+obras.map(o=>`<option>${esc(o)}</option>`).join('');
  const siss=[...new Set(RES.map(r=>r.sistema_std).filter(Boolean))].sort();
  fSistema.innerHTML='<option value="">Todos los sistemas</option>'+siss.map(s=>`<option>${esc(s)}</option>`).join('');
  const tipos=[...new Set(datos.map(d=>d.familia).filter(Boolean))].sort();
  fTipoEq.innerHTML='<option value="">Todos los tipos de equipo</option>'+tipos.map(t=>`<option>${esc(t)}</option>`).join('');
  pie.textContent=`${PLAN.length} muestra(s) en planilla · ${RES.length} resultado(s) · ${ALE.length} en seguimiento.`;
  pintar();
}

/* ── Navegación entre pestañas (misma barra que en Equipos) ── */
const NAV_PAGINAS=[
  {k:'eq',  lab:'Equipos',    arch:'index.html',      win:'gllr_index'},
  {k:'pms', lab:'PM-S',       arch:'pms.html',        win:'gllr_pms'},

function navPuede(k){
  if(!perfil)return false;
  if(k==='eq')return true;
  if(perfil.rol==='admin')return true;
  return Array.isArray(perfil.paginas)&&perfil.paginas.includes(k);
}
/* ── Cambiar de pestaña sin recargar ──
   Antes de abrir una ventana se pregunta por su canal si ya está viva; si
   contesta, se le pide que se enfoque sola — nunca se llama a window.open()
   sobre una que ya existe, así jamás se recarga. Solo se abre una ventana
   nueva si nadie contesta a tiempo. */
function navPreguntar(nombreCanal,ms){
  if(!('BroadcastChannel' in window))return Promise.resolve(false);
  return new Promise(res=>{
    const ch=new BroadcastChannel(nombreCanal);
    let listo=false;
    const oye=ev=>{ if(ev.data&&ev.data.tipo==='pong'){listo=true;ch.removeEventListener('message',oye);ch.close();res(true);} };
    ch.addEventListener('message',oye);
    ch.postMessage({tipo:'ping'});
    setTimeout(()=>{ if(!listo){ch.removeEventListener('message',oye);ch.close();res(false);} },ms||260);
  });
}
// referencias propias, para las ventanas que esta página termina abriendo
const VENT={};
async function navAbrirOEnfocar(archivo,nombreCanal){
  // 1) ¿la abrí yo mismo antes? — la más confiable, es mía.
  const propia=VENT[nombreCanal];
  if(propia&&!propia.closed){try{propia.focus();return;}catch(_){}}
  // 2) Equipos es el centro: si me abrió a mí (window.opener), tiene las
  //    referencias reales de todas las ventanas — le pregunto si esa ya
  //    existe y, si es así, que la enfoque ella (referencia directa, no
  //    depende de que otra pestaña en segundo plano se enfoque sola).
  let esHub=false;
  try{ esHub = window.opener && !window.opener.closed && window.opener.ES_HUB; }catch(_){}
  if(esHub){
    // volver a Equipos: es mi propio "padre", se enfoca directo
    if(nombreCanal==='gllr_index'){ try{window.opener.focus();return;}catch(_){} }
    try{ if(window.opener.enfocarSiExiste(nombreCanal))return; }catch(_){}
    // no existe todavía: la abro YO (aquí el clic es real y reciente, así
    // el navegador no la bloquea) y le aviso a Equipos para la próxima vez
    const w=window.open(archivo,nombreCanal);
    if(w){
      try{w.focus();}catch(_){} VENT[nombreCanal]=w;
      try{window.opener.registrarVentana(nombreCanal,w);}catch(_){}
    }else alert('El navegador bloqueó la ventana emergente.\n\nPermite las ventanas emergentes de este sitio.');
    return;
  }
  // 3) no hay Equipos disponible como intermediario: preguntar por su
  //    canal directamente antes de abrir
  if(await navPreguntar(nombreCanal))return; // ya estaba abierta y se acaba de enfocar sola
  const w=window.open(archivo,nombreCanal);
  if(w){ try{w.focus();}catch(_){} VENT[nombreCanal]=w; }
  else alert('El navegador bloqueó la ventana emergente.\n\nPermite las ventanas emergentes de este sitio.');
}
function pintarNav(actual){
  const nav=document.getElementById('navPrin'); if(!nav)return;
  let h=NAV_PAGINAS.filter(p=>navPuede(p.k)).map(p=>
    `<button class="${p.k===actual?'on':''}" data-nav="${p.k}">${p.lab}</button>`).join('');
  nav.innerHTML=h;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.nav; if(k===actual)return;
    const p=NAV_PAGINAS.find(x=>x.k===k); if(!p)return;
    navAbrirOEnfocar(p.arch,p.win);
  });
}
