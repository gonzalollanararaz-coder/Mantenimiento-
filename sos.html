/* Resultado ya guardado en la fila de un sistema, pero el archivo del laboratorio
   dice que es de otro sistema que existe en la misma toma. */
function detectarMalUbicados(regs,fuente){
  const out=[], vistos=new Set();
  regs.forEach(r=>{
    if(!r.sistema_std)return;
    const P=MUESTRAS.find(m=>m.fuente===fuente&&nrm(m.nro_muestra)===nrm(r.nro_muestra));
    if(!P||stdDe(P)===r.sistema_std)return;
    const T=MUESTRAS.filter(m=>m.id!==P.id&&mismaToma(m,P)&&stdDe(m)===r.sistema_std);
    if(T.length!==1)return;                      // ninguna o varias candidatas: no se adivina
    const k=[P.id,T[0].id].sort().join('|');
    if(vistos.has(k))return; vistos.add(k);      // un intercambio A<->B se muestra una sola vez
    out.push({r,P,T:T[0]});
  });
  return out;
}

/* Resultado nuevo cuya fila (mismo equipo + sistema + fecha) ya tiene OTRO resultado.
   Devuelve los que el usuario decide crear como fila nueva. */
function revisarConflictos(lista,regs){
  return new Promise(resolve=>{
    const casos=lista.map(r=>{
      const P=getM(r.conflicto.id)||r.conflicto;     // la versión recién recargada, si existe
      const vacias=MUESTRAS.filter(m=>m.id!==P.id&&mismaToma(m,P)&&filaVacia(m));
      // ¿a qué sistema pertenece el resultado que hoy ocupa la fila? si viene en este
      // mismo archivo, el laboratorio lo dice; si no, se sugiere por descarte
      const regX=regs.find(x=>nrm(x.nro_muestra)===nrm(P.nro_muestra));
      let sug=null, porque='';
      if(regX&&regX.sistema_std){ sug=vacias.find(s=>stdDe(s)===regX.sistema_std)||null; if(sug)porque='según el archivo'; }
      if(!sug&&vacias.length===1){ sug=vacias[0]; porque='por descarte'; }
      return {r,P,vacias,sug,porque};
    });
    const el=modalPromesa('mconf',`<div class="modal" id="mconf"><div class="mc" style="width:min(880px,96vw)">
      <div class="mh"><h3>Resultados en conflicto</h3>
        <div class="sub">${casos.length} resultado(s) del archivo corresponden a una fila que ya tiene otro N° de muestra. Elige qué hacer con cada uno.</div>
        <div class="spacer"></div></div>
      <div class="mb">
        <table class="t"><thead><tr><th>Equipo · fecha</th><th>Sistema</th><th>Llega</th><th>La fila ya tiene</th><th>Qué hacer</th></tr></thead>
        <tbody>${casos.map((c,i)=>`<tr>
          <td>${esc(c.P.cod_sap)} · ${fmtDate(String(c.P.f_muestreo).slice(0,10))}</td>
          <td>${esc(c.P.sistema||'')}</td>
          <td class="mono"><b>${esc(c.r.nro_muestra)}</b></td>
          <td class="mono">${esc(c.P.nro_muestra||'—')}</td>
          <td><select class="confSel" data-i="${i}" style="max-width:340px">
            ${c.vacias.map(s=>`<option value="mover:${s.id}" ${c.sug&&c.sug.id===s.id?'selected':''}>
              Cargar ${esc(c.r.nro_muestra)} aquí y pasar ${esc(c.P.nro_muestra||'')} a ${esc(s.sistema||'')}${c.sug&&c.sug.id===s.id?` (sugerido ${c.porque})`:''}</option>`).join('')}
            <option value="nada" ${c.sug?'':'selected'}>No cargar ${esc(c.r.nro_muestra)} por ahora</option>
            <option value="nueva">Crear una fila nueva para ${esc(c.r.nro_muestra)}</option>
          </select></td></tr>`).join('')}</tbody></table>
        <div style="font-size:11px;color:var(--muted);margin-top:8px">"Crear una fila nueva" solo si de verdad se tomó otra muestra de ese sistema ese día: si no, queda duplicado.</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)">
        <button class="act" id="confNo">Cerrar sin cambios</button><button class="act primary" id="confOk">Aplicar</button></div>
    </div></div>`);
    document.getElementById('confNo').onclick=()=>{ el.remove(); resolve([]); };
    document.getElementById('confOk').onclick=async()=>{
      const extra=[]; let ok=0; const fallas=[];
      for(const s of el.querySelectorAll('.confSel')){
        const c=casos[+s.dataset.i], v=s.value;
        if(v==='nada')continue;
        if(v==='nueva'){ extra.push(c.r); continue; }
        const P=getM(c.P.id), S=getM(v.split(':')[1]);
        if(!P||!S||!filaVacia(S)){ fallas.push(`${c.r.nro_muestra}: la fila destino ya no está vacía`); continue; }
        try{
          await intercambiarRes(P,S);                 // el resultado anterior pasa a la fila vacía
          await guardarRes(P.id,{                     // y la fila recibe el que llega en el archivo
            fuente:c.r.fuente, nro_muestra:c.r.nro_muestra, estado:c.r.estado, estado_std:c.r.estado_std,
            observacion_lab:c.r.observacion, link_pdf:c.r.link_pdf, analisis:c.r.analisis,
            nro_frasco:P.nro_frasco||c.r.cod_frasco||null, horometro:P.horometro??c.r.horometro
          });
          ok++;
        }catch(e){ fallas.push(`${c.r.nro_muestra}: ${e.message}`); }
      }
      if(fallas.length)alert(`Se resolvieron ${ok} conflicto(s).\n\nNo se pudieron aplicar:\n`+fallas.slice(0,8).join('\n'));
      if(ok)pie.textContent=`${ok} conflicto(s) resueltos sin crear filas duplicadas.`;
      pintar(); el.remove(); resolve(extra);
    };
  });
}

  if(del)del.onclick=async()=>{
    if(!confirm('¿Eliminar esta muestra de la planilla?'))return;
    const {error}=await sb.from('sos_muestras').delete().eq('id',p.id);

    const sisTxt=document.getElementById('p_sis').value.trim();
    const fraCod=document.getElementById('p_fra').value.trim()||null;
    const fmuestreo=document.getElementById('p_fm').value||null;
    let obs=document.getElementById('p_obs').value.trim();
    const obra=document.getElementById('p_obra').value.trim()||(e?e.cod_proyec:null);

      tipo_aceite:document.getElementById('p_ace').value.trim()||null,
      horometro:aNum(document.getElementById('p_hor').value),
      horas_aceite:aNum(document.getElementById('p_hac').value),
      galones:aNum(document.getElementById('p_gal').value),
      cant_agregado:aNum(document.getElementById('p_agr').value)??0,
      f_muestreo:fmuestreo,
      f_envio:document.getElementById('p_fe').value||null,
      tipo:document.getElementById('p_tip').value||null,
      observacion:obs||null,
      registrado_por:perfil?perfil.nombre:null
    };
    if(!d.maestro_id){alert('Elige el equipo.');return;}
    if(!d.f_muestreo){alert('Indica la fecha de muestreo.');return;}
    const {data:guardado,error}= id ? await sb.from('sos_muestras').update(d).eq('id',p.id).select().single()
                      : await sb.from('sos_muestras').insert(d).select().single();
    if(error)return alert('No se pudo guardar: '+error.message);
    // sincronizar el catálogo de frascos si el N° de frasco cambió
    if(fraCod!==(p.nro_frasco||null)){
      if(p.nro_frasco){
        const antiguo=FRASCOS.find(f=>f.codigo===p.nro_frasco&&f.estado==='Usado');
        if(antiguo){
          await sb.from('sos_frascos').update({estado:'Enviado',fecha_uso:null,planilla_id:null}).eq('id',antiguo.id);
          antiguo.estado='Enviado'; antiguo.fecha_uso=null; antiguo.planilla_id=null;
        }
      }
      if(fraCod){
        const nuevo=FRASCOS.find(f=>f.codigo===fraCod);
        if(nuevo){
          await sb.from('sos_frascos').update({estado:'Usado',fecha_uso:d.f_muestreo,planilla_id:guardado.id,updated_at:new Date().toISOString()}).eq('id',nuevo.id);
          nuevo.estado='Usado'; nuevo.fecha_uso=d.f_muestreo; nuevo.planilla_id=guardado.id;
        }
      }
    }
    cerrar(); await cargarTodo();
  };
}

function reconstruirEQE(){ EQE.clear(); EQLE.forEach(x=>EQE.set(nrm(x.texto),nrm(x.estandar))); }
function reconstruirEQS(){ EQS.clear(); EQLS.forEach(x=>EQS.set(nrm(x.texto),String(x.estandar).trim())); }
function reconstruirEQT(){ EQT.clear(); EQLT.forEach(x=>EQT.set(nrm(x.texto),x.estandar)); }
function eqEditar(td,tabla,lista,recomponer,id,campo,tipo,opciones){
  if(!(perfil&&perfil.rol==='admin'))return;
  if(td.querySelector('input,select'))return;
  const row=lista.find(x=>String(x.id)===String(id)); if(!row)return;
  const original=td.innerHTML;
  let editor;
  if(tipo==='select'){
    editor=document.createElement('select');
    opciones.forEach(o=>{const op=document.createElement('option'); op.value=o; op.textContent=o; if(nrm(row[campo]||'')===nrm(o))op.selected=true; editor.appendChild(op);});
  }else{
    editor=document.createElement('input'); editor.type=tipo==='num'?'number':'text'; if(tipo==='num')editor.step='any';
    editor.value=row[campo]??'';
  }
  editor.className='ed'; editor.style.width='100%'; editor.style.boxSizing='border-box';
  td.innerHTML=''; td.appendChild(editor); editor.focus(); if(editor.select)editor.select();
  const vacioPermitido=campo==='laboratorio'||campo==='limite';
  let resuelto=false;
  async function confirmar(){
    if(resuelto)return; resuelto=true;
    const crudo=editor.value.trim();
    if(!vacioPermitido&&!crudo){ td.innerHTML=original; return; }
    const nuevo=tipo==='num'?(crudo===''?null:+crudo):(crudo||null);
    if(nuevo===(row[campo]??null)){ eqPintarTablas(); return; }
    const {error}=await sb.from(tabla).update({[campo]:nuevo}).eq('id',id);
    if(error){ alert('No se pudo guardar: '+error.message); td.innerHTML=original; return; }
    row[campo]=nuevo;
    recomponer();
    eqPintarTablas();
    if(tabla==='sos_eq_estado'||tabla==='sos_eq_sistema')reNormalizar();
    if(tabla==='sos_eq_tipo'&&vista==='fra')pintarFra();
  }
  editor.onblur=confirmar;
  editor.onkeydown=ev=>{
    if(ev.key==='Enter'){ev.preventDefault();confirmar();}
    if(ev.key==='Escape'){resuelto=true; td.innerHTML=original;}
  };
  if(editor.tagName==='SELECT')editor.onchange=confirmar;
}

/* al cambiar una equivalencia se vuelven a uniformar los datos ya guardados */
async function reNormalizar(){
  const camb=[];
  MUESTRAS.forEach(p=>{
    const e=p.estado?estadoStd(p.estado):p.estado_std, s=sistemaStd(p.sistema);
    if(e!==p.estado_std||s!==p.sistema_std){p.estado_std=e;p.sistema_std=s;camb.push(p);}
  });
  for(const p of camb) await sb.from('sos_muestras').update({estado_std:p.estado_std,sistema_std:p.sistema_std}).eq('id',p.id);
  if(camb.length)pie.textContent=`Se uniformaron ${camb.length} muestra(s).`;
  pintar();
}

/* Supabase entrega como máximo 1.000 filas por consulta. Esta función
   pide de a mil hasta traerlas todas, para que no falten periodos. */
async function traerTodo(tabla,orden,asc){
  const PASO=1000; let desde=0, out=[];
  for(;;){
    let q=sb.from(tabla).select('*');
    if(orden)q=q.order(orden,{ascending:asc!==false});
    const {data,error}=await q.range(desde,desde+PASO-1);
    if(error)return {data:out,error};
    out=out.concat(data||[]);
    if(!data||data.length<PASO)break;
    desde+=PASO;
    if(desde>200000)break;                       // tope de seguridad
  }
  return {data:out,error:null};
}
async function cargarTodo(){
  pie.textContent='Cargando…';
  const [pl,al,li]=await Promise.all([
    traerTodo('sos_muestras','f_muestreo',false),
    traerTodo('sos_alertas'),
    sb.from('sos_limites').select('*').order('orden')
  ]);
  if(pl.error){pie.textContent='No se pudo cargar: '+pl.error.message;return;}
  MUESTRAS=pl.data||[]; ALE=al.data||[]; LIMITES=li.data||[];
  const obraSel=fObra.value, sisSel=fSistema.value;
  const obras=[...new Set(MUESTRAS.map(p=>p.obra).filter(Boolean))].sort();
  fObra.innerHTML='<option value="">Obra</option>'+obras.map(o=>`<option>${esc(o)}</option>`).join('');
  fObra.value=obraSel;
  const siss=[...new Set(MUESTRAS.map(r=>r.sistema_std).filter(Boolean))].sort();
  fSistema.innerHTML='<option value="">Sistemas</option>'+siss.map(s=>`<option>${esc(s)}</option>`).join('');
  fSistema.value=sisSel;
  pie.textContent=`${MUESTRAS.length} muestra(s) · ${MUESTRAS.filter(m=>m.estado_std).length} con resultado · ${ALE.length} en seguimiento.`;
  pintar();
}

/* ── Navegación entre pestañas (misma barra que en Equipos) ── */
const NAV_PAGINAS=[
  {k:'eq',  lab:'Equipos',    arch:'index.html',      win:'gllr_index'},
  {k:'pms', lab:'PM-S',       arch:'pms.html',        win:'gllr_pms'},

function navPuede(k){
  if(!perfil)return false;
  if(k==='eq')return true;
  if(perfil.rol==='admin')return true;
  return Array.isArray(perfil.paginas)&&perfil.paginas.includes(k);
}
/* ── Cambiar de pestaña sin recargar ──
   Antes de abrir una ventana se pregunta por su canal si ya está viva; si
   contesta, se le pide que se enfoque sola — nunca se llama a window.open()
   sobre una que ya existe, así jamás se recarga. Solo se abre una ventana
   nueva si nadie contesta a tiempo. */
function navPreguntar(nombreCanal,ms){
  if(!('BroadcastChannel' in window))return Promise.resolve(false);
  return new Promise(res=>{
    const ch=new BroadcastChannel(nombreCanal);
    let listo=false;
    const oye=ev=>{ if(ev.data&&ev.data.tipo==='pong'){listo=true;ch.removeEventListener('message',oye);ch.close();res(true);} };
    ch.addEventListener('message',oye);
    ch.postMessage({tipo:'ping'});
    setTimeout(()=>{ if(!listo){ch.removeEventListener('message',oye);ch.close();res(false);} },ms||260);
  });
}
// referencias propias, para las ventanas que esta página termina abriendo
const VENT={};
async function navAbrirOEnfocar(archivo,nombreCanal){
  // 1) ¿la abrí yo mismo antes? — la más confiable, es mía.
  const propia=VENT[nombreCanal];
  if(propia&&!propia.closed){try{propia.focus();return;}catch(_){}}
  // 2) Equipos es el centro: si me abrió a mí (window.opener), tiene las
  //    referencias reales de todas las ventanas — le pregunto si esa ya
  //    existe y, si es así, que la enfoque ella (referencia directa, no
  //    depende de que otra pestaña en segundo plano se enfoque sola).
  let esHub=false;
  try{ esHub = window.opener && !window.opener.closed && window.opener.ES_HUB; }catch(_){}
  if(esHub){
    // volver a Equipos: es mi propio "padre", se enfoca directo
    if(nombreCanal==='gllr_index'){ try{window.opener.focus();return;}catch(_){} }
    try{ if(window.opener.enfocarSiExiste(nombreCanal))return; }catch(_){}
    // no existe todavía: la abro YO (aquí el clic es real y reciente, así
    // el navegador no la bloquea) y le aviso a Equipos para la próxima vez
    const w=window.open(archivo,nombreCanal);
    if(w){
      try{w.focus();}catch(_){} VENT[nombreCanal]=w;
      try{window.opener.registrarVentana(nombreCanal,w);}catch(_){}
    }else alert('El navegador bloqueó la ventana emergente.\n\nPermite las ventanas emergentes de este sitio.');
    return;
  }
  // 3) no hay Equipos disponible como intermediario: preguntar por su
  //    canal directamente antes de abrir
  if(await navPreguntar(nombreCanal))return; // ya estaba abierta y se acaba de enfocar sola
  const w=window.open(archivo,nombreCanal);
  if(w){ try{w.focus();}catch(_){} VENT[nombreCanal]=w; }
  else alert('El navegador bloqueó la ventana emergente.\n\nPermite las ventanas emergentes de este sitio.');
}
function pintarNav(actual){
  const nav=document.getElementById('navPrin'); if(!nav)return;
  let h=NAV_PAGINAS.filter(p=>navPuede(p.k)).map(p=>
    `<button class="${p.k===actual?'on':''}" data-nav="${p.k}">${p.lab}</button>`).join('');
  nav.innerHTML=h;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.nav; if(k===actual)return;
    const p=NAV_PAGINAS.find(x=>x.k===k); if(!p)return;
    navAbrirOEnfocar(p.arch,p.win);
  });
}
