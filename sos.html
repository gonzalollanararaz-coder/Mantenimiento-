<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="gllr-version" content="V.101026-5" data-pagina="SOS">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOS &mdash; Muestreo de Aceites</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icono-16.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c232b">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="supabase.js"></script>
<style>
  :root{--steel:#1c232b;--amber:#FFCD11;--line:#dfe3e7;--ink:#1a1d21;--muted:#6b747d;--bg:#f4f6f8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .hide{display:none !important}
  .mono{font-family:"SF Mono",ui-monospace,monospace}
  .spacer{flex:1}
  header{background:var(--steel);color:#fff;padding:8px 16px;display:flex;align-items:center;flex-shrink:0}
  .brand-min{width:270px;flex:0 0 270px;overflow:hidden}
  .brand-min h1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-min p{font-size:10px;color:#9aa4ad;text-transform:uppercase;letter-spacing:1.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .who{font-size:12px;color:#cdd4da}
  header .sp2{flex:1}
  /* nivel 1 — pestañas entre páginas, píldora flotante */
  header nav{align-items:center;background:#12161B;border-radius:10px;padding:3px;gap:2px;
    display:flex;flex-shrink:0;margin-left:14px}
  header nav button{background:transparent;border:none;padding:7px 14px;cursor:pointer;font:inherit;
    font-size:12.5px;font-weight:600;color:#8E959C;border-radius:7px;transition:background .12s,color .12s}
  header nav button:hover{color:#fff;background:#1D232B}
  header nav button.on{background:var(--amber);color:#1A1200}
  /* nivel 2 — sub-pestañas propias de SOS, más discretas, debajo del nivel 1 */
  #subnav{background:#fff;border-bottom:1px solid var(--line);padding:0 16px;display:flex;gap:4px;flex-shrink:0}
  #subnav button{background:none;border:none;padding:10px 14px;cursor:pointer;font:inherit;
    font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent}
  #subnav button:hover{color:var(--ink)}
  #subnav button.on{color:var(--ink);border-bottom-color:var(--amber)}
  .toolbar{display:flex;flex-wrap:nowrap;gap:12px;align-items:center;padding:9px 16px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0;height:auto;overflow-x:auto}
  .toolbar>*{flex:0 0 auto}
  .toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;height:34px;padding:0 12px;font-size:12.5px}
  #fObra,#fSistema,#fFuente{min-width:150px;flex:0 0 auto}
  .act{border:1px solid var(--line);background:#fff;border-radius:9px;height:34px;padding:0 13px;
    font-weight:500;font-size:12.5px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .act:hover{border-color:#C9CDD2;filter:none}
  .act.primary{background:linear-gradient(180deg,#FFE98A,#FFD84A);border-color:#DCB61C;color:#5C4708;font-weight:600}
  /* agrupación de la barra: filtros / edición / acciones */
  .grupo-wrap{display:flex;flex-direction:column;gap:2px;align-items:stretch}
  .rotulo{font-size:9px;font-weight:800;color:#98a2ad;text-transform:uppercase;letter-spacing:.5px}
  .grupo{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;border-radius:9px;padding:5px 7px}
  .grupo.filtros{background:#F0F2F8}
  .grupo.filtros .act,.grupo.filtros input,.grupo.filtros select{background:#fff}
  .grupo.deshacer{background:#FFF5E0}
  .grupo.deshacer .act{background:#fff;border-color:#F0D48A;color:#8A6300}
  .grupo.acciones{background:#EAF5EC}
  .grupo.acciones .act{background:#fff}
  .grupo.acciones .act.util{color:#4254A5;border-color:#C7CDEB}
  .toolbar-sep{width:1px;align-self:stretch;background:#D8DDE2;margin:14px 0 2px}
  .act.bad,.act.clear{background:linear-gradient(180deg,#FBE6E6,#F5CFCF);border-color:#DFA0A0;color:#8E2020;font-weight:600}
  .chip{background:#FBFBFB;border:1px solid #E0E3E6;border-radius:9px;height:34px;padding:0 13px;font-size:12.5px;font-weight:500;color:#9AA0A6;display:inline-flex;align-items:center}
  footer{padding:6px 16px;color:var(--muted);font-size:12px;text-align:center;flex-shrink:0}
  #wrap{flex:1;overflow:auto;padding:0 14px 10px;min-height:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;
    position:sticky;top:0;z-index:8;background:var(--bg);padding:10px 0}
  .cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:10px 0}
  .c{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px}
  .c.cf{cursor:pointer;transition:box-shadow .1s,border-color .1s}
  .c.cf:hover{box-shadow:0 0 0 2px #DDE0E3}
  .c.cf.on{box-shadow:0 0 0 2px var(--amber);background:#FFFBE8}
  .c .l{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .c .v{font-size:22px;font-weight:800;color:#1F3864;line-height:1.15;margin-top:2px}
  .c .v .ratio{font-size:14px;color:#98a2ad;font-weight:700}
  .c .s .ratio{color:#c2c7cd}
  .c .v.bad{color:#dc2626}.c .v.warn{color:#B45309}.c .v.ok{color:#15803d}
  .c .s{font-size:9.5px;color:#98a2ad;margin-top:2px}
  table.t{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff}
  table.t th{background:linear-gradient(180deg,#7B87C0 0%,#4254A5 60%,#334281 100%);
    color:#fff;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;padding:6px;
    text-align:left;position:sticky;top:0;z-index:2;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  table.t th.c,table.t td.c{text-align:center}
  table.t th.r,table.t td.r{text-align:right}
  table.t td{padding:4px 6px;border-bottom:1px solid #e6e8eb;vertical-align:middle}
  table.t tbody tr:hover td{background:#f7fbff}
  table.t tr.corte td{border-top:2px solid #cbd5e1}
  /* Filas de una sola línea: el texto que no entra se corta con puntos
     suspensivos y se lee completo al abrir la fila. */
  table.t td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
  table.t td.desc{max-width:380px}
  table.t tbody tr{height:26px}
  /* la vista de alertas lleva campos editables: ahí no se recorta */
  #boxAle table.t td{overflow:visible;max-width:none;white-space:normal}
  /* ── DASHBOARD ── */
  .dfiltros{display:flex;gap:10px;align-items:center;margin:2px 0 10px;flex-wrap:wrap}
  .dfiltros select{border:1px solid var(--line);border-radius:9px;height:34px;padding:0 12px;font-size:12.5px;background:#fff}
  .dnota{margin-left:auto;font-size:12px;color:var(--muted)}
  .drow{display:flex;gap:12px;align-items:stretch;margin-bottom:12px}
  .dcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .dcard.d1{flex:1.35}.dcard.d2{flex:0 0 auto}.dcard.d3{flex:1}.dcard.d4{flex:1}.dcard.d5{flex:0 0 auto}
  @media(max-width:1200px){.drow{flex-wrap:wrap}.dcard.d1,.dcard.d3,.dcard.d4{flex:1 1 100%}}
  .d1in{display:flex;gap:14px;align-items:center;flex:1}
  .dpila{display:flex;flex-direction:column;gap:8px;flex:1;justify-content:center}
  .d1in .dpila{min-width:280px}
  .dtile.h{display:flex;align-items:center;gap:10px;padding:8px 12px}
  .dtile.h .tx{flex:1;min-width:0}
  .dtile.h .l{font-size:12px}
  .dtile.h .s{white-space:nowrap}
  .dtile.h .v{font-size:26px;margin:0 0 0 10px;min-width:38px;text-align:right}
  .dtile.h .dico{width:22px;height:22px;font-size:12px;flex:0 0 auto}
  .dcard.d5 .dpila{flex:0 0 auto;justify-content:flex-start}
  .dbaja{text-align:center;color:#b5bcc4;font-size:14px;line-height:1;margin:-4px 0}
  .danillo .meta{font-size:11.5px;color:#98a2ad;margin-top:2px}
  .dbnd{display:flex;align-items:center;gap:8px;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px;letter-spacing:.03em;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
  .dbnd .n{background:rgba(255,255,255,.25);border-radius:999px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
  .dbnd.azul{background:linear-gradient(180deg,#7B87C0 0%,#4254A5 48%,#334281 100%)}
  .dbnd.verde{background:linear-gradient(180deg,#55BF5D 0%,#0CA318 48%,#097F13 100%)}
  .dbnd.amarillo{background:linear-gradient(180deg,#FFDC58 0%,#FFCD11 48%,#C7A00D 100%);color:#3B2E00;text-shadow:none}
  .dbnd.rojo{background:linear-gradient(180deg,#E05A5F 0%,#D3141A 48%,#A51014 100%)}
  .dbnd.plomo{background:linear-gradient(180deg,#ADADAD 0%,#8A8A8A 48%,#6C6C6C 100%)}
  .dpreg{font-size:12.5px;color:var(--muted);margin-top:-4px}
  .dfila{display:flex;gap:10px;flex-wrap:wrap}.dfila.col{flex-direction:column}
  .dtile{flex:1;min-width:110px;border-radius:12px;padding:9px 11px;background:#F7F8FA;border:1px solid var(--line)}
  .dtile .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:5px}
  .dtile .v{font-size:30px;font-weight:800;line-height:1.1;margin-top:3px;color:#1F3864}
  .dtile .s{font-size:11px;color:var(--muted)}
  .dtile.ok{background:#DCF5E3;border-color:#b8e7c6}.dtile.ok .v{color:#0F7A33}
  .dtile.warn{background:#FFF6D6;border-color:#EFDC94}.dtile.warn .v{color:#8A6A00}
  .dtile.bad{background:#FDE4E4;border-color:#F5BDBD}.dtile.bad .v{color:#B91C1C}
  .dico{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:800}
  .dico.ok{background:#16A34A}.dico.warn{background:#E0B000}.dico.bad{background:#DC2626}
  .danillo{display:flex;align-items:center;gap:16px}.danillo .txt{font-size:13px;color:#444;line-height:1.5}.danillo .txt b{font-size:15px}
  .dfr{display:grid;grid-template-columns:80px 1fr 70px;gap:8px;align-items:center;font-size:12.5px}
  .dfr .bar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:#eef1f4;gap:2px}
  .dfr .bar i{display:block;height:100%}
  .dfr .t{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  .dley{display:flex;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .dley span{display:inline-flex;align-items:center;gap:5px}.dley i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .dflujo{display:flex;align-items:stretch}
  .dpaso{flex:1;text-align:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line)}
  .dpaso .v{font-size:30px;font-weight:800;line-height:1.1}.dpaso .l{font-size:12px;font-weight:700;color:#444}.dpaso .s{font-size:11px;color:var(--muted)}
  .dpaso.bad{background:#FDE4E4;border-color:#F5BDBD}.dpaso.bad .v{color:#B91C1C}
  .dpaso.warn{background:#FFF6D6;border-color:#EFDC94}.dpaso.warn .v{color:#8A6A00}
  .dpaso.ok{background:#DCF5E3;border-color:#b8e7c6}.dpaso.ok .v{color:#0F7A33}
  .dflecha{display:flex;align-items:center;color:#b5bcc4;font-size:22px;padding:0 6px}
  #dTip{position:fixed;pointer-events:none;background:#1c232b;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;display:none;z-index:99}
  .ale-prec{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:0 0 8px}
  .ale-prec b{color:var(--ink)}
  table.of tr.mesrow td{background:#EEF1F8;color:#1F3864;font-weight:700;font-size:11.5px;padding:4px 8px;border-top:2px solid #cbd5e1;position:static}
  #boxAle table.t td.desc{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .dim{color:var(--muted)}
  .std{color:#2E75B6;font-style:normal;font-size:10px}
  .clave{color:#1F3864;font-weight:700;font-size:10.5px;letter-spacing:-.2px}
  .warn{color:#B45309;font-size:10px}
  .pend{color:#98a2ad;font-size:10.5px}
  .pill{border-radius:999px;padding:1px 9px;font-size:10px;font-weight:800;display:inline-block}
  .badgeB{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:700}
  .badgeB.st-ok{background:#DDF2DF;color:#0C7A16}
  .badgeB.st-mid{background:#FFF8DE;color:#9E7F0B}
  .badgeB.st-low{background:#EFEFEF;color:#6C6C6C}
  .e-NORMAL{background:#dcfce7;color:#15803d}
  .e-PRECAUCION{background:#fef3c7;color:#B45309}
  .e-CRITICO{background:#fee2e2;color:#b91c1c}
  .e-NA{background:#eef0f2;color:#6b747d}
  .b-bad{color:#dc2626;font-weight:800}.b-mid{color:#B45309;font-weight:700}
  .spin{width:13px;height:13px;border:2px solid #d8dde2;border-top-color:#4254A5;border-radius:50%;animation:girar .7s linear infinite;flex:0 0 auto}
  .rescard{border-radius:10px;padding:10px 12px;text-align:center}
  .rescard .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:inherit;opacity:.85}
  .rescard .v{font-size:15px;font-weight:800;margin-top:4px}
  .rescard.verde{background:#DDF2DF;color:#0C7A16}
  .rescard.ambar{background:#FFF8DE;color:#8A6300}
  .rescard.rojo{background:#F9DEDF;color:#D3141A}
  .rescard.gris{background:#EFEFEF;color:#6C6C6C}
  @keyframes girar{to{transform:rotate(360deg)}}
  .mini{border:none;background:#eef0f2;border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px}
  .vacio{padding:44px;text-align:center;color:#98a2ad}
  .hint{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.5}
  input.ed{width:100%;border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:11.5px}
  input.ed.lg{min-width:150px}
  select.ed{border:1px solid var(--line);border-radius:5px;padding:3px 4px;font-size:11px}
  .ed.ok{border-color:#15803d;background:#f0fdf4}
  .modal{position:fixed;inset:0;background:rgba(15,20,26,.55);z-index:99;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto}
  .mc{background:#fff;border-radius:12px;width:min(940px,98vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .mh h3{font-size:15px;color:#1f3864}
  .mh .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .mb{padding:12px 16px 18px;max-height:74vh;overflow:auto}
  .campo{margin-bottom:12px}
  .mb .campo div{white-space:normal}
  .campo b{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .an{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px}
  .an>div{background:#f6f8fa;border-radius:8px;padding:6px 9px;font-size:11.5px;display:flex;justify-content:space-between;gap:8px}
  .an span{color:var(--muted)}.an b{color:#1F3864}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .form label{font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .form label.full{grid-column:1/-1}
  .eqnew{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .eqnew input,.eqnew select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;flex:1;min-width:120px}
  .form input,.form select{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:400;color:var(--ink)}
  .form input[readonly]{background:#f5f6f8;color:#6b747d}

  /* ── ESTILO OFICIAL GLLR: encabezado de 2 filas (banda + columna pastel) ── */
  table.of{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff;table-layout:fixed}
  table.of thead{position:sticky;top:0;z-index:6;background:#fff}
  table.of tr.bands th{background:#fff;padding:3px 3px 4px;border:none;border-bottom:1px solid var(--line);text-align:center}
  table.of .bnd{display:block;border-radius:7px;padding:4px 8px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
  table.of .bnd.azul{background:linear-gradient(180deg,#7B87C0 0%,#4254A5 48%,#334281 100%);border:1px solid #293466;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  table.of .bnd.amarillo{background:linear-gradient(180deg,#FFDC58 0%,#FFCD11 48%,#C7A00D 100%);border:1px solid #9E7F0B;color:#3B2E00;text-shadow:none}
  table.of .bnd.verde{background:linear-gradient(180deg,#55BF5D 0%,#0CA318 48%,#097F13 100%);border:1px solid #07650F;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  table.of .bnd.plomo{background:linear-gradient(180deg,#ADADAD 0%,#8A8A8A 48%,#6C6C6C 100%);border:1px solid #565656;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  /* mismos chips, sueltos (fuera de una tabla, ej. títulos de sección en la Ficha SOS) */
  .bnd.azul,.bnd.amarillo,.bnd.verde,.bnd.plomo,.bnd.rojo{border-radius:7px;font-weight:700;letter-spacing:.02em}
  .bnd.azul{background:linear-gradient(180deg,#7B87C0 0%,#4254A5 48%,#334281 100%);border:1px solid #293466;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .bnd.amarillo{background:linear-gradient(180deg,#FFDC58 0%,#FFCD11 48%,#C7A00D 100%);border:1px solid #9E7F0B;color:#3B2E00;text-shadow:none}
  .bnd.verde{background:linear-gradient(180deg,#55BF5D 0%,#0CA318 48%,#097F13 100%);border:1px solid #07650F;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .bnd.plomo{background:linear-gradient(180deg,#ADADAD 0%,#8A8A8A 48%,#6C6C6C 100%);border:1px solid #565656;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .bnd.rojo{background:linear-gradient(180deg,#E05A5F 0%,#D3141A 48%,#A51014 100%);border:1px solid #830C10;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  table.of tr.cols th{padding:3px 6px;text-align:left;font-weight:600;font-size:10px;line-height:1.15;border-right:1px solid #fff;border-bottom:1px solid #fff}
  table.of tr.cols th.c{text-align:center}
  table.of th.azul{background:#E5E7F2;color:#4254A5}
  table.of th.amarillo{background:#FFF8DE;color:#9E7F0B}
  table.of th.verde{background:#DDF2DF;color:#0C7A16}
  table.of th.plomo{background:#EFEFEF;color:#6C6C6C}
  table.of td{padding:2px 6px;border-bottom:1px solid #e6e8eb;border-right:1px solid #eef0f2;line-height:1.2;vertical-align:middle;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.of td.c{text-align:center}table.of td.r{text-align:right}
  table.of tbody tr:hover td{background:#f7fbff}
  table.of .frz{position:sticky;left:0;background:#fff;z-index:2}
  table.of tr.bands .frz{background:#fff;z-index:5}
  table.of tr.cols th.frz{z-index:5}
  table.of tbody tr:hover td.frz{background:#f7fbff}
  table.of .frz1{left:0}
  table.of .frz2{left:30px}
  table.of .frz3{left:58px}

<script>
const CFG=(()=>{try{return JSON.parse(localStorage.getItem('gllr_sbcfg')||'null')}catch(_){return null}})();
if(!CFG||!CFG.url){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif">'
   +'<h2 style="font-size:18px;margin-bottom:10px">Abre primero la p&aacute;gina principal</h2>'
   +'<p style="color:#6b747d">Esta pesta&ntilde;a toma la conexi&oacute;n y la sesi&oacute;n desde el Maestro de Equipos.</p></div>';
  throw new Error('sin configuracion');
}
if(!window.supabase){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:-apple-system,sans-serif">'
    +'<h2 style="font-size:18px;margin-bottom:10px">No se pudo cargar un componente necesario</h2>'
    +'<p style="color:#6b747d;max-width:420px;margin:0 auto 16px">Revisa tu conexión a internet e inténtalo de nuevo. '
    +'Si el problema sigue, puede ser un corte temporal de un servicio externo — prueba en unos minutos.</p>'
    +'<button onclick="location.reload()" style="background:#FFCD11;border:none;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer">Reintentar</button></div>';
  throw new Error('window.supabase no disponible');
}
const sb=window.supabase.createClient(CFG.url,CFG.key);
function hoy0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function dias(a,b){return Math.round((a-b)/86400000);}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/86400000+1)/7);}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function fmtDate(v){if(!v)return"";const p=String(v).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:String(v);}
function famNum(e){const m=String(e.familia||'').match(/\d+/);return m?+m[0]:99;}
function roundToFreq(V,F){
  V=Number(V)||0; F=Number(F)||0;
  if(F<=0)return Math.round(V);
  const L=Math.floor(V/F)*F, U=L+F, band=F*0.2;
  if((V-L)<band)return L;
  if((U-V)<=band)return U;
  const idx=Math.floor((V-L)/band+0.5);
  return L+idx*band;
}
function mant(e){
  if(e.__mant)return e.__mant;              // caché: se recalcula solo al editar el equipo
  const H=hoy0(),freq=+e.frecuencia||0,pmr=roundToFreq(+e.hrkm_ult_mntto||0,freq),act=+e.hrkm_actual||0,hd=+e.hr_dia||0;
  let proy=act; if(e.fecha_lectura){const dd=Math.max(0,dias(H,new Date(e.fecha_lectura)));proy=act+dd*hd;}
  const proximo=freq?(pmr+freq):0; const restante=proximo-proy;
  let est="na";const margen=Math.max(freq*0.15,25);
  if(freq)est=restante<=0?"bad":(restante<=margen?"warn":"ok");
  let fprox="",sem="",fproxDate=null;
  if(hd>0&&freq){const dd=Math.floor(restante/hd)+1;fproxDate=new Date(H.getTime()+dd*86400000);fprox=fmtDate(fproxDate.toISOString().slice(0,10));sem=isoWeek(fproxDate);}
  return (e.__mant={proy:Math.round(proy),proximo:Math.round(proximo),restante:Math.round(restante),est,fprox,sem,fproxDate});
}



/* ═══════════════════ SOS · MUESTREO DE ACEITES ═══════════════════ */
let datos=[], DIDX=new Map(), perfil=null;
let MUESTRAS=[], RES=[], ALE=[], EQE=new Map(), EQS=new Map(), EQLE=[], EQLS=[];
/* ═══════════════ IA (vía Edge Function de Supabase, la clave nunca viaja al navegador) ═══════════════ */
async function llamarIA(prompt){
  const resp=await fetch(`${CFG.url}/functions/v1/analizar-ia`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.key,'apikey':CFG.key},
    body:JSON.stringify({prompt})
  });
  const data=await resp.json().catch(()=>({}));
  if(!resp.ok||data.error)throw new Error(data.error||'No se pudo contactar al servicio de IA.');
  return data.texto||'';
}
function modalIA(titulo,generar){
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="mia"><div class="mc" style="width:min(640px,94vw)">
    <div class="mh"><h3>${esc(titulo)}</h3><div class="spacer"></div><button class="act" id="miaCer">Cerrar</button></div>
    <div class="mb" id="miaBody" style="font-size:13.5px;line-height:1.65">
      <div style="display:flex;align-items:center;gap:8px;color:#6b747d"><span class="spin"></span> Consultando a la IA…</div>
    </div>
  </div></div>`);
  const cerrar=()=>{const m=document.getElementById('mia');if(m)m.remove();};
  document.getElementById('miaCer').onclick=cerrar;
  document.getElementById('mia').addEventListener('click',ev=>{if(ev.target.id==='mia')cerrar();});
  generar().then(texto=>{
    const b=document.getElementById('miaBody'); if(b)b.innerHTML=esc(texto).replace(/\n/g,'<br>');
  }).catch(err=>{
    const b=document.getElementById('miaBody'); if(b)b.innerHTML=`<span class="b-bad">No se pudo obtener el análisis: ${esc(err.message)}</span>`;
  });
}
let LIMITES=[]; // {id,grupo,parametro,limite,orden}
function limiteDe(parametro){ const l=LIMITES.find(x=>x.parametro===parametro); return l?l.limite:null; }
let SIST=[], EQT=new Map(), EQLT=[], FRASCOS=[], ALTITUD=new Map();
const FAMILIAS_SIN_SOS=['4_IMPL. EQ.','6_VEH T/PER','7_EQ PLANTA'];
const RANGO_PM=[['PM4',8],['PM3',4],['PM2',2],['PM1',1]]; // de mayor a menor
function nivelPM(proximoHr,freq){
  if(!freq)return null;
  for(const[nombre,mult]of RANGO_PM){ if(proximoHr%(freq*mult)===0)return nombre; }
  return 'PM1';
}
function rangoIncluye(pmEvento,pmSistema){ // PM4 incluye PM3,PM2,PM1; etc. (acumulativo)
  const val={PM1:1,PM2:2,PM3:4,PM4:8};
  return (val[pmSistema]||99)<=(val[pmEvento]||0);
}
function tipoDe(e){ return EQT.get(nrm(e.equipo))||null; }
function esDesmovM(e){ return /^DESMOVILIZ/.test(nrm(e.status)); }
/* Solo llevan SOS: 1_EQ PESADO, 2_VEH PESADO y 3_EQ IZAJE (camiones). Dentro de ellos NO llevan:
   camionetas/camiones doble cabina, camión lubricador, torres de iluminación ni grupos electrógenos. */
const FAM_CON_SOS=[1,2,3];
const SIN_SOS_EQUIPO=/DOBLE\s*CABINA|\bD\/C\b|LUBRICADOR|TORRE|LUMINARIA|ILUMINACION|GRUPO\s*ELECTROGENO|GENERADOR/;
function sinSOS(e){
  const m=String(e&&e.familia||'').match(/^\s*(\d+)/);
  if(!m||!FAM_CON_SOS.includes(+m[1]))return true;
  return SIN_SOS_EQUIPO.test(nrm(e.equipo));
}
async function altitudDe(proy){
  if(!proy)return null;
  if(ALTITUD.has(nrm(proy)))return ALTITUD.get(nrm(proy));
  const v=prompt(`No tengo la altitud registrada para "${proy}".\n¿A qué altitud (m.s.n.m.) trabaja este proyecto? (déjalo en blanco para omitir)`);
  const n=v==null?null:Math.round(+v);
  if(!n||!isFinite(n)||n<=0)return null;
  const {error}=await sb.from('sos_altitud_obra').insert({proyecto:proy,altitud:n});
  if(!error)ALTITUD.set(nrm(proy),n);
  return n;
}
function sugerirPlanilla(proy,nuevo){
  if(!proy)return '';
  const anio=new Date().getFullYear(), pref=anio+'-';
  const nums=MUESTRAS.filter(p=>p.obra===proy&&String(p.nro_planilla||'').startsWith(pref))
    .map(p=>parseInt(String(p.nro_planilla).slice(pref.length),10)).filter(n=>!isNaN(n));
  const ultimo=nums.length?Math.max(...nums):0;
  return pref+String(nuevo?ultimo+1:(ultimo||1)).padStart(3,'0');
}
let vista='plan';

const nrm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const f0=n=>Number(n).toLocaleString('es-PE',{maximumFractionDigits:0});
const f1=n=>Number(n).toLocaleString('es-PE',{maximumFractionDigits:1});
const getE=id=>DIDX.get(String(id))||null;
const isoDe=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};

/* ---------- uniformar estado y sistema ---------- */
function estadoStd(txt){
  const k=nrm(txt); if(!k)return null;
  if(EQE.has(k))return EQE.get(k);
  if(/CRITIC|ACCION REQUERIDA|OBSERVACION/.test(k))return 'CRITICO';
  if(/PRECAU|ALERTA|MONITOREAR/.test(k))return 'PRECAUCION';
  if(/NORMAL|NO SE REQUIERE/.test(k))return 'NORMAL';
  return null;                       // desconocido: se avisa para agregarlo
}
function sistemaStd(txt){
  const k=nrm(txt); if(!k)return null;
  return EQS.get(k)||null;
}

/* Clave única de una muestra: EQUIPO_SISTEMA_FECHA
   ejemplo: ECV109_MOTOR_02.24.26
   El sistema va completo (ya no se recorta) y la fecha va MM.DD.AA.
   Sirve para enlazar el resultado del laboratorio con su fila de la planilla. */
function claveMuestra(sap,sistema,fecha){
  if(!sap||!fecha)return null;
  // antes se recortaba a 5 caracteres, pero varios sistemas comparten el mismo inicio
  // (ej. "MANDO FINAL RH" y "MANDO FINAL LH"), lo que enlazaba el resultado equivocado.
  // ahora se usa el nombre completo, sin recortar.
  const s=nrm(sistema||'').replace(/[^A-Z0-9]/g,'')||'XXXXX';
  const [a,m,d]=String(fecha).slice(0,10).split('-');
  if(!a||!m||!d)return null;
  return `${nrm(sap)}_${s}_${m}.${d}.${a.slice(2)}`;
}
/* ---------- fechas y números tolerantes ---------- */
function aFecha(v){
  if(v instanceof Date&&!isNaN(v))return isoDe(v);
  // Excel a veces entrega la fecha como número de serie (días desde 1899-12-30).
  // Sin este caso, "45942" se leía como el año 45942.
  const n=Number(v);
  if(isFinite(n)&&n>20000&&n<80000&&String(v).trim().length<=7)
    return new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10);
  const s=String(v??'').trim(); if(!s||s==='-')return null;
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return s.slice(0,10);
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})/);
  if(m){let a=+m[3]; if(a<100)a+=2000;
    return `${a}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}
  const d=new Date(s);
  if(isNaN(d))return null;
  const y=d.getFullYear();
  return (y<1990||y>2100)?null:isoDe(d);      // descarta años imposibles
}
function aNum(v){
  if(v==null||v==='')return null;
  const n=Number(String(v).replace(/[^0-9.,-]/g,'').replace(',','.'));
  return isFinite(n)?n:null;
}

/* ---------- lectura de un Excel: ubica el encabezado ---------- */
function leerHoja(filas,claves){
  for(let i=0;i<Math.min(14,filas.length);i++){
    const f=(filas[i]||[]).map(nrm);
    const hay=claves.filter(k=>f.some(c=>c===nrm(k))).length;
    if(hay>=Math.min(3,claves.length)){
      const cols={}; (filas[i]||[]).forEach((c,j)=>{const k=nrm(c); if(k&&!(k in cols))cols[k]=j;});
      return {fila:i,cols};
    }
  }
  return null;
}
const val=(f,cols,...nombres)=>{
  for(const n of nombres){const j=cols[nrm(n)]; if(j!==undefined&&f[j]!==''&&f[j]!=null)return f[j];}
  return null;
};

  'Sistema','Tipo de Aceite','Horometro','Muestreo','Envio'];
function leerPlanilla(filas){
  const m=leerHoja(filas,['N° Frasco','Sistema','Obra','Horometro','Item'])
        ||leerHoja(filas,['Marca','Modelo','Serie','Sistema']);
  if(!m)return null;
  const out=[];
  for(let i=m.fila+1;i<filas.length;i++){
    const f=filas[i]||[];
    const sap=String(val(f,m.cols,'Código SAP\ndel Equipo','Código SAP del Equipo','Código del Equipo','Codigo del Equipo','Código\ndel Equipo','EQUIPO','CODIGO')??'').trim();
    const sis=String(val(f,m.cols,'Sistema')??'').trim();
    if(!sap&&!sis)continue;
    const e=datos.find(x=>nrm(x.cod_sap)===nrm(sap));
    // el Tipo (Cambio/Muestra) puede compartir el mismo título "TIPO" que la columna de Tipo de aceite en algunos
    // formatos (dos columnas distintas, mismo nombre) — por eso, si el rótulo específico no aparece, se busca
    // directamente el texto "CAMBIO" o "MUESTRA" en cualquier celda de la fila, que no se confunde con un producto
    let tipoCambio=String(val(f,m.cols,'Tipo:\n[Cambio]\n[Muestra]')??'').trim();
    if(!tipoCambio){
      for(const v of f){ const t=nrm(v); if(t==='CAMBIO'){tipoCambio='Cambio';break;} if(t==='MUESTRA'){tipoCambio='Muestra';break;} }
    }

      nro_planilla:String(val(f,m.cols,'N° de Planilla','Nro de Planilla')??'').trim()||null,

      modelo:String(val(f,m.cols,'Modelo')??'').trim()||(e?e.modelo:null),
      serie:String(val(f,m.cols,'Serie')??'').trim()||(e?e.serie_placa:null),

      tipo_aceite:String(val(f,m.cols,'Tipo de Aceite','TIPO')??'').trim()||null,
      galones:aNum(val(f,m.cols,'Cnt.\n(Galones)','Cnt. (Galones)','Galones','CANT. GLNS.')),
      horometro:aNum(val(f,m.cols,'Horometro','Horómetro')),
      horas_aceite:aNum(val(f,m.cols,'Horas\ndel aceite','Horas del aceite','HORAS')),
      cant_agregado:aNum(val(f,m.cols,'Cant.\nAgregado','Cant. Agregado','CANT.'))??0,
      f_muestreo:aFecha(val(f,m.cols,'Fecha\nMuestreo','Muestreo','FECHA')),
      f_envio:aFecha(val(f,m.cols,'Fecha\nEnvio','Fecha\nEnvío','Envio','Envío')),
      tipo:tipoCambio||null,
      observacion:String(val(f,m.cols,'Observacion:','Observación','OBSERVACIONES:')??'').trim()||null
    });
  }
  const anio2026='2026-01-01';
  out.forEach(r=>{
    if(!r.observacion&&r.obra&&r.f_muestreo&&r.f_muestreo>=anio2026&&ALTITUD.has(nrm(r.obra))){
      r.observacion=`Trabaja a: ${ALTITUD.get(nrm(r.obra))} m.s.n.m.`;
    }
  });
  return out;
}

function leerResultados(filas,fuente){
  const m=leerHoja(filas,['N° MUESTRA','EQUIPO','COMPONENTE','FECHA','ESTADO'])
        ||leerHoja(filas,['No. de control de laboratorio','ID de equipo','Compartimento','Estado'])
        ||leerHoja(filas,['Nro de Muestra','Equipo','Compartimiento','CONDICIÓN SOS']);
  if(!m)return null;
  const out=[]; const filasConError=[];
  for(let i=m.fila+1;i<filas.length;i++){
    try{
      const f=filas[i]||[];
      const nro=String(val(f,m.cols,'N° MUESTRA','Nro Muestra','N MUESTRA','No. de control de laboratorio','Nro de Muestra')??'').trim();
      if(!nro)continue;
      // el código SAP limpio, si el formato lo trae aparte (Ferreyros/MARCO nativo);
      // si no, se toma de la celda "Equipo" — en MARCO nativo esa celda viene unida
      // ("ECV148 - # G540B8x4 (serie...)"), así que se toma solo lo que está antes del " - "
      let sap=String(val(f,m.cols,'Código-Equipo','ID de equipo')??'').trim();
      if(!sap){
        const equipoTxt=String(val(f,m.cols,'EQUIPO','Equipo')??'').trim();
        sap=equipoTxt.split(/\s+-\s+/)[0].trim();
      }
      const serieEq=String(val(f,m.cols,'No. de serie del equipo')??'').trim();
      const comp=String(val(f,m.cols,'COMPONENTE','Compartimento','Compartimiento')??'').trim();
      const est=String(val(f,m.cols,'ESTADO','CONDICIÓN SOS')??'').trim();
      // primero por Cód. SAP; si no calza (algunos formatos traen su propio código de equipo),
      // se cruza por el N° de serie del equipo, que es único
      let e=datos.find(x=>nrm(x.cod_sap)===nrm(sap));
      if(!e&&serieEq)e=datos.find(x=>x.serie_placa&&nrm(x.serie_placa)===nrm(serieEq));
      const an={};
      ANALISIS.forEach(k=>{
        const v=val(f,m.cols,k,...(ANALISIS_ALIAS[k]||[]));
        const n=aNum(v);
        if(n!=null)an[k]=n; else if(v!=null&&String(v).trim()&&String(v).trim()!=='-')an[k]=String(v).trim();
      });
      const fmuestreo=aFecha(val(f,m.cols,'FECHA','Fecha de muestreo','Fecha de Toma de Muestra'));
      const horom=aNum(val(f,m.cols,'HORAS','Horometro','Horómetro','Hrs equipo','Horas','Horometro actual'));
      // -- candidato para crear la fila de Planilla, si el resultado no logra enlazarse a una ya existente --
      let tipoAceite=String(val(f,m.cols,'Aceite lubricante','Producto Usado')??'').trim();
      if(!tipoAceite){
        const marca=String(val(f,m.cols,'Fluid Brand')??'').trim();
        const peso=String(val(f,m.cols,'Fluid Weight')??'').trim();
        tipoAceite=[marca,peso].filter(x=>x&&x!=='.').join(' ').trim();
      }
      let tipoCambio=null;
      const fluidoCambiado=String(val(f,m.cols,'Fluido Cambiado')??'').trim();
      const accion=String(val(f,m.cols,'Accion a tomar')??'').trim();
      if(fluidoCambiado)tipoCambio=/^[SY]/i.test(fluidoCambiado)?'Cambio':'Muestra';
      else if(/CAMBIO/i.test(accion))tipoCambio='Cambio';
      else if(/MUESTRA/i.test(accion))tipoCambio='Muestra';
      // observación del laboratorio: se juntan TODOS los campos de texto que traiga esa hoja
      // (Interpretación, Comentarios, Recomendaciones, Observación del reporte), cada uno con su etiqueta
      const camposObs=[['Interpretacion','Interpretación'],['Comentarios','Comentarios'],['Recomendaciones','Recomendaciones'],['Observación del reporte','Observación']];
      const partesObs=[];
      camposObs.forEach(([col,etq])=>{
        const v=String(val(f,m.cols,col)??'').trim();
        if(v)partesObs.push(`${etq}: ${v}`);
      });
      const obsLab=partesObs.length?partesObs.join('\n\n'):null;
      const candidato={
        obra:e?e.cod_proyec:null,
        marca:e?e.marca:null, modelo:e?e.modelo:null, serie:e?e.serie_placa:null,
        sistema:comp||null, tipo_aceite:tipoAceite||null,
        galones:aNum(val(f,m.cols,'Volumen relleno')),
        horometro:horom, horas_aceite:aNum(val(f,m.cols,'Hrs aceite','Horas del Aceite','Estimacion de horas del fluido')),
        cant_agregado:aNum(val(f,m.cols,'Agregar en Galones'))??0,
        f_muestreo:fmuestreo,
        f_envio:aFecha(val(f,m.cols,'Fecha de reporte','Fecha de laboratorio','Fecha de recibo de la muestra','Fecha del reporte')),
        tipo:tipoCambio
      };
      out.push({
        fuente, nro_muestra:nro,
        cod_frasco:String(val(f,m.cols,'CÓDIGO FRASCO (si aplica)','No. de Etiqueta','Codigo Frasco')??'').trim()||null,
        cod_sap:e?e.cod_sap:(sap||null), maestro_id:e?e.id:null,
        obra:String(val(f,m.cols,'OBRA','Nombre del Cliente','Cuenta')??'').trim()||(e?e.cod_proyec:null),
        componente:comp||null, sistema_std:sistemaStd(comp),
        fecha:fmuestreo,
        horometro:horom,
        estado:est||null, estado_std:estadoStd(est),
        observacion:obsLab,
        link_pdf:String(val(f,m.cols,'Link al reporte PDF (OneDrive)','Link PDF')??'').trim()||null,
        analisis:Object.keys(an).length?an:null,
        candidato
      });
    }catch(err){
      filasConError.push({fila:i+1,msg:err.message});
    }
  }
  if(filasConError.length){
    console.warn('Filas con error al leer el archivo de laboratorio:',filasConError);
    alert(`${filasConError.length} fila(s) del archivo no se pudieron leer y se omitieron:\n`
      +filasConError.slice(0,6).map(x=>`· fila ${x.fila}: ${x.msg}`).join('\n')
      +(filasConError.length>6?`\n… y ${filasConError.length-6} más.`:'')
      +'\n\nEl resto del archivo se sigue procesando normalmente.');
  }
  return out;
}
/* Enlaza cada resultado con su fila de la planilla */
function enlazarPlanilla(r){
  // 1) por clave EQUIPO_SISTEMA_FECHA
  const k=claveMuestra(r.cod_sap,r.sistema_std||r.componente,r.fecha);
  if(k){
    // si varias filas comparten la clave, se prefiere la que todavía no tiene resultado
    const ps=MUESTRAS.filter(x=>claveMuestra(x.cod_sap,x.sistema_std||x.sistema,x.f_muestreo)===k);
    const p=ps.find(x=>!x.fuente&&!x.estado_std)||ps[0];
    if(p)return p;
  }
  if(r.cod_frasco){
    const p=MUESTRAS.find(x=>x.nro_frasco&&nrm(x.nro_frasco)===nrm(r.cod_frasco));
    if(p)return p;
  }
  // sin frasco: mismo equipo, mismo sistema y la fecha de muestreo más cercana
  const cand=MUESTRAS.filter(x=>nrm(x.cod_sap)===nrm(r.cod_sap)
    && (!r.sistema_std||!x.sistema_std||x.sistema_std===r.sistema_std));
  if(!cand.length)return null;
  if(!r.fecha)return cand[0];
  const t=new Date(r.fecha+'T00:00:00').getTime();
  let mejor=null,dmin=Infinity;
  cand.forEach(x=>{
    if(!x.f_muestreo)return;
    const d=Math.abs(new Date(x.f_muestreo+'T00:00:00').getTime()-t)/86400000;
    if(d<dmin){dmin=d;mejor=x;}
  });
  return dmin<=45?mejor:null;      // más de mes y medio de diferencia: no se asume
}

const EDITADO=new Map(); // "periodo|proyecto" -> cantidad editada manualmente (sesión)
function calcularNecesidad(periodo){
  const [Y,M]=periodo.split('-').map(Number);
  const porProyecto=new Map(); // proyecto -> {sugerido, detalle:[]}
  const sinTipo=new Set(), sinSistemas=new Set();
  datos.forEach(e=>{
    if(esDesmovM(e)||sinSOS(e))return;
    const freq=+e.frecuencia||0; if(!freq)return;
    const c=mant(e); if(!c.fproxDate)return;
    if(c.fproxDate.getFullYear()!==Y||(c.fproxDate.getMonth()+1)!==M)return;
    const proxLimpio=Math.round(c.proximo/freq)*freq;
    const pmEvento=nivelPM(proxLimpio,freq);
    const tipo=tipoDe(e);
    let sistemas=tipo?SIST.filter(s=>nrm(s.tipo_equipo)===nrm(tipo)&&rangoIncluye(pmEvento,s.pm)):[];
    if(!tipo)sinTipo.add(e.equipo||e.cod_sap);
    else if(!sistemas.length)sinSistemas.add(tipo);
    const nFrascos=sistemas.length||1;
    const proy=e.cod_proyec||'(sin proyecto)';
    if(!porProyecto.has(proy))porProyecto.set(proy,{sugerido:0,detalle:[]});
    const reg=porProyecto.get(proy);
    reg.sugerido+=nFrascos;
    reg.detalle.push({equipo:e.equipo,cod_sap:e.cod_sap,pm:pmEvento,
      sistemas:sistemas.length?sistemas.map(s=>s.sistema):['(sin tabla — 1 por defecto)'],frascos:nFrascos});
  });
  return {porProyecto,sinTipo:[...sinTipo],sinSistemas:[...sinSistemas]};
}
function nombreMes(periodo){
  const [Y,M]=periodo.split('-').map(Number);
  return new Date(Y,M-1,1).toLocaleDateString('es-PE',{month:'long',year:'numeric'});
}

async function despacharProyecto(proy,periodo){
  const key=periodo+'|'+proy;
  const n=EDITADO.has(key)?EDITADO.get(key):(calcularNecesidad(periodo).porProyecto.get(proy)||{sugerido:0}).sugerido;
  if(!n||n<=0)return alert('La cantidad a enviar debe ser mayor a 0.');
  const libres=FRASCOS.filter(f=>f.estado==='Disponible').sort((a,b)=>a.codigo.localeCompare(b.codigo)).slice(0,n);
  if(libres.length<n)return alert(`Solo hay ${libres.length} frasco(s) disponible(s) en stock; necesitas ${n}. Agrega más frascos o reduce la cantidad.`);
  if(!confirm(`¿Despachar ${n} frasco(s) (${libres[0].codigo} … ${libres[libres.length-1].codigo}) a ${proy}?`))return;
  const antes=libres.map(f=>({...f}));
  const hoy=isoDe(new Date());
  const {error}=await sb.from('sos_frascos').update({estado:'Enviado',proyecto_actual:proy,fecha_envio:hoy,fecha_regreso:null,updated_at:new Date().toISOString()})
    .in('id',libres.map(f=>f.id));
  if(error)return alert('No se pudo despachar: '+error.message);
  libres.forEach(f=>{f.estado='Enviado';f.proyecto_actual=proy;f.fecha_envio=hoy;});
  EDITADO.delete(key);
  marcarAccion('fra',{tipo:'lote',antes});
  pintarFra();
}
async function regresarFrasco(id){
  if(!confirm('¿Este frasco regresó sin usar? Vuelve a Disponible.'))return;
  const f=FRASCOS.find(x=>String(x.id)===String(id)); if(!f)return;
  const antes={...f};
  const {error}=await sb.from('sos_frascos').update({estado:'Disponible',proyecto_actual:null,fecha_regreso:isoDe(new Date()),updated_at:new Date().toISOString()}).eq('id',id);
  if(error)return alert('No se pudo actualizar: '+error.message);
  f.estado='Disponible';f.proyecto_actual=null;
  marcarAccion('fra',{tipo:'campo',id,antes});
  pintarFra();
}
async function agregarFrascos(){
  const n=prompt('¿Cuántos frascos nuevos agregar al catálogo (correlativos)?','50');
  const cant=Math.round(+n||0); if(!cant||cant<=0)return;
  const usados=FRASCOS.map(f=>+f.codigo.replace(/\D/g,'')).filter(x=>isFinite(x));
  const desde=(usados.length?Math.max(...usados):0)+1;
  const nuevos=Array.from({length:cant},(_,i)=>({codigo:'F-'+String(desde+i).padStart(4,'0')}));
  const {data,error}=await sb.from('sos_frascos').insert(nuevos).select();

  FRASCOS=FRASCOS.concat(data||[]);

}

let ULTIMA={fra:null,plan:null,res:null,ale:null};
function marcarAccion(v,acc){ ULTIMA[v]=acc; if(vista===v)btnDeshacer.disabled=false; }
async function deshacer(){
  const acc=ULTIMA[vista]; if(!acc||btnDeshacer.disabled)return;
  btnDeshacer.disabled=true;
  const tabla=({plan:'sos_muestras',ale:'sos_alertas',fra:'sos_frascos'})[vista];
  const arr=({plan:()=>MUESTRAS,ale:()=>ALE,fra:()=>FRASCOS})[vista]();
  try{
    if(acc.tipo==='campo'||acc.tipo==='fila'){
      const limpio={...acc.antes}; delete limpio.id; delete limpio.created_at;
      const {data,error}=await sb.from(tabla).update(limpio).eq('id',acc.id).select().single();
      if(error)throw error;
      const i=arr.findIndex(x=>String(x.id)===String(acc.id)); if(i>-1)arr[i]=data; else arr.push(data);
    }else if(acc.tipo==='nueva'){
      const {error}=await sb.from(tabla).delete().eq('id',acc.id);
      if(error)throw error;
      const i=arr.findIndex(x=>String(x.id)===String(acc.id)); if(i>-1)arr.splice(i,1);
    }else if(acc.tipo==='eliminada'){
      const {data,error}=await sb.from(tabla).insert(acc.antes).select().single();
      if(error)throw error;
      arr.push(data);
    }else if(acc.tipo==='lote'){
      for(const prev of acc.antes){
        const limpio={...prev}; delete limpio.id;
        const {data,error}=await sb.from(tabla).update(limpio).eq('id',prev.id).select().single();
        if(error)throw error;
        const i=arr.findIndex(x=>String(x.id)===String(prev.id)); if(i>-1)arr[i]=data;
      }
    }else if(acc.tipo==='lote_nueva'){
      const {error}=await sb.from(tabla).delete().in('id',acc.ids);
      if(error)throw error;
      acc.ids.forEach(id=>{ const i=arr.findIndex(x=>String(x.id)===String(id)); if(i>-1)arr.splice(i,1); });
    }else if(acc.tipo==='lote_eliminada'){
      const {data,error}=await sb.from(tabla).insert(acc.antes).select();
      if(error)throw error;
      (data||[]).forEach(d=>arr.push(d));
    }
    ULTIMA[vista]=null; pintar();
  }catch(err){
    alert('No se pudo deshacer: '+err.message);
    ULTIMA[vista]=acc; btnDeshacer.disabled=false;
  }
}
document.addEventListener('keydown',ev=>{
  const t=ev.target, enCampo=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'&&!enCampo){ ev.preventDefault(); deshacer(); }
});

// -- edición en línea (doble clic) genérica, para campos simples sin dependencias cruzadas --
function editarCeldaG(cfg){
  const {td,tabla,vista,arrGetter,id,campo,tipo,opciones}=cfg;
  if(td.querySelector('input,select'))return;
  const d=arrGetter().find(x=>String(x.id)===String(id)); if(!d)return;
  const original=td.innerHTML;
  let editor;
  if(tipo==='select'){
    editor=document.createElement('select');
    (opciones||['']).forEach(o=>{const op=document.createElement('option'); op.value=o; op.textContent=o||'—'; if((d[campo]||'')===o)op.selected=true; editor.appendChild(op);});
  }else{
    editor=document.createElement('input');
    editor.type=tipo==='fecha'?'date':(tipo==='num'?'number':'text');
    if(tipo==='num')editor.step='any';
    editor.value=d[campo]??'';
  }
  editor.className='ed'; editor.style.width='100%'; editor.style.boxSizing='border-box';
  td.innerHTML=''; td.appendChild(editor); editor.focus();
  if(editor.select)editor.select();
  let resuelto=false;
  async function confirmar(){
    if(resuelto)return; resuelto=true;
    const antes={...d};
    const val=editor.value===''?null:(tipo==='num'?(+editor.value):editor.value);
    if(val===(d[campo]??null)){ pintar(); return; }
    const {data,error}=await sb.from(tabla).update({[campo]:val}).eq('id',id).select().single();
    if(error){ alert('No se pudo guardar: '+error.message); td.innerHTML=original; return; }
    Object.assign(d,data); marcarAccion(vista,{tipo:'campo',id,antes}); pintar();
  }
  editor.onblur=confirmar;
  editor.onkeydown=ev=>{
    if(ev.key==='Enter'){ev.preventDefault();confirmar();}
    if(ev.key==='Escape'){resuelto=true; td.innerHTML=original;}
  };
  if(editor.tagName==='SELECT')editor.onchange=confirmar;
}

let filtroCardPlan=null;
function filtrarPlan(){
  const q=nrm(fBusca.value), o=fObra.value, d=fDesde.value, h=fHasta.value;
  const si=fSistema.value, fu=fFuente.value, es=fEstado.value;
  return MUESTRAS.filter(p=>{
    const f=p.f_muestreo||'';
    if(d&&f&&f<d)return false;
    if(h&&f&&f>h)return false;
    if(o&&String(p.obra||'')!==o)return false;
    if(si&&p.sistema_std!==si)return false;
    if(fu&&p.fuente!==fu)return false;
    if(es&&p.estado_std!==es)return false;
    if(filtroCardPlan==='CRITICO'&&p.estado_std!=='CRITICO')return false;
    if(filtroCardPlan==='PRECAUCION'&&p.estado_std!=='PRECAUCION')return false;
    if(filtroCardPlan==='sinuni'&&!(p.sistema&&!p.sistema_std))return false;
    if(filtroCardPlan==='conres'&&!(p.estado_std||p.fuente))return false;
    if(!pasaColFiltros('plan',p))return false;
    if(q){
      const e=getE(p.maestro_id);
      if(!nrm(`${p.cod_sap} ${p.nro_frasco||''} ${p.sistema||''} ${p.nro_planilla||''} ${p.nro_muestra||''} ${p.obra||''} ${e?e.equipo:''} ${p.estado_std||''} ${claveMuestra(p.cod_sap,p.sistema_std||p.sistema,p.f_muestreo)||''}`).includes(q))return false;

  });

      <th class="azul">${cabColapsable('marca','Marca',false)}</th><th class="azul">${cabColapsable('modelo','Modelo',false)}</th><th class="azul">${cabColapsable('serie','Serie',false)}</th>
      <th class="amarillo">${cabColG('plan','sistema','Sistema')}</th><th class="amarillo">${cabColG('plan','tipo_aceite','Tipo de aceite')}</th><th class="amarillo c">Gal.</th><th class="amarillo c">Horómetro</th>

    ${L.map((p,i)=>{
      const e=getE(p.maestro_id);
      const sisMostrar=p.sistema_std||p.sistema||'';

      return `<tr data-pid="${p.id}">

        <td>${celdaColapsable('obra',esc(p.obra||''))}</td>
        <td class="mono">${esc(p.cod_sap||'')}</td>
        <td>${celdaColapsable('marca',esc(p.marca||(e?e.marca:'')||''))}</td>
        <td>${celdaColapsable('modelo',esc(p.modelo||(e?e.modelo:'')||''))}</td>
        <td>${celdaColapsable('serie',esc(p.serie||(e?e.serie_placa:'')||''))}</td>

        <td data-campo="tipo_aceite">${esc(p.tipo_aceite||'')}</td>
        <td class="c" data-campo="galones" data-tipo="num">${p.galones!=null?f1(p.galones):''}</td>
        <td class="c mono" data-campo="horometro" data-tipo="num">${p.horometro!=null?f0(p.horometro):''}</td>
        <td class="c" data-campo="horas_aceite" data-tipo="num">${p.horas_aceite!=null?f0(p.horas_aceite):''}</td>
        <td class="c" data-campo="cant_agregado" data-tipo="num">${p.cant_agregado!=null?f1(p.cant_agregado):''}</td>
        <td class="c" data-campo="f_muestreo" data-tipo="fecha">${fmtDate(p.f_muestreo)}</td>
        <td class="c" data-campo="f_envio" data-tipo="fecha">${fmtDate(p.f_envio)}</td>
        <td class="c" data-campo="tipo" data-tipo="select" data-op="|Muestra|Cambio">${esc(p.tipo||'')}</td>
        <td class="c mono">${esc(p.nro_frasco||'')}</td>
        <td class="desc"${COL_COLAPSADAS.observacion?'':' data-campo="observacion"'}>${celdaColapsable('observacion',esc(p.observacion||''))}</td>
        <td class="c"><span class="badgeB ${st.cls}" title="${esc(st.title)}">${st.txt}</span></td>
        <td class="c">${p.estado_std?`<span class="pill e-${p.estado_std}">${esc(p.estado_std)}</span>`:'<span class="dim">—</span>'}</td>
        <td class="c">${(p.estado_std||p.fuente)?`<button class="mini" data-ficha="${p.id}" title="Ver Ficha SOS">📄</button>`:''}</td></tr>`;}).join('')}
    </tbody></table>`;
  boxPlan.querySelectorAll('[data-del]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();borrarFilaG('plan','sos_muestras',()=>MUESTRAS,b.dataset.del);});
  boxPlan.querySelectorAll('[data-cc]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();COL_COLAPSADAS[b.dataset.cc]=!COL_COLAPSADAS[b.dataset.cc];pintarPlan();});
  boxPlan.querySelectorAll('[data-ficha]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();fichaSOS(b.dataset.ficha);});
  boxPlan.querySelectorAll('td[data-campo]').forEach(td=>td.ondblclick=ev=>{
    ev.stopPropagation();
    editarCeldaG({td, tabla:'sos_muestras', vista:'plan', arrGetter:()=>MUESTRAS, id:td.closest('tr').dataset.pid,
      campo:td.dataset.campo, tipo:td.dataset.tipo||'text', opciones:td.dataset.op?td.dataset.op.split('|'):null});
  });
  boxPlan.querySelectorAll('tbody tr').forEach(tr=>tr.ondblclick=ev=>{
    if(ev.target.closest('td[data-campo]')||ev.target.closest('.delrow')||ev.target.closest('[data-ficha]'))return;
    formPlan(tr.dataset.pid);
  });
  activarResaltado(boxPlan.querySelector('table'));
  fijarEncabezados(boxPlan);
}

const GRUPOS_FICHA_FIJOS=['Desgaste','Contaminantes','Salud - aceite','Salud - viscosidad'];
function gruposFicha(){
  return GRUPOS_FICHA_FIJOS.map(titulo=>({
    titulo,
    claves: LIMITES.filter(x=>x.grupo===titulo).sort((a,b)=>(a.orden||0)-(b.orden||0)).map(x=>x.parametro)
  }));
}
function unidadDe(clave){ const m=clave.match(/\(([^)]+)\)/); return m?m[1]:''; }

const FP=13.33;   // 10 pt expresado en px: tamaño único de letra de la ficha (también en los gráficos)

function svgGraficoFicha(claves,historial,W,H){
  const colores=['#2F52A0','#16A324','#C7A00D','#E01B22','#14B8A6','#1a1d21'];
  const series=claves.map((k,i)=>({nombre:k.replace(/\s*\([^)]*\)/,''),color:colores[i%colores.length],limite:limiteDe(k),
    valores:historial.map(h=>{const v=h.analisis&&h.analisis[k];return typeof v==='number'?v:null;})}));
  const activas=series.filter(s=>s.valores.some(v=>v!=null));
  const leyenda=activas.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.nombre)}</span>`).join('');
  if(!activas.length)return {leyenda:'',svg:`<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#98a2ad">Sin datos de este grupo</div>`};
  const n=historial.length;
  const padL=44,padR=14,padT=8;
  // si las fechas no entran rectas se inclinan (así no hay que achicar la letra)
  const anchoPlot=W-padL-padR, girar=n>1&&anchoPlot/(n-1)<62;
  const padB=girar?50:34;
  const limMax=Math.max(0,...activas.map(s=>s.limite||0));
  const max=Math.max(1,limMax,...activas.flatMap(s=>s.valores.filter(v=>v!=null)))*1.12;
  const xAt=ix=>n<=1?padL+anchoPlot/2:padL+ix*anchoPlot/(n-1);
  const yAt=v=>padT+(H-padT-padB)*(1-v/max);
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;font-family:inherit">`;
  for(let gl=0;gl<=4;gl++){
    const y=padT+(H-padT-padB)*(1-gl/4);
    svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e6e9ec"/>`;
    svg+=`<text x="${padL-5}" y="${y+4.5}" font-size="${FP}" text-anchor="end" fill="#555">${f1(max*gl/4)}</text>`;
  }
  historial.forEach((h,ix)=>{
    const x=xAt(ix), y=H-padB+15, fe=fmtDate(h.f_muestreo);
    if(girar) svg+=`<text x="${x}" y="${y}" font-size="${FP}" text-anchor="end" fill="#555" transform="rotate(-35 ${x} ${y})">${esc(fe)}</text>`;
    else{
      svg+=`<text x="${x}" y="${y}" font-size="${FP}" text-anchor="middle" fill="#555">${esc(fe)}</text>`;
      if(h.horometro!=null)svg+=`<text x="${x}" y="${y+14}" font-size="${FP}" text-anchor="middle" fill="#888">${f0(h.horometro)}h</text>`;
    }
  });
  activas.forEach(s=>{
    if(s.limite){const y=yAt(s.limite);
      svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${s.color}" stroke-width="1.2" stroke-dasharray="5,4" opacity=".55"/>`;}
    const pts=s.valores.map((v,ix)=>v==null?null:[xAt(ix),yAt(v)]).filter(Boolean);
    if(pts.length>1)svg+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2"/>`;
    s.valores.forEach((v,ix)=>{ if(v!=null)svg+=`<circle cx="${xAt(ix)}" cy="${yAt(v)}" r="3.2" fill="${s.color}"><title>${esc(s.nombre)}: ${v}</title></circle>`; });
  });
  return {leyenda,svg:svg+'</svg>'};
}

/* Acciones correctivas: se guardan en la misma columna "Acciones correctivas" del
   Seguimiento de alertas (tabla sos_alertas), así quedan en un solo lugar. */
const aleDe=p=>ALE.find(a=>String(a.resultado_id)===String(p.id))||null;
async function guardarAcciones(p,txt){
  txt=(txt||'').trim()||null;
  const a=aleDe(p);
  if(a){
    if((a.acciones||null)===txt)return;
    const {error}=await sb.from('sos_alertas').update({acciones:txt}).eq('id',a.id);
    if(error)throw error;
    a.acciones=txt;
  }else{
    if(!txt)return;
    const {data,error}=await sb.from('sos_alertas').insert({resultado_id:p.id,nro_muestra:p.nro_muestra,link_pdf:p.link_pdf||null,acciones:txt}).select().single();
    if(error)throw error;
    ALE.push(data);
  }
}
/* achica la letra SOLO de una caja cuyo texto no entra (en vez de cortarlo) */
function encajarTexto(el,min){
  if(!el)return;
  let fs=10; el.style.fontSize=fs+'pt';
  while(el.scrollHeight>el.clientHeight+1&&fs>(min||7)){ fs-=0.5; el.style.fontSize=fs+'pt'; }
}

/* ═══════════════ DASHBOARD SOS ═══════════════
   Cinco preguntas simples, con el semáforo de siempre (verde / amarillo / rojo).
   Todo sale de lo que SOS ya tiene: Maestro de Equipos + Plan de muestreo (programación),
   Muestras, Frascos y Seguimiento de alertas. Filtros propios: Mes y Obra.
   Cumplimiento y "Esta semana" cuentan SOLO los equipos que llevan SOS (ver sinSOS). */
const DASH_META=90;          // % de cumplimiento esperado
const DASH_TOL=0.10;         // tolerancia de horómetro: ±10% de la frecuencia
const MESES_D=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];
let dashIni=false, DASH_DET=null;

/* ¿la muestra se tomó dentro de tolerancia? (horómetro cerca de un múltiplo de la frecuencia del equipo) */
function aTiempo(m){
  const e=getE(m.maestro_id), F=e?+e.frecuencia||0:0, h=+m.horometro;
  if(!F||!isFinite(h)||!m.horometro)return true;            // sin datos para evaluar: no se castiga
  const k=Math.round(h/F)*F;
  return Math.abs(h-k)<=F*DASH_TOL;
}
const conSOS=m=>{ const e=getE(m.maestro_id); return !e||!sinSOS(e); };
/* Muestras PENDIENTES según la programación: para cada equipo con SOS, su próximo PM decide
   el nivel (PM1, PM2…) y la tabla de sistemas dice QUÉ sistemas tocan en ese nivel — un PM de
   250 h solo pide los sistemas marcados PM1, no todos. Se descartan los que ya tienen una
   muestra reciente del mismo equipo y sistema. */
function programaSOS(obra){
  const out=[], H=hoy0();
  datos.forEach(e=>{
    if(esDesmovM(e)||sinSOS(e))return;
    if(obra&&e.cod_proyec!==obra)return;
    const freq=+e.frecuencia||0; if(!freq)return;
    const c=mant(e); if(!c.fproxDate)return;
    const hrPM=Math.round(c.proximo/freq)*freq, pm=nivelPM(hrPM,freq), tipo=tipoDe(e);
    const sis=tipo?SIST.filter(s=>nrm(s.tipo_equipo)===nrm(tipo)&&rangoIncluye(pm,s.pm)).map(s=>s.sistema):[];
    (sis.length?sis:['(sin sistemas en el plan)']).forEach(s=>{
      const std=sistemaStd(s)||nrm(s);
      const lim=new Date(c.fproxDate.getTime()-30*86400000).toISOString().slice(0,10);
      const hecha=MUESTRAS.some(m=>nrm(m.cod_sap)===nrm(e.cod_sap)&&(m.sistema_std||nrm(m.sistema))===std&&String(m.f_muestreo||'')>=lim);
      if(!hecha)out.push({e,sistema:s,pm,hrPM,fecha:c.fproxDate,vencida:c.fproxDate<H,sinPlan:!sis.length});
    });
  });
  return out;
}
function pintarDash(){
  if(!dashIni){
    dashIni=true;
    const hoy=new Date(), ops=[];
    for(let i=0;i<12;i++){const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
      ops.push(`<option value="${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}">${MESES_D[d.getMonth()]} ${d.getFullYear()}</option>`);}
    dMes.innerHTML=ops.join('');
    const obras=[...new Set(datos.filter(e=>!esDesmovM(e)).map(e=>e.cod_proyec).filter(Boolean))].sort();
    dObra.innerHTML='<option value="">Todas las obras</option>'+obras.map(o=>`<option>${esc(o)}</option>`).join('');
    dMes.onchange=dObra.onchange=pintarDash;
  }
  const mes=dMes.value, obra=dObra.value, hoy=hoy0(), hoyS=isoDe(new Date());
  const mesNom=MESES_D[+mes.slice(5)-1].toLowerCase();
  const esMesActual=mes===hoyS.slice(0,7);
  const deObra=m=>!obra||String(m.obra||'')===obra;
  const delMes=MUESTRAS.filter(m=>String(m.f_muestreo||'').slice(0,7)===mes&&deObra(m));
  const delMesSOS=delMes.filter(conSOS);

  // 1) cumplimiento: programadas = tomadas en el mes + las que faltan (solo se conocen en el mes en curso)
  const prgAll=programaSOS(obra);
  const pend=esMesActual?prgAll.filter(p=>isoDe(p.fecha)<=mes+'-31'):[];
  const tol=delMesSOS.filter(aTiempo).length, fuera=delMesSOS.length-tol, faltan=pend.length;
  const prog=delMesSOS.length+faltan, pct=prog?Math.round(tol/prog*100):0;

  DASH_DET={mes,mesNom,tomadas:delMesSOS,pend,esMesActual};

  // 2) esta semana (lunes a domingo)
  const lun=new Date(hoy); lun.setDate(hoy.getDate()-((hoy.getDay()+6)%7));
  const dom=new Date(lun.getTime()+6*86400000), en7=new Date(hoy.getTime()+7*86400000);
  const semHechas=MUESTRAS.filter(m=>deObra(m)&&conSOS(m)&&m.f_muestreo>=isoDe(lun)&&m.f_muestreo<=isoDe(dom)).length;
  const porVencer=prgAll.filter(p=>p.fecha>=hoy&&p.fecha<=en7).length;

  // 3) frascos

    if(!porObra.has(o))porObra.set(o,{disp:0,usad:0});
    if(f.estado==='Usado')porObra.get(o).usad++; else porObra.get(o).disp++; });
  const filasFr=[...porObra.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  const maxF=Math.max(1,...filasFr.map(([,v])=>v.disp+v.usad));
  const totDisp=filasFr.reduce((a,[,v])=>a+v.disp,0), totUsad=filasFr.reduce((a,[,v])=>a+v.usad,0);

  // 4) salud del aceite
  const conRes=delMes.filter(m=>m.estado_std);
  const nN=conRes.filter(m=>m.estado_std==='NORMAL').length, nP=conRes.filter(m=>m.estado_std==='PRECAUCION').length,
        nC=conRes.filter(m=>m.estado_std==='CRITICO').length;
  const sinAtender=conRes.filter(m=>m.estado_std==='CRITICO'&&!ale(m).om_sap&&ale(m).estado_seg!=='Descartado'&&ale(m).estado_seg!=='Cerrado').length;
  const meses=[];
  { const [y,mo]=mes.split('-').map(Number);
    for(let i=5;i>=0;i--){const d=new Date(y,mo-1-i,1), k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const ms=MUESTRAS.filter(m=>String(m.f_muestreo||'').slice(0,7)===k&&deObra(m));
      meses.push({k,lab:MESES_D[d.getMonth()].slice(0,3)+' '+String(d.getFullYear()).slice(2),
        c:ms.filter(m=>m.estado_std==='CRITICO').length,p:ms.filter(m=>m.estado_std==='PRECAUCION').length});} }

  // 5) seguimiento (últimos 12 meses hasta el mes elegido)
  const fin=mes+'-31', ini=(()=>{const [y,mo]=mes.split('-').map(Number);return isoDe(new Date(y,mo-12,1));})();
  const alertas=MUESTRAS.filter(m=>(m.estado_std==='CRITICO'||m.estado_std==='PRECAUCION')&&deObra(m)
    &&m.f_muestreo>=ini&&m.f_muestreo<=fin&&ale(m).estado_seg!=='Descartado');
  const segN=s=>alertas.filter(m=>(ale(m).estado_seg||'OM abierta')===s).length;

  // fichas: vertical = número grande debajo; horizontal (h) = número a la derecha, para apilar
  const tile=(cls,ico,l,v,s)=>`<div class="dtile ${cls}"><div class="l">${ico?`<span class="dico ${cls}">${ico}</span>`:''}${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;

    ${prog?`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${colPct}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${cc}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/>`:''}
    <text x="60" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="#1F3864">${prog?pct+'%':'—'}</text></svg>`;
  const barras=W=>{ W=Math.max(320,W||700);
  const Hh=190,L=26,B=24,T=14,mx=Math.max(4,...meses.map(x=>x.c+x.p))*1.18,bw=Math.min(58,(W-L-24)/meses.length*0.6);

function ale(r){ return ALE.find(a=>String(a.resultado_id)===String(r.id))||{}; }
async function guardarAlerta(rid,ctrl){
  const r=MUESTRAS.find(x=>String(x.id)===String(rid)); if(!r)return;
  const col=ctrl.dataset.c;

/* Reconoce el archivo por sus columnas, no por el nombre */
function detectarTipo(filas,nombre,hoja){
  const t=nrm(nombre+' '+hoja);
  if(/INGRESO|FESA|LUBTEC|MARCO/.test(t))
    return (leerHoja(filas,['N° MUESTRA','EQUIPO','COMPONENTE'])||leerHoja(filas,['Nro de Muestra','Equipo','Compartimiento','CONDICIÓN SOS']))?'res':null;
  if(/PLANILLA/.test(t))return (leerHoja(filas,['N° Frasco','Sistema'])||leerHoja(filas,['Marca','Modelo','Serie','Sistema']))?'plan':null;
  // sin pistas en el nombre: se mira el contenido
  if(leerHoja(filas,['N° MUESTRA','EQUIPO','COMPONENTE','ESTADO']))return 'res';
  if(leerHoja(filas,['No. de control de laboratorio','ID de equipo','Compartimento','Estado']))return 'res';
  if(leerHoja(filas,['Nro de Muestra','Equipo','Compartimiento','CONDICIÓN SOS']))return 'res';
  if(leerHoja(filas,['N° Frasco','Sistema','Muestreo']))return 'plan';
  if(leerHoja(filas,['Marca','Modelo','Serie','Sistema','Horometro']))return 'plan';
  return null;
}

btnSubir.onclick=()=>{
  const i=document.createElement('input'); i.type='file'; i.accept='.xlsx,.xls,.csv';
  i.onchange=async()=>{
    const f=i.files&&i.files[0]; if(!f)return;
    pie.textContent='Leyendo '+f.name+'…';
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
      // se procesan TODAS las hojas del archivo (algunos formatos traen una hoja distinta por fecha o por lote);
      // cada hoja se reconoce sola, sin importar en qué vista estés
      let procesadas=0; const sinReconocer=[];
      for(const nombreHoja of wb.SheetNames){
        const hoja=wb.Sheets[nombreHoja];
        const filas=XLSX.utils.sheet_to_json(hoja,{header:1,raw:true,defval:''});
        const tipo=detectarTipo(filas,f.name,nombreHoja);
        if(tipo==='plan'){
          const regs=leerPlanilla(filas);
          if(!regs||!regs.length)continue; // hoja reconocida pero sin filas (ej. plantilla vacía): se omite sin avisar
          verVista('plan'); await subirPlanilla(filas,wb.SheetNames.length>1?`${f.name} · ${nombreHoja}`:f.name); procesadas++;
        }else if(tipo==='res'){
          verVista('plan'); await subirResultados(filas,wb.SheetNames.length>1?`${f.name} · ${nombreHoja}`:f.name,nombreHoja); procesadas++;
        }else sinReconocer.push(nombreHoja);
      }
      if(!procesadas)alert('No se reconoció el formato de ninguna hoja del archivo.\n\n'
        +'Se esperaba una PLANILLA DE MUESTRAS (con N° Frasco, o con Marca/Modelo/Serie y Sistema)\n'
        +'o un archivo de laboratorio (con N° MUESTRA, EQUIPO, COMPONENTE, FECHA, ESTADO).');
    }catch(err){ alert('No se pudo leer el archivo: '+err.message); }
    pie.textContent='';
  };
  i.click();
};

const CAMPOS_COMPARABLES_PLAN=[
  ['nro_planilla','N° Planilla'],['nro_frasco','N° Frasco'],
  ['obra','Obra'],['marca','Marca'],['modelo','Modelo'],['serie','Serie'],
  ['tipo_aceite','Tipo de aceite'],['galones','Galones'],['horometro','Horómetro'],
  ['horas_aceite','Horas del aceite'],['cant_agregado','Cant. agregado'],
  ['f_envio','Fecha de envío'],['tipo','Tipo'],['observacion','Observación']
];
function diffCamposPlan(existente,entrante){
  const cambios=[];
  for(const [campo,label] of CAMPOS_COMPARABLES_PLAN){
    const nuevo=entrante[campo];
    if(nuevo===null||nuevo===undefined||nuevo==='')continue; // nunca pisar con un valor vacío
    const actual=existente[campo];
    if(String(actual??'')!==String(nuevo))cambios.push({campo,label,antes:actual,despues:nuevo});
  }
  return cambios;
}
function mostrarValor(campo,v){
  if(v===null||v===undefined||v==='')return '<span class="dim">(vacío)</span>';
  if(campo==='f_envio')return esc(fmtDate(v));
  return esc(String(v));
}
async function subirPlanilla(filas,nom){
  const regs=leerPlanilla(filas);
  if(!regs||!regs.length){alert('No se reconoció el formato.\n\nDebe tener las columnas de la PLANILLA DE MUESTRAS: N° Frasco, Código del Equipo, Sistema, Muestreo…');return;}
  const clave=p=>[p.cod_sap||'',p.sistema||'',p.f_muestreo||''].join('|');
  const mapaExistente=new Map(MUESTRAS.map(p=>[clave(p),p]));
  const candidatas=[]; const conCambios=[];
  const vistas=new Set(); let repetidasEnArchivo=0, yaIgual=0;
  regs.forEach(p=>{
    const k=clave(p);
    if(mapaExistente.has(k)){
      const existente=mapaExistente.get(k);
      const cambios=diffCamposPlan(existente,p);
      if(cambios.length)conCambios.push({existente,entrante:p,cambios});
      else yaIgual++;
      return;
    }
    if(vistas.has(k)){repetidasEnArchivo++;return;}
    vistas.add(k);
    candidatas.push(p);
  });
  const nuevos=candidatas;
  const sinEq=regs.filter(p=>!p.maestro_id&&p.cod_sap);
  const sinSis=regs.filter(p=>p.sistema&&!p.sistema_std);
  if(!confirm(`${nom}\n\n`
    +`Muestras leídas: ${regs.length}\n`
    +`Nuevas para agregar: ${nuevos.length}\n`
    +`Ya registradas, sin cambios: ${yaIgual}\n`
    +(conCambios.length?`Ya registradas, con datos nuevos o distintos (te las muestro a continuación): ${conCambios.length}\n`:'')
    +(repetidasEnArchivo?`Repetidas dentro del propio archivo (se omiten): ${repetidasEnArchivo}\n`:'')
    +(sinEq.length?`Códigos que no están en Equipos: ${sinEq.length}\n`:'')
    +(sinSis.length?`Sistemas sin equivalencia: ${sinSis.length} (los podrás asignar después)\n`:'')
    +`\n¿Continuar?`))return;
  // ampliar el filtro de fechas visible para que se vea todo lo cargado (nuevo o ya existente)
  const fechas=regs.map(r=>r.f_muestreo).filter(Boolean).sort();
  if(fechas.length){
    if(!fDesde.value||fechas[0]<fDesde.value)fDesde.value=fechas[0];
    const ultima=fechas[fechas.length-1];
    if(!fHasta.value||ultima>fHasta.value)fHasta.value=ultima;
    ponerRango('pers');
  }
  let ok=0; const fallidas=[];
  for(const p of nuevos){
    const {error}=await sb.from('sos_muestras').insert(p);
    if(error)fallidas.push({p,msg:error.message}); else ok++;
  }
  if(fallidas.length){
    const detalle=fallidas.slice(0,8).map(x=>`· ${x.p.cod_sap||'—'} / ${x.p.sistema||'—'} / ${x.p.f_muestreo||'—'} → ${x.msg}`).join('\n');
    alert(`Se guardaron ${ok} de ${nuevos.length}.\n\n${fallidas.length} fila(s) rechazadas por la base de datos:\n${detalle}`
      +(fallidas.length>8?`\n… y ${fallidas.length-8} más.`:''));
  }
  if(ok||fallidas.length)await cargarTodo();
  pie.textContent=`${ok} muestra(s) agregadas a la planilla.`;
  if(conCambios.length)revisarCambiosPlanilla(conCambios);
}

function buscarDuplicadosPlanilla(){
  const grupos=new Map();
  MUESTRAS.forEach(p=>{
    const k=[p.cod_sap||'',p.sistema||'',p.f_muestreo||''].join('|');
    if(!p.cod_sap||!p.sistema||!p.f_muestreo)return; // sin estos 3 datos no hay forma confiable de agrupar
    if(!grupos.has(k))grupos.set(k,[]);
    grupos.get(k).push(p);
  });
  const dup=[...grupos.values()].filter(g=>g.length>1);
  if(!dup.length){ alert('No se encontraron filas duplicadas (mismo Cód. SAP, Sistema y Fecha de muestreo).'); return; }
  const contarLlenos=p=>CAMPOS_COMPARABLES_PLAN.reduce((n,[c])=>n+(p[c]!=null&&p[c]!==''?1:0),0);
  dup.forEach(g=>g.sort((a,b)=>contarLlenos(b)-contarLlenos(a) || String(b.created_at||'').localeCompare(String(a.created_at||''))));

    <div class="mh"><h3>Filas duplicadas</h3>

    <div class="mb">

          <td>${p.nro_planilla?esc(p.nro_planilla):'<span class="dim">(vacío)</span>'}</td>
          <td>${p.nro_frasco?esc(p.nro_frasco):'<span class="dim">(vacío)</span>'}</td>

      </div>`).join('')}
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)">
      <button class="act" id="dupNo">Cancelar</button><button class="act primary" id="dupOk">Borrar las no marcadas</button></div>
  </div></div>`);
  const cerrar=()=>{const e=document.getElementById('mdup');if(e)e.remove();};
  document.getElementById('dupCer').onclick=cerrar;
  document.getElementById('dupNo').onclick=cerrar;
  document.getElementById('mdup').addEventListener('click',ev=>{if(ev.target.id==='mdup')cerrar();});
  document.getElementById('dupOk').onclick=async()=>{
    const mantener=new Map();
    document.querySelectorAll('.dupR:checked').forEach(r=>mantener.set(+r.dataset.gi,+r.dataset.pi));
    const aBorrar=[];
    dup.forEach((g,gi)=>{ const keepPi=mantener.has(gi)?mantener.get(gi):0; g.forEach((p,pi)=>{ if(pi!==keepPi)aBorrar.push(p); }); });
    if(!aBorrar.length){cerrar();return;}

    const {error}=await sb.from('sos_muestras').delete().in('id',aBorrar.map(p=>p.id));

    const antes=aBorrar.map(p=>({...p}));

    marcarAccion('plan',{tipo:'lote_eliminada',antes});

async function subirResultados(filas,nom,hoja){
  // el laboratorio se deduce del nombre de la hoja o del archivo
  const t=nrm(hoja+' '+nom);
  let fuente = /FESA/.test(t)?'Ferreyros' : /LUBTEC/.test(t)?'LUBTEC' : /MARCO/.test(t)?'MARCO PERUANA' : null;
  if(!fuente&&leerHoja(filas,['No. de control de laboratorio','ID de equipo','Compartimento']))fuente='Ferreyros';
  if(!fuente&&leerHoja(filas,['Nro de Muestra','Equipo','Compartimiento','CONDICIÓN SOS']))fuente='MARCO PERUANA';
  if(!fuente){
    fuente=prompt('¿De qué laboratorio es este archivo?\n\nEscribe: Ferreyros, LUBTEC o MARCO','Ferreyros');
    if(!fuente)return;
    fuente=nrm(fuente).startsWith('MARCO')?'MARCO PERUANA':nrm(fuente).startsWith('FERREYROS')||nrm(fuente).startsWith('FESA')?'Ferreyros':nrm(fuente);
  }
  const regs=(leerResultados(filas,fuente)||[]).filter(Boolean);
  if(!regs||!regs.length){alert('No se reconoció el formato.\n\nDebe tener las columnas N° MUESTRA, EQUIPO, COMPONENTE, FECHA y ESTADO (o el formato nativo de Ferreyros).');return;}
  // 0) resultados ya guardados pero en la fila de OTRO sistema (el archivo dice cuál es el correcto):
  //    se ofrecen mover o intercambiar antes de seguir, así los pasos siguientes ya ven las filas en su sitio
  const malUb=detectarMalUbicados(regs,fuente);
  if(malUb.length)await revisarMalUbicados(malUb);
  // ya registrado = misma fuente + mismo N° de muestra ya tiene resultado en Muestras
  const yaHay=new Set(MUESTRAS.filter(m=>m.fuente).map(m=>m.fuente+'|'+nrm(m.nro_muestra)));
  const nuevos=regs.filter(r=>!yaHay.has(fuente+'|'+nrm(r.nro_muestra)));
  // por cada nuevo: buscar una fila de Muestras que YA exista (planilla) y que TODAVÍA no tenga resultado propio
  nuevos.forEach(r=>{
    const p=enlazarPlanilla(r);
    r.muestraExistente=(p&&!p.estado_std&&!p.fuente)?p:null;
    // conflicto: su fila (mismo equipo + sistema + fecha) ya está ocupada por OTRO resultado.
    // antes esto terminaba creando una fila duplicada; ahora se pregunta qué hacer.
    if(p&&!r.muestraExistente&&p.fuente
       &&claveMuestra(p.cod_sap,p.sistema_std||p.sistema,p.f_muestreo)===claveMuestra(r.cod_sap,r.sistema_std||r.componente,r.fecha))
      r.conflicto=p;
  });
  const conMuestra=nuevos.filter(r=>r.muestraExistente);
  const conflictos=nuevos.filter(r=>r.conflicto);
  const sinMuestra=nuevos.filter(r=>!r.muestraExistente&&!r.conflicto);
  // filas que YA tenían resultado, pero el archivo trae texto/análisis distinto (correcciones del laboratorio o del lector)
  const yaConResultado=regs.filter(r=>yaHay.has(fuente+'|'+nrm(r.nro_muestra)));
  const conCambiosRes=[];
  yaConResultado.forEach(r=>{
    const existente=MUESTRAS.find(m=>m.fuente===fuente&&nrm(m.nro_muestra)===nrm(r.nro_muestra));
    if(!existente)return;
    const cambios=[];
    if(r.observacion&&r.observacion!==(existente.observacion_lab||null))
      cambios.push({campo:'observacion_lab',etiqueta:'Análisis y recomendaciones',antes:existente.observacion_lab,despues:r.observacion});
    if(r.estado&&r.estado!==(existente.estado||null))
      cambios.push({campo:'estado',etiqueta:'Estado (texto original)',antes:existente.estado,despues:r.estado});
    if(r.estado_std&&r.estado_std!==(existente.estado_std||null))
      cambios.push({campo:'estado_std',etiqueta:'Estado',antes:existente.estado_std,despues:r.estado_std});
    if(r.analisis&&JSON.stringify(r.analisis)!==JSON.stringify(existente.analisis||{}))
      cambios.push({campo:'analisis',etiqueta:'Parámetros de análisis',antes:existente.analisis?Object.keys(existente.analisis).length+' valores guardados':'(sin datos)',
        despues:Object.keys(r.analisis).length+' valores en el archivo',valorReal:r.analisis});
    if(cambios.length)conCambiosRes.push({existente,entrante:r,cambios});
  });
  const sinEst=[...new Set(regs.filter(r=>r.estado&&!r.estado_std).map(r=>r.estado))];
  const sinSis=[...new Set(regs.filter(r=>r.componente&&!r.sistema_std).map(r=>r.componente))];
  let msg=`${nom}  ·  laboratorio: ${fuente}\n\n`
    +`Resultados leídos: ${regs.length}\n`
    +`Nuevos para agregar: ${nuevos.length}\n`
    +`Ya registrados, sin cambios: ${yaConResultado.length-conCambiosRes.length}\n`
    +(conCambiosRes.length?`Ya registrados, con datos distintos (te los mostraré para revisar): ${conCambiosRes.length}\n`:'')
    +`Enlazados con una muestra ya registrada: ${conMuestra.length} de ${nuevos.length}\n`
    +(conflictos.length?`En conflicto (su fila ya tiene otro resultado — te los mostraré para decidir): ${conflictos.length}\n`:'')
    +(sinMuestra.length?`Sin enlazar (te los mostraré para armar su fila): ${sinMuestra.length}\n`:'');
  if(sinEst.length)msg+=`\n⚠ Estados sin equivalencia (quedarán sin uniformar):\n  ${sinEst.slice(0,6).join(', ')}${sinEst.length>6?'…':''}\n`;
  if(sinSis.length)msg+=`\n⚠ Sistemas sin equivalencia:\n  ${sinSis.slice(0,6).join(', ')}${sinSis.length>6?'…':''}\n`;
  msg+='\n¿Continuar?';
  if(!confirm(msg))return;
  let ok=0; const fallidas=[];
  for(const r of conMuestra){
    const patch={
      fuente:r.fuente, nro_muestra:r.nro_muestra,
      nro_frasco:r.muestraExistente.nro_frasco||r.cod_frasco||null,
      horometro:r.muestraExistente.horometro??r.horometro,
      estado:r.estado, estado_std:r.estado_std, observacion_lab:r.observacion, link_pdf:r.link_pdf, analisis:r.analisis
    };
    const {data,error}=await sb.from('sos_muestras').update(patch).eq('id',r.muestraExistente.id).select().single();
    if(error){fallidas.push({r,msg:error.message});continue;}
    Object.assign(r.muestraExistente,data); ok++;
  }
  if(fallidas.length){
    const detalle=fallidas.slice(0,8).map(x=>`· ${x.r.cod_sap||'—'} / ${x.r.componente||'—'} / ${x.r.fecha||'—'} → ${x.msg}`).join('\n');
    alert(`Se enlazaron ${ok} de ${conMuestra.length}.\n\n${fallidas.length} fila(s) rechazadas:\n${detalle}`);
  }
  if(ok)await cargarTodo();
  pie.textContent=`${ok} resultado(s) enlazados con muestras existentes.`;
  // primero los conflictos; los que se decidan como "crear fila nueva" se suman a la revisión de filas nuevas
  if(conflictos.length){
    const extra=await revisarConflictos(conflictos,regs);
    sinMuestra.push(...extra);
  }
  if(sinMuestra.length)revisarNuevasPlanillas(sinMuestra);
  if(conCambiosRes.length)revisarCambiosResultados(conCambiosRes);
  if(sinEst.length||sinSis.length){
    // se nombra exactamente qué falta y se ofrece resolverlo al momento
    const det=(sinEst.length?`Estados sin equivalencia (${sinEst.length}):\n   ${sinEst.join('\n   ')}\n\n`:'')
             +(sinSis.length?`Sistemas sin equivalencia (${sinSis.length}):\n   ${sinSis.slice(0,15).join('\n   ')}`
               +(sinSis.length>15?`\n   … y ${sinSis.length-15} más`:'')+'\n':'');
    const abrir=confirm(
      `Los resultados se guardaron, pero estos textos del laboratorio todavía no tienen equivalencia,\n`
      +`así que esas filas quedan sin uniformar y no entran en los filtros ni en las alertas:\n\n${det}\n`
      +`¿Abrir el panel de Equivalencias para asignarlas ahora?\n`
      +`(al guardarlas, los datos ya cargados se corrigen solos)`);
    if(abrir)eqAbrir();
  }
}
/* ═══════ Resultados mal ubicados y conflictos al subir un archivo ═══════
   Un resultado nunca debe crear una fila duplicada solo porque su fila
   correcta está ocupada por otro número: se muestra el problema y se
   resuelve moviendo / intercambiando resultados dentro de la misma toma
   (mismo equipo + misma fecha de muestreo). */
const CAMPOS_RES=['fuente','nro_muestra','estado','estado_std','observacion_lab','link_pdf','analisis'];
const RES_VACIO=Object.fromEntries(CAMPOS_RES.map(c=>[c,null]));
const stdDe=m=>m.sistema_std||sistemaStd(m.sistema)||nrm(m.sistema);
const filaVacia=m=>!m.fuente&&!m.estado_std&&!m.nro_muestra;
const resDe=m=>Object.fromEntries(CAMPOS_RES.map(c=>[c,m[c]??null]));
const mismaToma=(a,b)=>nrm(a.cod_sap)===nrm(b.cod_sap)&&String(a.f_muestreo||'').slice(0,10)===String(b.f_muestreo||'').slice(0,10);
const getM=id=>MUESTRAS.find(x=>String(x.id)===String(id));
async function guardarRes(id,patch){
  const {data,error}=await sb.from('sos_muestras').update(patch).eq('id',id).select().single();
  if(error)throw error;
  const m=getM(id); if(m)Object.assign(m,data);
  return data;
}
const alertasDe=id=>ALE.filter(a=>String(a.resultado_id)===String(id)).map(a=>a.id);
async function reasignarAlertas(ids,toId){
  if(!ids.length)return;
  const {error}=await sb.from('sos_alertas').update({resultado_id:toId}).in('id',ids);
  if(error)throw error;
  ALE.forEach(a=>{ if(ids.includes(a.id))a.resultado_id=toId; });
}
/* Intercambia los datos de laboratorio entre dos filas (si B está vacía, equivale
   a mover el resultado de A a B). Primero se vacía A para no repetir el N° de
   muestra ni un instante; si algo falla a mitad, se intenta dejar todo como estaba. */
async function intercambiarRes(A,B){
  const ra=resDe(A), rb=resDe(B), alA=alertasDe(A.id), alB=alertasDe(B.id);
  await guardarRes(A.id,RES_VACIO);
  try{ await guardarRes(B.id,ra); }
  catch(e){ await guardarRes(A.id,ra).catch(()=>{}); throw e; }
  try{ await guardarRes(A.id,rb); }
  catch(e){ await guardarRes(B.id,rb).catch(()=>{}); await guardarRes(A.id,ra).catch(()=>{}); throw e; }
  await reasignarAlertas(alA,B.id);
  await reasignarAlertas(alB,A.id);
}
