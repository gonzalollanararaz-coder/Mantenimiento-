<style>

  .vacio{padding:40px;text-align:center;color:#98a2ad}

  .fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.fotos img{width:150px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
  pre.wa{white-space:pre-wrap;background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:12px}

  .kpi{border:1px solid var(--line);background:#fff;border-radius:10px;height:30px;padding:0 14px;font:inherit;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}

  .kpi.k-b.on{background:#B91C1C;border-color:#B91C1C;color:#fff}.kpi.k-w.on{background:#E0A800;border-color:#E0A800;color:#3B2E00}

  .msp{position:fixed;z-index:200;width:240px;background:#fff;border:1px solid #c9ced4;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:8px}

  .msp .msa{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}.msp .msa a{color:#4254A5;cursor:pointer}
  .msp .mso{max-height:260px;overflow:auto}.msp .mso label{display:flex;gap:7px;align-items:center;padding:3px 4px;font-size:12px;cursor:pointer;border-radius:6px}.msp .mso label:hover{background:#f4f6fb}
  .tag{background:#eef0f6;border-radius:8px;padding:2px 8px;font-size:11.5px;color:#334281;cursor:pointer;white-space:nowrap}.tag:hover{background:#e0e4f2}

  table.tc{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px;background:#fff}

  table.tc tr.g1 th{position:sticky;top:0;z-index:4;height:22px;background:#1F3864;color:#fff;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;text-align:left;padding:0 8px;cursor:pointer;border-left:2px solid #0f1f3f;user-select:none}
  table.tc tr.g1 th:hover{background:#2a4a85}
  table.tc tr.g2 th{position:sticky;top:22px;z-index:3;background:linear-gradient(180deg,#7B87C0 0%,#4254A5 60%,#334281 100%);color:#fff;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;padding:4px 6px;text-align:left;overflow:hidden;text-overflow:ellipsis}
  table.tc td{height:22px;padding:1px 6px;border-bottom:1px solid #eef1f4;overflow:hidden;text-overflow:ellipsis;line-height:18px}
  table.tc td.c,table.tc th.c{text-align:center}table.tc td.r,table.tc th.r{text-align:right}
  table.tc tbody tr:hover td{background:#f3f8ff;cursor:pointer}
  table.tc .fz{position:sticky;background:#fff;z-index:2}table.tc th.fz{z-index:5}
  table.tc tbody tr:hover td.fz{background:#f3f8ff}
  table.tc .pill{padding:0 7px;font-size:10px;line-height:15px}
  table.tc td.ac{padding:0;text-align:center}
  .del{border:none;background:none;cursor:pointer;font-size:12px;opacity:.35;padding:2px 4px;border-radius:6px}tr:hover .del{opacity:1}.del:hover{background:#fde4e4}
  #tip{position:fixed;display:none;z-index:300;max-width:460px;background:#1c232b;color:#fff;font-size:12px;line-height:1.45;padding:6px 10px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none;white-space:pre-wrap;word-break:break-word}

  .sgh{display:flex;gap:10px;align-items:center;padding:7px 12px;background:#f4f6fa;cursor:pointer;user-select:none}.sgh:hover{background:#eceff6}

  .toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#1c232b;color:#fff;border-radius:10px;padding:9px 16px;font-size:12.5px;z-index:400;display:flex;gap:14px;align-items:center;box-shadow:0 8px 26px rgba(0,0,0,.35)}
  .toast button{background:none;border:none;color:#FFCD11;font:inherit;font-weight:700;cursor:pointer}
  .act:disabled{opacity:.4;cursor:default}
  table.sg{border-collapse:separate;border-spacing:0;font-size:12.5px;background:#fff}
  table.sg th,table.sg td{border-bottom:1px solid #eef1f4;padding:4px 6px;text-align:center;min-width:42px}
  table.sg th{background:linear-gradient(180deg,#7B87C0 0%,#4254A5 60%,#334281 100%);color:#fff;font-size:11px;position:sticky;top:0;z-index:2}

  table.sg th.dom{background:#6b747d}table.sg th.hoy{background:#1F3864;box-shadow:inset 0 -3px 0 #FFCD11}
  table.sg td.n{background:#eaf7ee;color:#0F7A33;font-weight:800;cursor:pointer}table.sg td.n:hover{background:#d4f0dc}
  table.sg td.x{background:#fdecec;color:#B91C1C;font-weight:800}
  table.sg td.nm{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:190px;white-space:nowrap}
  table.sg td.tt{background:#f4f6fa;font-weight:800;color:#1F3864}
  table.sg tr.tot td{background:#f4f6fa;font-weight:800;color:#1F3864}
</style>

<body>
<header id="topbar"><div><h1>Parte diario mecánico</h1><p>Unidad de Equipos &middot; UDE &middot; app REPORTE</p></div><span class="who" id="who"></span></header>
<script>if(window.self!==window.top){document.getElementById('topbar').style.display='none';}</script>
<div id="subnav">
  <button data-v="reg" class="on">&#128221; Registros</button>
  <button data-v="seg">&#128202; Seguimiento</button>
  <button data-v="pen">&#128204; Pendientes</button>
  <button data-v="col" class="hide">&#128119; Colaboradores</button>
  <button data-v="mae">&#9881; Datos maestros ↗</button>
</div>
<div class="fb" id="tbReg">
  <div class="fr">
    <input id="fTxt" placeholder="Buscar equipo, falla, trabajo…">
    <span class="lb">Periodo</span>
    <span class="chs" id="chPer"><button data-p="0">Hoy</button><button data-p="1">Ayer</button><button data-p="7" class="on">7 días</button><button data-p="30">30 días</button><button data-p="m">Mes</button></span>
    <input type="date" id="fDesde"><span class="dim">→</span><input type="date" id="fHasta">
    <div class="spacer"></div>
    <button class="kpi k-b" id="kInop" title="Filtrar solo registros inoperativos">Inoperativos <b id="nInop">0</b></button>
    <button class="kpi k-w" id="kPen" title="Filtrar solo registros con pendiente abierto">Pendientes <b id="nPen">0</b></button>
  </div>
  <div class="fr">
    <span class="lb">Intervención</span><span class="chs" id="chTipo"></span>
    <div class="spacer"></div>

    <button class="act sm" id="btnLimp" title="Borrar todos los filtros">✕ Limpiar</button>
  </div>

    <span class="vsw hide" id="gbBox">Agrupar por <select id="gbSel" style="height:26px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12px"><option value="dia">Día</option><option value="eq">Equipo</option><option value="obra">Obra</option><option value="tec">Técnico</option></select>
      <button id="btnExp">Expandir todo</button><button id="btnCon">Contraer todo</button></span>

    <div class="spacer"></div>

  </div>
</div>
<div id="wrap">

  <section id="v-col" class="hide"></section>
  <section id="v-mae" class="hide"></section>
</div>
<footer id="pie">Cargando…</footer>

<script>
const CFG=(()=>{try{return JSON.parse(localStorage.getItem('gllr_sbcfg')||'null')}catch(_){return null}})();
if(!CFG||!CFG.url){document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif"><h2 style="font-size:18px">Abre primero la página principal</h2></div>';throw new Error('sin configuracion');}
const sb=window.supabase.createClient(CFG.url,CFG.key);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const nrm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const up=s=>String(s??'').toUpperCase().replace(/\s+/g,' ').trim();
const f0=n=>Number(n).toLocaleString('es-PE',{maximumFractionDigits:0});
const fd=v=>{if(!v)return'';const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:String(v);};
const isoDe=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const MODN={MECANICO:'Reporte mecánico',LUBRICACION:'Lubricación',LLANTAS:'Llantas',GETS:'GETs',MNTTO_PREV:'Mntto preventivo',PENDIENTE:'Pendiente'};
const codigoBase=(n,a)=>{const x=nrm(n).split(' ')[0]||'',y=nrm(a).replace(/[^A-Z]/g,'');return (x[0]||'')+y;};
let perfil=null, EQ=[], COL=[], MAE=[], REG=[], vista='reg', tipoSel='SISTEMA', pagina=0;
const PASO=200;
const esAdmin=()=>perfil&&perfil.rol==='admin';
const eqDe=c=>EQ.find(e=>e.cod_sap===c)||null;

/* ── pestañas ── */
document.querySelectorAll('#subnav button').forEach(b=>b.onclick=()=>irVista(b.dataset.v));
function irVista(k){vista=k;
  document.querySelectorAll('#subnav button').forEach(x=>x.classList.toggle('on',x.dataset.v===k));
  ['reg','seg','pen','col','mae'].forEach(z=>document.getElementById('v-'+z).classList.toggle('hide',z!==k));
  tbReg.classList.toggle('hide',k!=='reg'); pintar();}
function pintar(){({reg:pintarReg,seg:pintarSeg,pen:pintarPen,col:pintarCol,mae:pintarMae})[vista]();}

/* ═══════════ REGISTROS · filtros ═══════════ */
const ORIG3=['FALLA DE OPERACIÓN','TIEMPO DE SERVICIO','SIN PARADA'];
const TIPOSF=[['MEC','Mecánico'],['ELE','Eléctrico'],['SOL','Soldadura'],['LUB','Lubricación'],['LLA','Llantas'],['GET','GETs'],['PM','PM'],['PEN','Pendiente']];
const TIPOF={MEC:'and(modulo.eq.MECANICO,or(especialidad.is.null,especialidad.not.in.(ELECTRICISTA,SOLDADOR)))',ELE:'and(modulo.eq.MECANICO,especialidad.eq.ELECTRICISTA)',SOL:'and(modulo.eq.MECANICO,especialidad.eq.SOLDADOR)',
  LUB:'modulo.eq.LUBRICACION',LLA:'modulo.eq.LLANTAS',GET:'modulo.eq.GETS',PM:'modulo.eq.MNTTO_PREV',PEN:'modulo.eq.PENDIENTE'};
const MSD=[['obra','Obra'],['eq','Equipo'],['tec','Técnico'],['est','Estado'],['ori','Origen de la falla']];
const FIL={obra:new Set(),eq:new Set(),tec:new Set(),est:new Set(),ori:new Set(),tipos:new Set(),kInop:false,kPen:false,txt:''};
let CNT={inop:0,pen:0}, PER='7', VREG='tabla', GB='dia', AGMODE=null, SEC={};
const pad=n=>String(n).padStart(2,'0');
const nomC2=c=>[c.nombres,c.ap_paterno,c.ap_materno].filter(Boolean).join(' ');
function msOpts(id){
  if(id==='obra')return [...new Set(EQ.map(x=>x.cod_proyec).filter(Boolean))].sort().map(o=>({v:o,t:o}));
  if(id==='eq')return EQ.map(e=>({v:e.cod_sap,t:e.cod_sap+' · '+(e.equipo||'')}));
  if(id==='tec')return COL.filter(c=>c.activo!==false).map(c=>({v:c.codigo,t:c.codigo+' · '+nomC2(c)}));
  if(id==='est')return [{v:'OPERATIVO',t:'Operativo'},{v:'INOPERATIVO',t:'Inoperativo'}];
  return ORIG3.map(o=>({v:o,t:o}));}
function armarMS(){
  msBar.innerHTML=MSD.map(([id,l])=>`<span class="ms" data-id="${id}"><button class="act ms-b"><span>${l}</span><b class="ms-n"></b> ▾</button></span>`).join('');
  msBar.querySelectorAll('.ms-b').forEach(b=>b.onclick=ev=>{ev.stopPropagation();abrirMS(b.closest('.ms').dataset.id,b);});
  pintarFil();}
const cerrarMS=()=>{const d=document.getElementById('msp');if(d)d.remove();};

function aplicarFiltros(q,sinKpi){
  if(fDesde.value)q=q.gte('fecha',fDesde.value);if(fHasta.value)q=q.lte('fecha',fHasta.value);
  if(FIL.obra.size)q=q.in('obra',[...FIL.obra]);if(FIL.eq.size)q=q.in('cod_sap',[...FIL.eq]);
  if(FIL.tec.size)q=q.overlaps('tecnicos',[...FIL.tec]);
  if(FIL.est.size)q=q.in('estado_equipo',[...FIL.est]);if(FIL.ori.size)q=q.in('origen_falla',[...FIL.ori]);
  if(FIL.tipos.size)q=q.or([...FIL.tipos].map(k=>TIPOF[k]).join(','));
  const t=FIL.txt.replace(/[,()*%\\]/g,' ').trim();
  if(t)q=q.or(['cod_sap','descripcion','trabajo','sistema','componente','observacion'].map(c=>`${c}.ilike.*${t}*`).join(','));
  if(!sinKpi){if(FIL.kInop)q=q.eq('estado_equipo','INOPERATIVO');
    if(FIL.kPen)q=q.not('backlog','is',null).or('backlog_estado.is.null,backlog_estado.neq.CERRADO');}
  return q;}

  let L=[];for(let d=0;;d+=1000){let q=sb.from('pdm_registros').select('fecha,tecnicos,obra').eq('anulado',false).gte('fecha',dias[0]).lte('fecha',hoy);if(SEG.obra)q=q.eq('obra',SEG.obra);

  T.sort((a,b)=>String(a.cod).localeCompare(String(b.cod)));

  const cab=dias.map(d=>{const dt=new Date(d+'T12:00:00');return `<th class="${dt.getDay()===0?'dom':''} ${d===hoy?'hoy':''}">${d.slice(8)}<small>${SEGD[dt.getDay()]}</small></th>`;}).join('');
  const filas=T.map(t=>{const m=M[t.cod]||{};let tot=0;
    const c=dias.map(d=>{const k=m[d]||0;tot+=k;return k?`<td class="n" data-t="${esc(t.cod)}" data-d="${d}">${k}</td>`:`<td class="x">X</td>`;}).join('');

/* paradas (horas inoperativas) ligadas a los registros: la que abre (INOPERATIVO) y la que cierra (vuelve a OPERATIVO) */
let PARX={};
async function mapaParadas(ids){const M={};if(!ids.length)return M;
  try{const L=[];for(let i=0;i<ids.length;i+=100){const lote=ids.slice(i,i+100).join(',');
      const {data,error}=await sb.from('pdm_paradas').select('*').or(`reg_inicio.in.(${lote}),reg_fin.in.(${lote})`).eq('anulado',false);if(error)return M;L.push(...(data||[]));}
    L.forEach(p=>{if(p.reg_inicio)M[p.reg_inicio]={p,rol:'abre'};if(p.reg_fin)M[p.reg_fin]={p,rol:'cierra'};});}catch(_){}
  return M;}
async function cargarParadas(){PARX=await mapaParadas(REG.map(r=>r.id));}
const fhP=iso=>{const d=new Date(iso);return isNaN(d)?'':`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const f1=n=>Number(n).toLocaleString('es-PE',{maximumFractionDigits:1});
function parTxt(r){const x=PARX[r.id];if(!x)return '';const p=x.p;
  if(x.rol==='abre')return p.fin?`<div class="parw">⛔ parada hasta ${fhP(p.fin)} · <b>${f1(p.horas)} h</b></div>`:`<div class="parw ab">⛔ parada abierta desde ${fhP(p.inicio)}</div>`;
  return `<div class="parw ok">✓ cierra parada del ${fhP(p.inicio)} · <b>${f1(p.horas)} h</b></div>`;}
function parDet(r){const x=PARX[r.id];if(!x)return '';const p=x.p;
  return `<b>Parada</b><span>${fhP(p.inicio)} → ${p.fin?fhP(p.fin):'<b style="color:#B91C1C">abierta</b>'}${p.horas!=null?` · <b>${f1(p.horas)} h inoperativas</b>`:''} · ${esc(p.turnos||'')}<br>

        if($m('mcU')&&$m('mcU').value){const r=await sb.rpc('pdm_admin_vincular',{uid:$m('mcU').value,p_codigo:c.codigo});if(r.error)throw r.error;await habilitarApp($m('mcU').value);}}
      else{let uid=u?u.id:null;
        const codAcc=modo==='acceso'?c.codigo:(d?codigoNuevo(d.nombres,d.ap_paterno,d.ap_materno):null);
        const mail=email||(codAcc?codAcc.toLowerCase()+DOM_INT:'');
        if(quiereAcc)uid=await crearCuenta(mail,clave,d?[d.nombres,d.ap_paterno,d.ap_materno].filter(Boolean).join(' '):nomC(c),d||c);
        if(modo==='acceso'){const r=await sb.rpc('pdm_admin_vincular',{uid,p_codigo:c.codigo});if(r.error)throw r.error;}
        else{const fila={...d,codigo:codigoNuevo(d.nombres,d.ap_paterno,d.ap_materno),user_id:uid||null};const {error}=await sb.from('pdm_colaboradores').insert(fila);if(error)throw error;
          if(modo==='codigo'&&u&&estU(u)==='act')await habilitarApp(u.id);
          if(quiereAcc)alert(`Listo: ${fila.codigo} creado con acceso a la app.\n\nDíctale al colaborador:\n${email?'Correo: '+email:'Código: '+fila.codigo}\nClave: ${clave}`);}
        if(modo==='acceso')alert(`Listo: ${c.codigo} ya tiene acceso a la app.\n\nDíctale al colaborador:\n${email?'Correo: '+email:'Código: '+c.codigo}\nClave: ${clave}`);}
      m.remove();await recargarCol();
    }catch(e){const msg=e.message||String(e);alert('No se pudo guardar: '+msg+(/rate limit/i.test(msg)?'\n\nSupabase limita los correos de confirmación. Desactiva "Confirm email" en Authentication → Sign In / Providers → Email.':''));ok.disabled=false;ok.textContent='Guardar';}};
  setTimeout(()=>{const f=m.querySelector('.fld');if(f)f.focus();},50);}
/* crea la cuenta sin cerrar la sesión del administrador; queda aprobada y con la app habilitada */
async function crearCuenta(email,clave,nombre,d){
  const sb2=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'pdm_alta_tmp'}});
  const {data,error}=await sb2.auth.signUp({email,password:clave,options:{data:{nombre,nombres:d.nombres,ap_paterno:d.ap_paterno,ap_materno:d.ap_materno,origen:'web-admin'}}});
  if(error)throw error;const uid=data.user&&data.user.id;
  if(!uid||(data.user.identities&&data.user.identities.length===0))throw new Error('Ese correo ya tiene una cuenta. Búscalo en la tabla y usa "Asignar código".');
  await new Promise(r=>setTimeout(r,800));
  const r=await sb.rpc('pdm_admin_aprobar',{uid,p_nombre:nombre});if(r.error)throw r.error;await habilitarApp(uid);return uid;}

/* ═══════════ DATOS MAESTROS ═══════════ */
const TIPOS=[['ESPECIALIDAD','Especialidades'],['SISTEMA','Sistemas (por especialidad)'],['TRABAJO','Trabajos (por especialidad)'],['REPUESTO','Repuestos (por especialidad)'],['INSUMO','Insumos (lubricación / PM)'],
  ['UNIDAD','Unidades de medida'],['TRABAJO_LUB','Trabajos de lubricación'],['PUNTO_LUB','Puntos de lubricación'],['GET','Componentes GET (por tipo de equipo)'],['PM','Tipos de PM'],
  ['TAREA_PM','Tareas de PM'],['ORIGEN','Origen de falla'],['PARADA','Tipo de parada'],['FRENTE','Frentes de trabajo'],['MARCA_LLANTA','Marcas de llanta'],['IMPLEMENTO','Implementos (ya no se usa en GETs)']];
const FAMS=[['EX','Excavadora de oruga'],['CF','Cargador frontal'],['TO','Tractor de oruga'],['MN','Motoniveladora'],['PR','Retroexcavadora'],['MC','Minicargador']];
const UNDS=['','UND','GAL','L','LB','KG','KIT','M','JGO'];
/* columnas de cada lista: k=campo, l=título, t=tipo de control */
function colsDe(t){const C=[];
  if(['SISTEMA','TRABAJO','REPUESTO'].includes(t))C.push({k:'especialidad',l:'Especialidad',t:'esp'});
  if(t==='GET')C.push({k:'familia',l:'Familia',t:'fam'},{k:'grupo',l:'Grupo GET',t:'txt'},{k:'aplicacion',l:'Aplicación',t:'txt'});
  C.push({k:'valor',l:t==='GET'?'Componente':'Valor',t:'txt'});
  if(['REPUESTO','INSUMO','GET'].includes(t))C.push({k:'unidad',l:'Unidad',t:'und'});
  C.push({k:'orden',l:'Orden',t:'num'});return C;}
let famSel='';
function ctl(c,m,id){const v=m?m[c.k]:'';const at=id?`data-m="${m.id}" data-k="${c.k}"`:`id="nm_${c.k}"`;
  if(c.t==='esp')return `<select ${at}><option value="">TODAS</option>${ESPS.filter(x=>['MECANICO','SOLDADOR','ELECTRICISTA'].includes(x)).map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
  if(c.t==='fam')return `<select ${at}>${FAMS.map(([k,l])=>`<option value="${k}" ${k===(v||famSel)?'selected':''}>${k} · ${l}</option>`).join('')}</select>`;
  if(c.t==='und')return `<select ${at}>${UNDS.map(u=>`<option ${u===(v||(id?'':'UND'))?'selected':''}>${u}</option>`).join('')}</select>`;
  if(c.t==='num')return `<input type="number" ${at} value="${esc(v??'')}" style="width:70px">`;
  return `<input ${at} value="${esc(v||'')}" style="${c.k==='aplicacion'?'':'text-transform:uppercase'}">`;}
function pintarMae(){const v=document.getElementById('v-mae'),ad=esAdmin(),C=colsDe(tipoSel);
  let L=MAE.filter(m=>m.tipo===tipoSel);if(tipoSel==='GET'&&famSel)L=L.filter(m=>m.familia===famSel);
  L.sort((a,b)=>(a.familia||'').localeCompare(b.familia||'')||(a.especialidad||'').localeCompare(b.especialidad||'')||(a.orden||0)-(b.orden||0));
  const tit=(TIPOS.find(t=>t[0]===tipoSel)||[0,tipoSel])[1];
  v.innerHTML=`<div class="grid2"><div class="card tipos"><span class="bnd">LISTAS DE LA APP</span>${TIPOS.map(([k,l])=>`<div class="${k===tipoSel?'on':''}" data-t="${k}"><span>${l}</span><span class="dim">${MAE.filter(m=>m.tipo===k&&m.activo!==false).length}</span></div>`).join('')}</div>
   <div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><span class="bnd" style="margin:0">${esc(tit).toUpperCase()} · ${L.length}</span>
     ${tipoSel==='GET'?`<select id="famF" style="border:1px solid var(--line);border-radius:9px;height:30px;padding:0 8px"><option value="">Todas las familias</option>${FAMS.map(([k,l])=>`<option value="${k}" ${k===famSel?'selected':''}>${k} · ${l}</option>`).join('')}</select>`:''}
     <span class="spacer"></span><button class="act sm util" id="maeXls">⬇ Excel</button>${ad?`<label class="act sm util" style="cursor:pointer">⬆ Importar Excel<input type="file" id="maeImp" accept=".xlsx,.xls,.csv" style="display:none"></label>`:''}</div>
   <div class="dim" style="font-size:12px;margin-bottom:6px">La app descarga estas listas y las guarda en el celular (funcionan sin señal). Edita una celda y se guarda al salir de ella. Un valor <b>desactivado</b> deja de aparecer en la app, pero se conserva en los registros antiguos.${tipoSel==='GET'?' En la app, cada equipo ve solo los GETs de su <b>familia</b> (letras 2 y 3 del código: EEX040 → EX).':''}${ad?'':' Solo un administrador puede editarlas.'}</div>
   <div style="overflow:auto"><table class="t"><thead><tr>${C.map(c=>`<th${c.t==='num'?' class="c"':''}>${c.l}</th>`).join('')}<th class="c">Activo</th>${ad?'<th></th>':''}</tr></thead>
   <tbody>${L.map(m=>`<tr>${C.map(c=>`<td${c.t==='num'?' class="c"':''}>${ad?ctl(c,m,true):esc(c.t==='fam'?(m[c.k]||''):(m[c.k]??''))}</td>`).join('')}
     <td class="c">${ad?`<input type="checkbox" data-ma="${m.id}" ${m.activo!==false?'checked':''} style="width:auto;height:auto">`:(m.activo!==false?'✓':'—')}</td>
     ${ad?`<td class="c"><button class="act sm rojo" data-mx="${m.id}" title="Eliminar">✕</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${C.length+2}" class="vacio">Sin valores.</td></tr>`}</tbody></table></div>
   ${ad?`<div class="agr">${C.map(c=>`<label>${c.l}${c.k==='orden'?`<input type="number" id="nm_orden" style="width:70px" value="${Math.max(0,...L.map(m=>m.orden||0))+1}">`:ctl(c,null,false)}</label>`).join('')}<button class="act primary" id="nmOk">+ Agregar</button></div>`:''}</div></div>`;
  v.querySelectorAll('[data-t]').forEach(d=>d.onclick=()=>{tipoSel=d.dataset.t;pintarMae();});
  const ff=document.getElementById('famF');if(ff)ff.onchange=()=>{famSel=ff.value;pintarMae();};
  document.getElementById('maeXls').onclick=()=>exportarMae(L,C,tit);
  if(!ad)return;
  document.getElementById('maeImp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importarMae(f,C);};
  v.querySelectorAll('[data-m]').forEach(i=>i.onchange=async()=>{const k=i.dataset.k;let val=k==='orden'?(+i.value||0):(k==='aplicacion'?(i.value.trim()||null):(up(i.value)||null));
    const {error}=await sb.from('pdm_maestros').update({[k]:val}).eq('id',i.dataset.m);if(error)return alert('No se pudo guardar: '+error.message);const m=MAE.find(x=>String(x.id)===i.dataset.m);m[k]=val;i.style.background='#DCF5E3';setTimeout(()=>i.style.background='',700);});
  v.querySelectorAll('[data-ma]').forEach(i=>i.onchange=async()=>{const {error}=await sb.from('pdm_maestros').update({activo:i.checked}).eq('id',i.dataset.ma);if(error)return alert(error.message);MAE.find(x=>String(x.id)===i.dataset.ma).activo=i.checked;pintarMae();});
  v.querySelectorAll('[data-mx]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este valor?\n\nSi ya se usó en registros, mejor desactívalo.'))return;const {error}=await sb.from('pdm_maestros').delete().eq('id',b.dataset.mx);if(error)return alert(error.message);MAE=MAE.filter(x=>String(x.id)!==b.dataset.mx);pintarMae();});
  document.getElementById('nmOk').onclick=async()=>{const fila={tipo:tipoSel};
    for(const c of C){const el=document.getElementById('nm_'+c.k);if(!el)continue;fila[c.k]=c.t==='num'?(+el.value||0):(c.k==='aplicacion'?(el.value.trim()||null):(up(el.value)||null));}
    if(!fila.valor)return alert('Escribe el '+(tipoSel==='GET'?'componente':'valor')+'.');
    const {data,error}=await sb.from('pdm_maestros').insert(fila).select().single();if(error)return alert(/duplicate|unique/i.test(error.message)?'Ese valor ya existe en la lista.':error.message);MAE.push(data);pintarMae();};}
function exportarMae(L,C,tit){if(!window.XLSX)return alert('No se cargó la librería de Excel.');
  const filas=L.map(m=>{const o={ID:m.id};C.forEach(c=>o[c.l]=m[c.k]??'');o.Activo=m.activo!==false?'SI':'NO';return o;});
  const ws=XLSX.utils.json_to_sheet(filas.length?filas:[Object.fromEntries([['ID',''],...C.map(c=>[c.l,'']),['Activo','SI']])]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,tipoSel.slice(0,30));
  XLSX.writeFile(wb,`lista_${tipoSel.toLowerCase()}.xlsx`);}
async function importarMae(f,C){if(!window.XLSX)return alert('No se cargó la librería de Excel.');
  const wb=XLSX.read(await f.arrayBuffer());const R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const norm=x=>nrm(x).replace(/[^A-Z]/g,'');const map={};C.forEach(c=>map[norm(c.l)]=c);map[norm('Valor')]=C.find(c=>c.k==='valor');map[norm('Componente')]=C.find(c=>c.k==='valor');map[norm('Clave')]=C.find(c=>c.k==='familia');
  const nuevos=[],cambios=[];
  R.forEach(row=>{const o={tipo:tipoSel};let id=null,act=true;
    Object.entries(row).forEach(([h,val])=>{const n=norm(h);if(n==='ID'){id=val||null;return;}if(n==='ACTIVO'){act=!/^(NO|0|FALSE)$/i.test(String(val).trim());return;}
      const c=map[n];if(!c)return;o[c.k]=c.t==='num'?(+val||0):(c.k==='aplicacion'?(String(val).trim()||null):(up(val)||null));});
    if(!o.valor)return;o.activo=act;if(id)cambios.push({id,...o});else nuevos.push(o);});
  if(!nuevos.length&&!cambios.length)return alert('No encontré filas. La primera fila del Excel debe tener los títulos: '+C.map(c=>c.l).join(', ')+'.');
  if(!confirm(`Importar a "${tipoSel}":\n\n• ${nuevos.length} valores nuevos\n• ${cambios.length} valores a actualizar (los que traen ID)\n\n¿Continuar?`))return;
  let err=[];
  for(const x of cambios){const {id,...o}=x;const {error}=await sb.from('pdm_maestros').update(o).eq('id',id);if(error)err.push(error.message);}
  if(nuevos.length){const {error}=await sb.from('pdm_maestros').upsert(nuevos,{onConflict:'tipo,especialidad,familia,grupo,aplicacion,valor',ignoreDuplicates:true});
    if(error){for(const o of nuevos){const r=await sb.from('pdm_maestros').insert(o);if(r.error&&!/duplicate|unique/i.test(r.error.message))err.push(r.error.message);}}}
  const {data}=await sb.from('pdm_maestros').select('*');if(data)MAE=data;pintarMae();
  alert(err.length?`Importado con ${err.length} error(es):\n${[...new Set(err)].slice(0,3).join('\n')}`:'✓ Lista importada.');}

/* ═══════════ INICIO ═══════════ */
async function cargarListas(){const [e,c,m]=await Promise.all([sb.from('maestro').select('cod_sap,equipo,modelo,cod_proyec,marca,serie_placa,familia').order('cod_sap'),
    sb.from('pdm_colaboradores').select('*').order('ap_paterno'),sb.from('pdm_maestros').select('*')]);
  EQ=e.data||[];COL=c.data||[];MAE=m.data||[];
  {const L=MAE.filter(x=>x.tipo==='ESPECIALIDAD'&&x.activo!==false).sort((a,b)=>(a.orden??999)-(b.orden??999)).map(x=>x.valor);if(L.length)ESPS=L;}
  armarMS();}
