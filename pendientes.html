<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pendientes — UDE</title>
<link rel="icon" href="favicon.ico">
<script src="supabase.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FAFAF8;color:#16191D;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px}
  header{background:#1c232b;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px}
  header h1{font-size:15px;font-weight:700}
  header p{font-size:10px;color:#9aa4ad;text-transform:uppercase;letter-spacing:1px;margin-top:1px}
  header .sp{flex:1}
  header .who{font-size:12px;color:#cdd4da}
  header button{background:#12161B;color:#fff;border:1px solid #2A323C;border-radius:8px;
    padding:7px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  header button:hover{background:#1D232B}
  .wrap{max-width:1100px;margin:40px auto;padding:0 20px;text-align:center}
  .wrap h2{font-size:16px;color:#6E757C;font-weight:600;margin-bottom:8px}
  .wrap p{font-size:12.5px;color:#98A2AD}
</style>
</head>
<body>
<header>
  <div><h1>Pendientes — UDE</h1><p>Unidad de Equipos · UDE · 260917-2</p></div>
  <div class="sp"></div>
  <span class="who" id="who"></span>
  <button id="volverBtn">← Equipos</button>
</header>

<div class="wrap">
  <h2>Pestaña en construcción</h2>
  <p>Todavía no tiene contenido — lista para el próximo requerimiento.</p>
</div>

<script>
const CFG=(()=>{try{return JSON.parse(localStorage.getItem('gllr_sbcfg')||'null')}catch(_){return null}})();
if(!CFG||!CFG.url){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif">'
   +'<h2 style="font-size:18px;margin-bottom:10px">Abre primero la p&aacute;gina principal</h2>'
   +'<p style="color:#6b747d">Esta pesta&ntilde;a toma la conexi&oacute;n y la sesi&oacute;n desde el Maestro de Equipos.<br>Ingresa ah&iacute; y vuelve a pulsar Pendientes.</p></div>';
  throw new Error('sin configuracion');
}
if(!window.supabase){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:-apple-system,sans-serif">'
    +'<h2 style="font-size:18px;margin-bottom:10px">No se pudo cargar un componente necesario</h2>'
    +'<p style="color:#6b747d;max-width:420px;margin:0 auto 16px">Revisa tu conexión a internet e inténtalo de nuevo. '
    +'Si el problema sigue, puede ser un corte temporal de un servicio externo — prueba en unos minutos.</p>'
    +'<button onclick="location.reload()" style="background:#FFCD11;border:none;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer">Reintentar</button></div>';
  throw new Error('window.supabase no disponible');
}
const sb=window.supabase.createClient(CFG.url,CFG.key);
let perfil=null;

// ---- Volver a Equipos sin recargar ----
let winEquipos=null;
function volverAEquipos(){
  if(window.opener && !window.opener.closed){ try{window.opener.focus();return;}catch(_){} }
  if(winEquipos && !winEquipos.closed){ winEquipos.focus(); }
  else{ winEquipos=window.open('index.html','gllr_index'); }
}
document.getElementById('volverBtn').onclick=volverAEquipos;

(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif"><h2 style="font-size:18px">Sesión no iniciada</h2><p style="color:#6b747d">Ingresa en la página principal.</p></div>';return;}
  const {data:p}=await sb.from('profiles').select('id,nombre,rol,estado,paginas').eq('id',session.user.id).single();
  perfil=p||{};
  who.textContent=(perfil.nombre||session.user.email)+' · '+(perfil.rol||'');
  if('BroadcastChannel' in window){
    const chYo=new BroadcastChannel('gllr_pendientes');
    chYo.onmessage=ev=>{ if(ev.data&&ev.data.tipo==='ping'){ chYo.postMessage({tipo:'pong'}); try{window.focus();}catch(_){} } };
  }
  if(perfil.estado!=='aprobado'||(perfil.rol!=='admin'&&!(Array.isArray(perfil.paginas)&&perfil.paginas.includes('pendientes')))){
    document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif">'
     +'<h2 style="font-size:18px;margin-bottom:10px">Sin acceso a Pendientes</h2>'
     +'<p style="color:#6b747d">Un administrador debe habilitarte esta pestaña desde Usuarios.</p></div>';return;}
})();
</script>
</body>
</html>
