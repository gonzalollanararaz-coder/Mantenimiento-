<style>

  table.t.tc th.c,table.t.tc td.c{text-align:center}

  .tt{position:fixed;pointer-events:none;background:#1c232b;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;display:none;z-index:99;line-height:1.5;max-width:320px}
  .formula{background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.75}

    <div class="grupo filtros">

<script>
const CFG=(()=>{try{return JSON.parse(localStorage.getItem('gllr_sbcfg')||'null')}catch(_){return null}})();
if(!CFG||!CFG.url){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif"><h2 style="font-size:18px;margin-bottom:10px">Abre primero la p&aacute;gina principal</h2>'
   +'<p style="color:#6b747d">Esta pesta&ntilde;a toma la conexi&oacute;n y la sesi&oacute;n desde el Maestro de Equipos.</p></div>';
  throw new Error('sin configuracion');
}
if(!window.supabase){
  document.body.innerHTML='<div style="padding:60px;text-align:center;font-family:sans-serif"><h2 style="font-size:18px;margin-bottom:10px">No se pudo cargar un componente necesario</h2>'
    +'<button onclick="location.reload()" style="background:#FFCD11;border:none;border-radius:9px;padding:10px 20px;font-weight:700;cursor:pointer">Reintentar</button></div>';
  throw new Error('window.supabase no disponible');
}
const sb=window.supabase.createClient(CFG.url,CFG.key);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const nrm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const f0=n=>Number(n).toLocaleString('es-PE',{maximumFractionDigits:0});
const f1=n=>Number(n).toLocaleString('es-PE',{minimumFractionDigits:1,maximumFractionDigits:1});
const f2=n=>Number(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const isoDe=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};
const fmtDate=v=>{if(!v)return'';const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:String(v);};
const hoy0=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const nmd=s=>nrm(s).replace(/\s+/g,'');   // medidas: '325/95 R24' = '325/95R24'
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];

let perfil=null, datos=[], INSP=[], PMAR=[], PMED=[], PPRE=[], PAR={}, LL=[], VIDAS=[], vista='res';
const esAdmin=()=>perfil&&perfil.rol==='admin';
const eqDe=sap=>datos.find(e=>nrm(e.cod_sap)===nrm(sap))||null;

/* ═════════════ MOTOR DE CÁLCULO ═════════════
   Cada fila de inspección = una llanta en una posición en una fecha.
   · Si la fila trae SERIE / N° de fuego, la llanta se sigue por su serie (aunque la roten de posición o de equipo).
   · Si no trae serie, se sigue por equipo + posición, y se detecta un cambio de llanta cuando la cocada SUBE más de 2 mm.
   Rendimiento (h/mm) = horas trabajadas ÷ mm gastados entre la primera y la última medición de esa llanta.
   Mientras no haya al menos 1 mm de desgaste medido, se usa el h/mm de referencia de su marca y medida. */
function paramMarca(marca,medida){
  return PMAR.find(p=>nrm(p.marca)===nrm(marca)&&nmd(p.medida)===nmd(medida))
      || PMAR.find(p=>nrm(p.marca)===nrm(marca)&&!p.medida) || null;
}
function retiroDe(medida){ const p=PMED.find(x=>nmd(x.medida)===nmd(medida)); return p&&p.retiro_mm!=null?+p.retiro_mm:(+PAR.retiro_mm_def||8); }
function presionDe(e,medida){
  const nom=nrm(e&&e.equipo);
  const c=PPRE.filter(p=>nmd(p.medida)===nmd(medida)&&(!p.tipo_equipo||nom.includes(nrm(p.tipo_equipo))));
  c.sort((a,b)=>(b.tipo_equipo?1:0)-(a.tipo_equipo?1:0));
  return c[0]||null;
}
/* posiciones direccionales (simples) y duales, según cuántas posiciones tiene el equipo */
function esquema(n){
  const ejes=[]; let p=1;
  const steer=n<=4?n:(n%4===0?4:2);
  for(let i=0;i<steer;i+=2){ejes.push([p,p+1]);p+=2;}
  while(p<=n){ const t=Math.min(4,n-p+1); ejes.push(Array.from({length:t},(_,i)=>p+i)); p+=t; }
  const duales=[]; ejes.forEach(e=>{ if(e.length===4){duales.push([e[0],e[1]],[e[2],e[3]]);} });
  return {ejes,duales};
}
/* Contador de cada equipo: 'km' si en el Maestro es Km (o si sus inspecciones solo traen kilometraje); si no, 'h'. */
const UNI_CACHE=new Map();
function uniDe(sap){
  const k=nrm(sap); if(UNI_CACHE.has(k))return UNI_CACHE.get(k);
  const e=eqDe(sap); let u;
  if(e&&/^km/i.test(String(e.contador||'')))u='km';
  else if(e&&/^h/i.test(String(e.contador||'')))u='h';
  else{ const R=INSP.filter(r=>nrm(r.cod_sap)===k); u=(!R.some(r=>r.horometro!=null)&&R.some(r=>r.km!=null))?'km':'h'; }
  UNI_CACHE.set(k,u); return u;
}
const cntDe=(r,u)=>{const v=u==='km'?r.km:r.horometro; return v==null||v===''?null:+v;};
const UL=u=>u==='km'?{c:'Km',pm:'km/mm',q:'Le quedan (km)',usd:'USD/km',dia:'KM/día',u:'km'}:{c:'Horas',pm:'h/mm',q:'Le quedan (h)',usd:'USD/h',dia:'HR/día',u:'h'};
function hrDiaDe(sap){
  const e=eqDe(sap); if(e&&+e.hr_dia>0)return +e.hr_dia;
  const u=uniDe(sap);
  const R=INSP.filter(r=>nrm(r.cod_sap)===nrm(sap)&&cntDe(r,u)!=null).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(R.length<2)return null;
  const a=R[0],b=R[R.length-1], d=(new Date(b.fecha)-new Date(a.fecha))/86400000, va=cntDe(a,u), vb=cntDe(b,u);
  return d>=7&&vb>va?(vb-va)/d:null;
}
function calcular(){
  const H=hoy0(), rojo=+PAR.dias_rojo||30, amar=+PAR.dias_amarillo||60;
  // 1) agrupar por llanta (serie o equipo+posición) y partir en "vidas"
  UNI_CACHE.clear();
  const porLlanta=new Map();
  INSP.forEach(r=>{ const k=r.serie?'S:'+nrm(r.serie):'P:'+nrm(r.cod_sap)+'#'+r.posicion;
    if(!porLlanta.has(k))porLlanta.set(k,[]); porLlanta.get(k).push(r); });
  VIDAS=[];
  porLlanta.forEach((rows,k)=>{
    rows.sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.horometro||a.km||0)-(b.horometro||b.km||0));
    let v=null;
    rows.forEach(r=>{
      const nueva=!v || (r.cocada!=null&&v.ult.cocada!=null&&r.cocada>v.ult.cocada+2);
      if(nueva){ v={k,porSerie:k.startsWith('S:'),rows:[],ini:r}; VIDAS.push(v); }
      v.rows.push(r); v.ult=r;
    });
  });
  VIDAS.forEach(v=>{
    const a=v.ini, b=v.ult;
    v.marca=b.marca||a.marca||''; v.medida=b.medida||a.medida||''; v.serie=b.serie||a.serie||'';
    v.desg=(a.cocada!=null&&b.cocada!=null)?a.cocada-b.cocada:null;
    v.u=uniDe(b.cod_sap); const ca=cntDe(a,v.u), cb=cntDe(b,v.u);
    v.hrs=(ca!=null&&cb!=null)?cb-ca:null;
    v.rendReal=(v.desg>=1&&v.hrs>0)?v.hrs/v.desg:null;
  });
  // promedios reales por marca+medida y por medida (para llantas aún sin desgaste medible)
  const prom=f=>{const L=VIDAS.filter(f).map(v=>v.rendReal).filter(x=>x);return L.length?L.reduce((a,x)=>a+x,0)/L.length:null;};
  // 2) llanta actual en cada equipo + posición = la de la última inspección de ese equipo
  LL=[];
  const saps=[...new Set(INSP.map(r=>nrm(r.cod_sap)))];
  saps.forEach(sap=>{
    const R=INSP.filter(r=>nrm(r.cod_sap)===sap);
    const ultF=R.reduce((m,r)=>r.fecha>m?r.fecha:m,'');
    R.filter(r=>r.fecha===ultF).forEach(r=>{
      const v=VIDAS.find(x=>x.rows.includes(r)); if(!v)return;
      const e=eqDe(r.cod_sap), pm=paramMarca(v.marca,v.medida), ret=retiroDe(v.medida);
      let rend=v.rendReal, fuente='real';
      if(!rend){ rend=(v.u==='h'&&pm&&+pm.hmm_ref)||prom(x=>x.u===v.u&&nrm(x.marca)===nrm(v.marca)&&nmd(x.medida)===nmd(v.medida))||prom(x=>x.u===v.u&&nmd(x.medida)===nmd(v.medida)); fuente=rend?'ref':'na'; }
      const nueva=pm&&+pm.cocada_nueva?+pm.cocada_nueva:v.ini.cocada;
      const coc=r.cocada, hd=hrDiaDe(r.cod_sap);
      const rest=rend&&coc!=null?Math.max(0,(coc-ret)*rend):null;
      let fRet=null,dias=null;
      if(rest!=null&&hd){ fRet=new Date(new Date(r.fecha+'T00:00:00').getTime()+rest/hd*86400000); dias=Math.round((fRet-H)/86400000); }
      const vida=rend&&nueva!=null?(nueva-ret)*rend:null;
      const precio=pm&&+pm.precio?+pm.precio:null;
      const rep=v.rows.reduce((s,x)=>s+(+x.reparacion_usd||0),0);
      const usd=precio&&vida>0?(precio+rep)/vida:null;
      let est;
      if(coc!=null&&coc<=ret)est='bad';
      else if(dias!=null)est=dias<rojo?'bad':(dias<=amar?'warn':'ok');
      else est=coc!=null&&coc<=ret+2?'warn':'na';
      let pres=null;
      if(PAR.presion_activa&&r.presion!=null){ const pp=presionDe(e,v.medida);
        if(pp){ pres={obj:pp.presion_obj,min:pp.presion_min,max:pp.presion_max,
          est:(pp.presion_min!=null&&r.presion<pp.presion_min)?'baja':((pp.presion_max!=null&&r.presion>pp.presion_max)?'alta':'ok')}; } }
      LL.push({sap:r.cod_sap,e,u:v.u,obra:(e&&e.cod_proyec)||r.obra||'',pos:+r.posicion,serie:v.serie,porSerie:v.porSerie,marca:v.marca,medida:v.medida,
        ini:v.ini.cocada,nueva,coc,ret,hrs:v.hrs,rend,fuente,rest,dias,fRet,vida,precio,usd,est,presion:r.presion,pres,fecha:r.fecha,hr:r.horometro,obs:r.observacion,v});
    });
  });
}

/* ═════════════ FILTROS ═════════════ */

  return LL.filter(l=>(!o||l.obra===o)&&(!m||nmd(l.medida)===nmd(m))
    &&(!q||nrm(`${l.sap} ${l.e?l.e.equipo:''} ${l.serie} ${l.marca} ${l.medida}`).includes(q)));
}

const avg=(L,k)=>{const x=L.map(l=>l[k]).filter(v=>v!=null&&isFinite(v));return x.length?x.reduce((a,b)=>a+b,0)/x.length:null;};

function diagEq(E){
  const e=E[0].e, nP=Math.max(...E.map(l=>l.pos)), sap=E[0].sap;

    const t=`Pos ${l.pos} · ${l.marca||'—'}${l.serie?' · serie '+l.serie:''}\nCocada ${l.coc!=null?f1(l.coc):'—'} mm (retiro ${l.ret} mm)\n${l.rend?f0(l.rend)+' '+UL(l.u).pm+(l.fuente==='ref'?' (referencia)':''):'sin rendimiento'}${l.rest!=null?'\nLe quedan ~'+f0(l.rest)+' '+UL(l.u).u:''}${l.fRet?' · retiro '+fmtDate(isoDe(l.fRet)):''}${l.presion!=null?'\nPresión '+l.presion+' psi':''}`;
    return `<div class="neu n-${l.est} hit" data-t="${esc(t)}">${l.coc!=null?f1(l.coc):'—'}<small>P${l.pos}</small></div>`;};
  const conD=E.filter(l=>l.dias!=null), pe=conD.length?conD.reduce((a,l)=>l.dias<a.dias?l:a,conD[0]):null;
  return `<div class="eq"><h4>${esc(sap)}<span>${esc(e?e.equipo:'')}<br>${esc([...new Set(E.map(l=>l.medida))].join(' · '))}</span></h4>
    <div class="chasis">${esquema(nP).ejes.map(x=>{const h=Math.ceil(x.length/2);return `<div class="eje"><div class="lado">${x.slice(0,h).map(nn).join('')}</div><div class="lado">${x.slice(h).map(nn).join('')}</div></div>`;}).join('')}</div>
    <div style="font-size:11.5px;color:var(--muted);text-align:center">Última inspección ${fmtDate(E[0].fecha)}${pe?` · próximo cambio: <b style="color:#333">pos ${pe.pos}</b> (${fmtDate(isoDe(pe.fRet))})`:''}</div></div>`;
}
const LEYEQ=`<div class="ley"><span><i style="background:#16A34A"></i>Bien</span><span><i style="background:#E0B000"></i>Ir pidiendo</span>
    <span><i style="background:#DC2626"></i>Cambiar ya</span><span><i style="background:#9aa4ad"></i>Sin datos</span><span>· el número es la cocada (mm) · pasa el mouse para ver el detalle</span></div>`;

/* ═════════════ VISTA: COMPARAR MARCAS ═════════════ */
function marcasStats(vidas){
  const g=new Map();
  vidas.forEach(v=>{ if(!v.marca)return; const k=nrm(v.marca)+'|'+nmd(v.medida)+'|'+v.u;
    if(!g.has(k))g.set(k,{marca:v.marca,medida:v.medida,u:v.u,vidas:[]}); g.get(k).vidas.push(v); });
  return [...g.values()].map(x=>{
    const R=x.vidas.map(v=>v.rendReal).filter(Boolean), pm=paramMarca(x.marca,x.medida), ret=retiroDe(x.medida);
    const hmm=R.length?R.reduce((a,b)=>a+b,0)/R.length:(x.u==='h'&&pm&&+pm.hmm_ref)||null;
    const nueva=pm&&+pm.cocada_nueva?+pm.cocada_nueva:null;
    const vida=hmm&&nueva?(nueva-ret)*hmm:null, precio=pm&&+pm.precio?+pm.precio:null;
    return {...x,n:x.vidas.length,nReal:R.length,hmm,vida,precio,nueva,usd:precio&&vida?precio/vida:null};
  });
}
function pintarMar(){
  const m=fMedida.value, o=fObra.value;
  const vid=VIDAS.filter(v=>(!m||nmd(v.medida)===nmd(m))&&(!o||((eqDe(v.ult.cod_sap)||{}).cod_proyec===o)));
  const S=marcasStats(vid);
  const barras=(key,fmt,menor)=>{const D=S.filter(x=>x[key]).sort((a,b)=>menor?a[key]-b[key]:b[key]-a[key]); if(!D.length)return '<div class="vacio">Sin datos.</div>';
    const mxU={}; D.forEach(d=>mxU[d.u]=Math.max(mxU[d.u]||0,d[key]));
    return D.map((d,i)=>`<div style="display:grid;grid-template-columns:150px 1fr 80px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px">

}

/* ═════════════ VISTA: INSPECCIONES (datos cargados) ═════════════ */
function pintarIns(){
  const o=fObra.value, q=nrm(fBusca.value), m=fMedida.value;
  const R=INSP.filter(r=>{const e=eqDe(r.cod_sap);
    return (!o||(e&&e.cod_proyec===o))&&(!m||nmd(r.medida)===nmd(m))&&(!q||nrm(`${r.cod_sap} ${e?e.equipo:''} ${r.serie||''} ${r.marca||''}`).includes(q));})
    .sort((a,b)=>b.fecha.localeCompare(a.fecha)||a.cod_sap.localeCompare(b.cod_sap)||a.posicion-b.posicion);
  const ad=esAdmin();
  document.getElementById('v-ins').innerHTML=`<div class="row">
    <div class="card" style="flex:1.6"><div class="bnd azul">INSPECCIONES CARGADAS (${R.length})</div>
      <div class="preg">Si subes de nuevo un archivo, las filas del mismo equipo + posición + fecha se reemplazan (no se duplican).</div>
      <div style="overflow:auto;max-height:62vh"><table class="t"><thead><tr><th class="c">Fecha</th><th>Cód. SAP</th><th class="r">Horómetro</th><th class="r">Km</th><th class="c">Pos.</th><th>Serie</th><th>Marca</th><th>Modelo</th><th>Medida</th>
        <th class="r">Cocada</th><th class="r">Presión</th><th>Observación</th>${ad?'<th></th>':''}</tr></thead>
      <tbody>${R.slice(0,1500).map(r=>`<tr><td class="c">${fmtDate(r.fecha)}</td><td class="mono">${esc(r.cod_sap)}</td><td class="r">${r.horometro!=null?f0(r.horometro):''}</td><td class="r">${r.km!=null?f0(r.km):''}</td>
        <td class="c">${r.posicion}</td><td class="mono">${esc(r.serie||'')}</td><td>${esc(r.marca||'')}</td><td>${esc(r.modelo||'')}</td><td>${esc(r.medida||'')}</td>
        <td class="r"><b>${r.cocada!=null?f1(r.cocada):''}</b></td><td class="r">${r.presion??''}</td><td>${esc(r.observacion||'')}</td>
        ${ad?`<td class="c"><button class="fx" data-delins="${r.id}" title="Eliminar esta fila">✕</button></td>`:''}</tr>`).join('')||'<tr><td colspan="13" class="vacio">Sin inspecciones.</td></tr>'}</tbody></table></div></div>
    <div class="card" style="flex:1"><div class="bnd verde">PLANTILLA Y CÁLCULO</div>
      <div class="preg"><b>📄 Plantilla</b> descarga un Excel con <b>una hoja por equipo</b> y una fila por posición, con la serie, marca y medida de la última inspección.
        En obra solo se llena FECHA, HORÓMETRO, COCADA (promedio de 3 puntos) y, si se mide, PRESIÓN. Si se cambió una llanta, se escribe la serie nueva.</div>
      <div class="formula">
        <b>Desgaste</b> = cocada al montar − cocada actual (mm)<br>
        <b>Horas trabajadas</b> = horómetro actual − horómetro al montar<br>
        <b>Rendimiento</b> = horas (o km) ÷ desgaste → <b>h/mm</b> (o <b>km/mm</b> en equipos con contador en KM)<br>
        <b>Le quedan</b> = (cocada actual − mínimo de retiro) × h/mm<br>
        <b>Retiro estimado</b> = fecha de la medición + horas que le quedan ÷ HR/día<br>
        <b>Vida proyectada</b> = (cocada nueva − mínimo) × h/mm<br>
        <b>Costo</b> = (precio + reparaciones) ÷ vida → <b>USD/h</b></div>
      <div class="preg">Con <b>serie / N° de fuego</b> la llanta se sigue aunque la roten. Sin serie se sigue por posición, y un cambio se detecta cuando la cocada sube más de 2 mm.
        El HR/día sale del Maestro de Equipos; si falta, se calcula con los horómetros de las inspecciones.</div></div></div>`;
  document.querySelectorAll('[data-delins]').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Eliminar esta fila de inspección?'))return;
    const {error}=await sb.from('neu_inspecciones').delete().eq('id',b.dataset.delins);
    if(error)return alert('No se pudo eliminar: '+error.message);
    INSP=INSP.filter(r=>String(r.id)!==b.dataset.delins); recalcular();
  });
}

        <td class="r">${inp('neu_param_marca',p.id,'hmm_ref',p.hmm_ref,'number')}</td>

      <td class="r">${inp('neu_param_presion',p.id,'presion_max',p.presion_max,'number')}</td>${del('neu_param_presion',p.id)}</tr>`).join('')||'<tr><td colspan="6" class="dim">Sin presiones definidas.</td></tr>'}</tbody></table>

    const arr={neu_param_marca:PMAR,neu_param_medida:PMED,neu_param_presion:PPRE}[el.dataset.tb];

const COLS=['FECHA','COD SAP','HOROMETRO','KILOMETRAJE','POSICION','SERIE / N° FUEGO','MARCA','MODELO','MEDIDA','COCADA (mm)','PRESION (psi)','REPARACION (USD)','OBSERVACION'];
const INSTR=[['PLANTILLA DE INSPECCIÓN DE NEUMÁTICOS — una hoja por equipo, una fila por llanta'],[''],
  ['1. Cada hoja es UN equipo. El nombre de la hoja es su Cód. SAP (ej. ECV140). Para otro equipo, copia la hoja y cámbiale el nombre.'],
  ['2. Llenar en cada fila: FECHA (dd/mm/aaaa), HOROMETRO, POSICION (1, 2, 3…) y COCADA (mm, promedio de 3 puntos de la banda).'],
  ['3. SERIE / N° FUEGO, MARCA, MODELO y MEDIDA: llenarlos la primera vez y cuando se cambia una llanta. Si no hay serie, dejarla vacía (se sigue por posición).'],
  ['4. PRESION (psi en frío), KILOMETRAJE, REPARACION (USD) y OBSERVACION son opcionales.'],
  ['5. Las filas sin COCADA no se cargan. Se puede subir el mismo archivo varias veces: equipo + posición + fecha se reemplaza, no se duplica.'],
  [''],['EJEMPLO (no copiar esta fila a la hoja del equipo):'],
  COLS,['23/04/2026','ECV146',3555,48210,1,'TK-24-00871','TECHKING','ETDT','325/95 R24',14.5,120,'','']];

function hojaEquipo(sap,n,ult){
  const rows=[COLS];
  for(let p=1;p<=n;p++){const u=(ult||[]).find(r=>+r.posicion===p)||{};
    rows.push(['',sap||'',''  ,'',p,u.serie||'',u.marca||'',u.modelo||'',u.medida||'','','','','']);}
  const ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=ANCHOS; return ws;
}

      const R=INSP.filter(r=>nrm(r.cod_sap)===nrm(sap)), ultF=R.reduce((m,r)=>r.fecha>m?r.fecha:m,'');
      const U=R.filter(r=>r.fecha===ultF), nom=nrm((eqDe(sap)||{}).equipo);
      const n=U.length?Math.max(...U.map(r=>+r.posicion)):(/VOLQUETE/.test(nom)?12:/CISTERNA/.test(nom)?10:6);
      XLSX.utils.book_append_sheet(wb,hojaEquipo(sap,n,U),String(sap).slice(0,31));
    });
    XLSX.writeFile(wb,`Plantilla_neumaticos_${isoDe(new Date())}.xlsx`); cerrar();
  };
};

/* ═════════════ SUBIR INSPECCIÓN ═════════════ */
function aFecha(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return isoDe(v);
  if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:null;}
  const s=String(v).trim(); let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[1]}-${m[2]}-${m[3]}`:null;
}
const aNum=v=>{if(v==null||v==='')return null;const n=+String(v).replace(/,/g,'');return isFinite(n)?n:null;};
btnSubir.onclick=()=>inFile.click();
inFile.onchange=async()=>{
  const f=inFile.files[0]; inFile.value=''; if(!f)return;
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
  const regs=[], avisos=[];
  wb.SheetNames.forEach(hn=>{
    if(/INSTRUC/i.test(hn))return;
    const A=XLSX.utils.sheet_to_json(wb.Sheets[hn],{header:1,raw:true,defval:''});
    const hi=A.findIndex(r=>r.some(c=>nrm(c)==='POSICION')); if(hi<0)return;
    const H=A[hi].map(nrm), col=(...ks)=>H.findIndex(h=>ks.some(k=>h.startsWith(k)));
    const c={f:col('FECHA'),s:col('COD SAP','CODIGO','EQUIPO'),hr:col('HOROMETRO','HR'),km:col('KILOMETRAJE','KM'),p:col('POSICION'),se:col('SERIE','N° FUEGO','NRO FUEGO'),
      ma:col('MARCA'),mo:col('MODELO'),me:col('MEDIDA'),co:col('COCADA'),pr:col('PRESION'),rp:col('REPARACION'),ob:col('OBSERVACION')};
    A.slice(hi+1).forEach((r,i)=>{
      const coc=aNum(r[c.co]); if(coc==null)return;              // fila sin medición: se ignora
      const sap=String((c.s>=0&&r[c.s])||hn).trim().toUpperCase(), fecha=aFecha(r[c.f]), pos=aNum(r[c.p]);
      if(/^(ECV000|PLANTILLA|HOJA\d*|SHEET\d*|EQUIPO)$/.test(sap)){avisos.push(`${hn} fila ${hi+i+2}: falta el Cód. SAP (ponlo en la columna COD SAP o como nombre de la hoja)`);return;}
      if(!fecha||!pos){avisos.push(`${hn} fila ${hi+i+2}: falta ${!fecha?'FECHA':'POSICION'}`);return;}
      regs.push({cod_sap:sap,fecha,posicion:pos,horometro:aNum(r[c.hr]),km:c.km>=0?aNum(r[c.km]):null,
        serie:c.se>=0&&String(r[c.se]).trim()?String(r[c.se]).trim().toUpperCase():null,
        marca:c.ma>=0&&String(r[c.ma]).trim()?String(r[c.ma]).trim():null, modelo:c.mo>=0&&String(r[c.mo]).trim()?String(r[c.mo]).trim():null,
        medida:c.me>=0&&String(r[c.me]).trim()?String(r[c.me]).trim().toUpperCase():null, cocada:coc,
        presion:c.pr>=0?aNum(r[c.pr]):null, reparacion_usd:c.rp>=0?aNum(r[c.rp]):null,
        observacion:c.ob>=0&&String(r[c.ob]).trim()?String(r[c.ob]).trim():null, registrado_por:perfil?perfil.nombre:null});
    });
  });
  // marca / medida faltante: se toma de la medición anterior de esa misma llanta (serie o posición)
  regs.forEach(r=>{ if(r.marca&&r.medida)return;
    const prev=INSP.filter(x=>r.serie?nrm(x.serie)===nrm(r.serie):(nrm(x.cod_sap)===nrm(r.cod_sap)&&+x.posicion===+r.posicion)).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    if(prev){ r.marca=r.marca||prev.marca; r.medida=r.medida||prev.medida; r.modelo=r.modelo||prev.modelo; } });
  if(!regs.length)return alert('No se encontraron filas con COCADA.\n\nRevisa que el archivo tenga la columna POSICION en el encabezado.'+(avisos.length?'\n\n'+avisos.slice(0,6).join('\n'):''));
  const sinEq=[...new Set(regs.map(r=>r.cod_sap).filter(s=>!eqDe(s)))];
  UNI_CACHE.clear(); const dsf=neuDesfase(regs);
  const clave=r=>nrm(r.cod_sap)+'|'+r.posicion+'|'+r.fecha, ya=new Set(INSP.map(clave));
  const nuevas=regs.filter(r=>!ya.has(clave(r))).length;
  const fechas=[...new Set(regs.map(r=>r.fecha))].sort();
  if(!confirm(`${f.name}\n\nMediciones leídas: ${regs.length}\nEquipos: ${new Set(regs.map(r=>r.cod_sap)).size}\nFechas: ${fechas.map(fmtDate).join(', ')}\n`
    +`Nuevas: ${nuevas} · Reemplazan una ya cargada: ${regs.length-nuevas}\n`
    +(sinEq.length?`\n⚠ Códigos que no están en el Maestro: ${sinEq.join(', ')}\n`:'')
    +(dsf.panel||dsf.hm?`\n⟲ Equipos con desfase de horómetro: ${dsf.panel} inspección(es) de panel convertidas a horas máquina · ${dsf.hm} ya venían en horas máquina\n`:'')
    +(avisos.length?`\n⚠ ${avisos.length} fila(s) omitidas por falta de fecha o posición.\n`:'')+'\n¿Cargar?'))return;
  pie.textContent='Guardando…';
  for(let i=0;i<regs.length;i+=500){
    const {error}=await sb.from('neu_inspecciones').upsert(regs.slice(i,i+500),{onConflict:'cod_sap,posicion,fecha'});
    if(error){alert('No se pudo guardar: '+error.message);break;}
  }
  await cargarTodo();
};

/* ═════════════ CARGA ═════════════ */
async function traerTodo(tabla,orden){
  let out=[],desde=0;
  for(;;){ let q=sb.from(tabla).select('*'); if(orden)q=q.order(orden);
    const {data,error}=await q.range(desde,desde+999); if(error)return {data:out,error};
    out=out.concat(data||[]); if(!data||data.length<1000)break; desde+=1000; }
  return {data:out,error:null};
}
async function cargarParametros(){
  const [a,b,c,d]=await Promise.all([sb.from('neu_param_marca').select('*'),sb.from('neu_param_medida').select('*'),
    sb.from('neu_param_presion').select('*'),sb.from('neu_parametros').select('*').eq('id',1).maybeSingle()]);
  PMAR=a.data||[]; PMED=b.data||[]; PPRE=c.data||[]; PAR=d.data||{};
  try{ const x=await sb.from('desfase_horometro').select('*').order('fecha'); DESF=x.error?[]:(x.data||[]); }catch(_){ DESF=[]; }
  return a.error||b.error||c.error||d.error;
}
/* ── Desfase de horómetros (tabla de Equipos): todo se guarda en horas máquina ── */
let DESF=[];
const desfDe=sap=>DESF.filter(d=>nrm(d.cod_sap)===nrm(sap));
const desfaseEn=(sap,f)=>desfDe(sap).filter(d=>String(d.fecha)<=f).reduce((s,d)=>s+(+d.hm_dia-(+d.panel_dia||0)),0);
const hmRefEn=(sap,f)=>{const D=desfDe(sap).filter(d=>String(d.fecha)<=f);return D.length?Math.max(...D.map(d=>+d.hm_dia)):null;};
/* Convierte las lecturas de panel a horas máquina antes de guardar. Si una
   lectura no encaja ni como panel ni como horas máquina, se pregunta.     */
function neuDesfase(regs){
  const res={panel:0,hm:0,duda:0};
  const grupos=new Map();
  regs.forEach(r=>{ if(!desfDe(r.cod_sap).length)return;
    const campo=uniDe(r.cod_sap)==='km'?'km':'horometro', v=r[campo]; if(v==null)return;
    const k=nrm(r.cod_sap)+'|'+r.fecha+'|'+v; if(!grupos.has(k))grupos.set(k,{sap:r.cod_sap,fecha:r.fecha,campo,v,rows:[]}); grupos.get(k).rows.push(r); });
  for(const g of grupos.values()){
    const des=desfaseEn(g.sap,g.fecha); if(!des)continue;
    const ref=hmRefEn(g.sap,g.fecha), e=eqDe(g.sap);
    let tipo=g.v<ref?'panel':'hm';
    // ¿encaja con lo esperado según el Maestro? (último HR/KM + HR/día × días)
    if(e&&e.hrkm_actual!=null&&e.fecha_lectura){
      let base=+e.hrkm_actual; const fb=String(e.fecha_lectura).slice(0,10);
      const rb=hmRefEn(g.sap,fb); if(rb!=null&&base<rb)base+=desfaseEn(g.sap,fb);
      const dd=(new Date(g.fecha)-new Date(fb))/86400000, hd=+e.hr_dia||0, km=g.campo==='km';
      const tol=(km?400:48)+Math.abs(dd)*(hd?hd*0.5:(km?200:12)), exp=base+hd*dd;
      const ok=x=>hd?Math.abs(x-exp)<=tol:(dd>=0?x>=base-tol:x<=base+tol);
      const val=tipo==='panel'?g.v+des:g.v, otro=tipo==='panel'?g.v:g.v+des;
      if(!ok(val)){ if(ok(otro))tipo=tipo==='panel'?'hm':'panel';
        else{ res.duda++;
          tipo=confirm(`${g.sap} · inspección del ${fmtDate(g.fecha)}
Horómetro anotado: ${f0(g.v)}

No coincide con lo esperado (~${f0(exp)} horas máquina).

Aceptar = es del PANEL (se guarda ${f0(g.v+des)})
Cancelar = ya está en HORAS MÁQUINA (se guarda ${f0(g.v)})`)?'panel':'hm'; } }
    }
    res[tipo]++;
    if(tipo==='panel')g.rows.forEach(r=>{r.lectura_panel=g.v; r[g.campo]=g.v+des;});
  }
  return res;
}
async function cargarTodo(){
  pie.textContent='Cargando…';
  const [r,err]=await Promise.all([traerTodo('neu_inspecciones','fecha'),cargarParametros()]);
  if(r.error||err){
    document.getElementById('v-res').innerHTML=`<div class="card"><div class="vacio">No se pudieron leer las tablas de neumáticos.<br><br>
      Si es la primera vez, hay que crearlas en Supabase con el archivo <b>neumaticos_tablas.sql</b>.<br><span class="dim">${esc((r.error||err).message)}</span></div></div>`;
    pie.textContent='Faltan las tablas de neumáticos en Supabase.'; return;
  }
  INSP=r.data||[];
  const oSel=fObra.value, mSel=fMedida.value;
  const obras=[...new Set(INSP.map(x=>(eqDe(x.cod_sap)||{}).cod_proyec).filter(Boolean))].sort();
  fObra.innerHTML='<option value="">Todas las obras</option>'+obras.map(o=>`<option>${esc(o)}</option>`).join(''); fObra.value=oSel;
  const meds=[...new Set(INSP.map(x=>x.medida).filter(Boolean))].sort();
  fMedida.innerHTML='<option value="">Todas las medidas</option>'+meds.map(o=>`<option>${esc(o)}</option>`).join(''); fMedida.value=mSel;
  recalcular();
}
